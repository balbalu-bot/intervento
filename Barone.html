<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<script>
/* RETE DI RISERVA + RADIO DI SQUADRA — modulo comune ai giochi online di balbalu-bot.
   1) Se il collegamento diretto tra due dispositivi non parte (tipico: telefono con i dati
      mobili), la partita passa da sola su un server pubblico (MQTT) che fa da ponte.
   2) Radio "premi e parla": la voce viaggia sullo stesso server, quindi funziona da qualsiasi rete.
   Il gioco non viene modificato: il modulo si aggancia a PeerJS e, se qualcosa va storto, si spegne. */
(function(){
  'use strict';
  if(window.__radioSquadra) return; window.__radioSquadra=1;

  var BROKERS=window.__RADIO_TEST_BROKERS||['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
  var MQTT_URL=window.__RADIO_TEST_MQTT||'https://unpkg.com/mqtt@5.16.1/dist/mqtt.min.js';
  var PFX='balbalu/rr1/', TALK_KEY='KeyN', FALLBACK_MS=7000;
  function rid(){ return Math.random().toString(36).slice(2,10); }
  function tclean(s){ return String(s||'').replace(/[^A-Za-z0-9_.-]/g,'_').slice(0,80); }
  function nowMs(){ return Date.now(); }

  // ================= 1. server ponte (MQTT) =================
  var R={clients:[],subs:{},loading:false,seen:{},seenQ:[],seq:0,id:rid()+rid()};
  function relayStart(){
    if(R.clients.length||R.loading) return;
    if(window.mqtt&&window.mqtt.connect){ connectAll(); return; }
    R.loading=true;
    var s=document.createElement('script'); s.src=MQTT_URL;
    s.onload=function(){ R.loading=false; if(window.mqtt&&window.mqtt.connect) connectAll(); };
    s.onerror=function(){ R.loading=false; };
    (document.head||document.documentElement).appendChild(s);
  }
  function connectAll(){
    BROKERS.forEach(function(u){
      var c; try{ c=window.mqtt.connect(u,{clientId:'bb'+rid()+rid(),keepalive:30,reconnectPeriod:4000,connectTimeout:10000,clean:true}); }catch(e){ return; }
      c.on('connect',function(){ Object.keys(R.subs).forEach(function(t){ try{ c.subscribe(t,{qos:0}); }catch(e){} }); render(); });
      c.on('message',function(t,p){ onRelayMsg(t,p); });
      c.on('error',function(){}); c.on('close',function(){ render(); });
      R.clients.push(c);
    });
  }
  function relayUp(){ for(var i=0;i<R.clients.length;i++) if(R.clients[i].connected) return true; return false; }
  function rsub(t,fn){ t=PFX+t; R.subs[t]=fn; relayStart(); R.clients.forEach(function(c){ if(c.connected) try{ c.subscribe(t,{qos:0}); }catch(e){} }); }
  function runsub(t){ t=PFX+t; delete R.subs[t]; R.clients.forEach(function(c){ try{ c.unsubscribe(t); }catch(e){} }); }
  function rpub(t,o){
    relayStart(); o._m=R.id+':'+(++R.seq);
    var s; try{ s=JSON.stringify(o); }catch(e){ return; }
    R.clients.forEach(function(c){ if(c.connected) try{ c.publish(PFX+t,s,{qos:0}); }catch(e){} });
  }
  var TD=(typeof TextDecoder!=='undefined')?new TextDecoder():null;
  function onRelayMsg(t,p){
    var fn=R.subs[t]; if(!fn) return;
    var o; try{ o=JSON.parse(typeof p==='string'?p:(TD?TD.decode(p):String(p))); }catch(e){ return; }
    if(!o||typeof o!=='object') return;
    var m=o._m;
    if(typeof m==='string'){ if(R.seen[m]) return; R.seen[m]=1; R.seenQ.push(m); if(R.seenQ.length>4000) delete R.seen[R.seenQ.shift()]; }
    try{ fn(o); }catch(e){ setTimeout(function(){ throw e; }); }
  }

  // piccolo gestore di eventi, compatibile con quello di PeerJS
  function Em(){ this._ev={}; }
  Em.prototype.on=function(e,f){ (this._ev[e]=this._ev[e]||[]).push(f); return this; };
  Em.prototype.addListener=Em.prototype.on;
  Em.prototype.once=function(e,f){ var me=this; function g(){ me.off(e,g); return f.apply(me,arguments); } g._f=f; return this.on(e,g); };
  Em.prototype.off=function(e,f){ var a=this._ev[e]; if(!a) return this; if(!f){ delete this._ev[e]; return this; } this._ev[e]=a.filter(function(x){ return x!==f&&x._f!==f; }); return this; };
  Em.prototype.removeListener=Em.prototype.off;
  Em.prototype.removeAllListeners=function(e){ if(e) delete this._ev[e]; else this._ev={}; return this; };
  Em.prototype.listenerCount=function(e){ return (this._ev[e]||[]).length; };
  Em.prototype.listeners=function(e){ return (this._ev[e]||[]).slice(); };
  Em.prototype.emit=function(e){
    var a=(this._ev[e]||[]).slice(), args=[].slice.call(arguments,1), me=this;
    a.forEach(function(f){ try{ f.apply(me,args); }catch(x){ setTimeout(function(){ throw x; }); } });
    return a.length>0;
  };

  var relayNote=0;
  function noteRelay(){ relayNote=nowMs(); render(); setTimeout(render,6000); }

  // --- lato di chi entra: collegamento "doppio" (diretto, altrimenti ponte) ---
  function XConn(provider,target,opts){
    Em.call(this); opts=opts||{};
    this.peer=target; this.provider=provider; this.open=false; this.type='data';
    this.label=opts.label||('dc_'+rid()); this.metadata=opts.metadata; this.serialization=opts.serialization||'binary'; this.reliable=!!opts.reliable;
    this.mode='real'; this.real=null; this.closed=false; this.noRelay=false; this.__radioProxy=true;
  }
  XConn.prototype=Object.create(Em.prototype);
  XConn.prototype.attach=function(real){
    var me=this; me.real=real;
    real.on('open',function(){ if(me.mode!=='real'||me.closed) return; clearTimeout(me.fbT); me.open=true; me.emit('open'); });
    real.on('data',function(d){ if(me.mode==='real'&&!me.closed) me.emit('data',d); });
    real.on('close',function(){ if(me.mode!=='real'||me.closed) return; if(me.open||me.noRelay) me._end(); else me.toRelay(); });
    real.on('error',function(e){ if(me.mode!=='real'||me.closed) return; if(me.open) me.emit('error',e); else if(!me.noRelay) me.toRelay(); });
    me.fbT=setTimeout(function(){ if(!me.open&&me.mode==='real'&&!me.closed&&!me.noRelay) me.toRelay(); },FALLBACK_MS);
  };
  XConn.prototype.toRelay=function(){
    var me=this; if(me.mode==='relay'||me.closed||me.noRelay) return;
    me.mode='relay'; clearTimeout(me.fbT);
    try{ if(me.real) me.real.close(); }catch(e){}
    me.gid=tclean(me.provider.id||('g'+rid())); me.cid=rid(); me.hostT='h/'+tclean(me.peer); me.inT='g/'+me.gid+'/'+me.cid;
    rsub(me.inT,function(o){ me._msg(o); });
    var tries=0;
    (function hello(){
      if(me.open||me.closed) return;
      if(++tries>24){ me.emit('error',{type:'peer-unavailable',message:'Collegamento non riuscito'}); me._end(); return; }
      rpub(me.hostT,{t:'hello',from:me.gid,cid:me.cid});
      me.helloT=setTimeout(hello,1500);
    })();
  };
  XConn.prototype._msg=function(o){
    var me=this; if(me.closed) return; me.last=nowMs();
    if(o.t==='ack'&&!me.open){
      me.open=true; clearTimeout(me.helloT); noteRelay(); me.emit('open');
      me.pingT=setInterval(function(){ if(nowMs()-me.last>16000){ me._end(); return; } rpub(me.hostT,{t:'p',from:me.gid,cid:me.cid}); },4000);
    } else if(o.t==='d'&&me.open) me.emit('data',o.d);
    else if(o.t==='bye') me._end();
  };
  XConn.prototype.send=function(d){
    if(this.closed) return;
    if(this.mode==='real'){ if(this.real) return this.real.send(d); }
    else if(this.open) rpub(this.hostT,{t:'d',from:this.gid,cid:this.cid,d:d});
  };
  XConn.prototype.close=function(){
    if(this.closed) return;
    if(this.mode==='real'){ try{ if(this.real) this.real.close(); }catch(e){} }
    else rpub(this.hostT,{t:'bye',from:this.gid,cid:this.cid});
    this._end();
  };
  XConn.prototype._end=function(){
    if(this.closed) return; this.closed=true; this.open=false;
    clearTimeout(this.fbT); clearTimeout(this.helloT); clearInterval(this.pingT);
    if(this.inT) runsub(this.inT);
    this.emit('close');
  };
  Object.defineProperty(XConn.prototype,'dataChannel',{get:function(){ return this.real&&this.mode==='real'?this.real.dataChannel:null; }});
  Object.defineProperty(XConn.prototype,'peerConnection',{get:function(){ return this.real&&this.mode==='real'?this.real.peerConnection:null; }});

  // --- lato di chi crea la stanza: accetta anche chi arriva dal ponte ---
  function HConn(host,from,cid){
    Em.call(this); this.peer=from; this.cid=cid; this.provider=host; this.open=false; this.closed=false; this.type='data';
    this.label='relay_'+cid; this.serialization='json'; this.reliable=true; this.__relayH=true; this.outT='g/'+tclean(from)+'/'+cid; this.last=nowMs();
    var me=this;
    this.pingT=setInterval(function(){ if(nowMs()-me.last>16000){ me._end(); return; } rpub(me.outT,{t:'p'}); },4000);
  }
  HConn.prototype=Object.create(Em.prototype);
  HConn.prototype.send=function(d){ if(this.open&&!this.closed) rpub(this.outT,{t:'d',d:d}); };
  HConn.prototype.close=function(){ if(this.closed) return; rpub(this.outT,{t:'bye'}); this._end(); };
  HConn.prototype._end=function(){
    if(this.closed) return; this.closed=true; this.open=false; clearInterval(this.pingT);
    var rh=this.provider.__rh; if(rh&&rh.conns[this.cid]===this) delete rh.conns[this.cid];
    this.emit('close');
  };
  function relayHost(p,superEmit){
    if(p.__rh||!p.id) return;
    var rh=p.__rh={conns:{},topic:'h/'+tclean(p.id)};
    rsub(rh.topic,function(o){
      if(p.destroyed||typeof o.cid!=='string'||typeof o.from!=='string') return;
      var c=rh.conns[o.cid];
      if(o.t==='hello'){
        if(!c){
          c=new HConn(p,o.from,o.cid); rh.conns[o.cid]=c;
          superEmit('connection',c);
          setTimeout(function(){ if(!c.closed){ c.open=true; noteRelay(); c.emit('open'); } },0);
        }
        rpub(c.outT,{t:'ack'});
      } else if(c){
        c.last=nowMs();
        if(o.t==='d'&&c.open) c.emit('data',o.d);
        else if(o.t==='bye') c._end();
      }
    });
  }
  function relayHostStop(p){
    var rh=p.__rh; if(!rh) return; p.__rh=null; runsub(rh.topic);
    for(var k in rh.conns){ try{ rh.conns[k].close(); }catch(e){} }
  }

  // ================= 2. aggancio a PeerJS =================
  var chan='', chanOwner=null;
  function noteChannel(id,owner){
    if(typeof id!=='string'||!id) return;
    if(chan===id){ chanOwner=owner||chanOwner; return; }
    leaveChannel(); chan=id; chanOwner=owner||null; joinChannel();
  }
  function wrap(P){
    if(typeof P!=='function'||P.__radioWrapped) return P;
    var W;
    try{
      W=class extends P{
        constructor(){
          super(...arguments);
          var me=this, fixed=(typeof arguments[0]==='string')?arguments[0]:null;
          me.__proxies=[];
          try{
            if(fixed) me.on('open',function(){ relayHost(me,function(ev,a){ return P.prototype.emit.call(me,ev,a); }); if(!me.__radioGuest) noteChannel(fixed,me); });
            me.on('connection',function(){ if(!me.__radioGuest&&me.id) noteChannel(me.id,me); });
          }catch(e){}
        }
        connect(id,opts){
          this.__radioGuest=true;
          try{ noteChannel(id,this); }catch(e){}
          var real=super.connect.apply(this,arguments);
          if(!real||typeof real.on!=='function') return real;
          var x=new XConn(this,id,opts); x.attach(real); this.__proxies.push(x);
          return x;
        }
        emit(ev,a){
          // chi crea la stanza vede un collegamento diretto solo quando è davvero aperto:
          // se non si apre, il gioco non lo vede e l'altro arriva dal ponte
          if(ev==='connection'&&a&&!a.__relayH&&!a.open&&typeof a.on==='function'){
            var done=false;
            a.on('open',()=>{ if(done) return; done=true; super.emit('connection',a); setTimeout(function(){ try{ a.emit('open'); }catch(e){} },0); });
            return true;
          }
          if(ev==='error'&&a&&a.type==='peer-unavailable'&&this.__proxies){
            this.__proxies.forEach(function(x){ if(!x.open){ x.noRelay=true; clearTimeout(x.fbT); } });
          }
          return super.emit.apply(this,arguments);
        }
        destroy(){
          try{ relayHostStop(this); }catch(e){}
          try{ (this.__proxies||[]).forEach(function(x){ x.close(); }); }catch(e){}
          try{ if(chanOwner===this) setTimeout(function(){ if(chanOwner&&chanOwner.destroyed) leaveChannel(); },0); }catch(e){}
          return super.destroy.apply(this,arguments);
        }
      };
      W.__radioWrapped=true;
    }catch(e){ return P; }
    return W;
  }
  try{
    var cur=window.Peer;
    if(cur) cur=wrap(cur);
    Object.defineProperty(window,'Peer',{configurable:true,enumerable:true,
      get:function(){ return cur; },
      set:function(v){ if(window.__RADIO_TEST_PEER) v=window.__RADIO_TEST_PEER; cur=wrap(v); }});
  }catch(e){}

  // ================= 3. radio: presenze e voce sul ponte =================
  var myId=rid()+rid(), members={}, micStream=null, talking=false, status='', needTap=false, stT=null;
  function chanT(){ return 'r/'+tclean(chan); }
  var lastName='';
  document.addEventListener('input',function(e){ var t=e.target; if(t&&t.matches&&t.matches('#nickname,#name,#nome,#nick,#playerName,#nm,#cs')) lastName=String(t.value||''); },true);
  function myName(){
    var el=document.querySelector('#nickname,#name,#nome,#nick,#playerName,#nm,#cs');
    var v=el&&el.value?String(el.value).trim():(lastName||'').trim();
    if(!v){ try{ v=localStorage.getItem('autoscontri-name')||localStorage.getItem('br3_name')||''; }catch(e){} }
    return clean(v);
  }
  function clean(s){ return String(s||'').replace(/[\u0000-\u001f<>]/g,'').slice(0,14)||'Giocatore'; }
  function joinChannel(){
    if(!chan) return;
    members={};
    rsub(chanT(),onRadio);
    clearInterval(stT); stT=setInterval(announce,2000); announce();
    render();
  }
  function leaveChannel(){
    if(chan){ try{ rpub(chanT(),{t:'bye',id:myId}); }catch(e){} runsub(chanT()); }
    clearInterval(stT); members={}; chan=''; chanOwner=null; setTalk(false); render();
  }
  function announce(){ if(chan) rpub(chanT(),{t:'st',id:myId,n:myName(),vo:micStream?1:0,tk:talking?1:0}); expire(); render(); }
  function expire(){ var t=nowMs(); for(var id in members) if(t-members[id].last>7000) delete members[id]; }
  function onRadio(o){
    if(typeof o.id!=='string'||o.id===myId) return;
    var m=members[o.id]||(members[o.id]={n:'Giocatore',vo:0,tk:0,last:0,heard:0,next:0});
    m.last=nowMs();
    if(o.t==='st'){ m.n=clean(o.n); m.vo=o.vo?1:0; m.tk=o.tk?1:0; render(); }
    else if(o.t==='a'&&typeof o.d==='string'){ m.heard=nowMs(); m.n=o.n?clean(o.n):m.n; playChunk(m,o.d); if(!m.tkShow){ m.tkShow=1; render(); } }
    else if(o.t==='bye'){ delete members[o.id]; render(); }
  }

  // --- audio: 8000 Hz, mu-law (come una radio/telefono), pacchetti da 200 ms ---
  var AC=null, proc=null, srcNode=null, sinkGain=null, buf=[], pos=0, aSeq=0;
  function ensureAC(){
    if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ AC=new C(); }catch(e){ return null; } }
    if(AC.state==='suspended'&&AC.resume){ try{ AC.resume(); }catch(e){} }
    return AC;
  }
  function muEnc(x){ var s=x<0?0x80:0; if(x<0) x=-x; if(x>1) x=1; var v=Math.min(32635,Math.floor(x*32767))+132, e=7; for(var m=0x4000;(v&m)===0&&e>0;m>>=1) e--; var man=(v>>(e+3))&0x0F; return ~(s|(e<<4)|man)&0xFF; }
  var MU=new Float32Array(256);
  (function(){ for(var i=0;i<256;i++){ var u=~i&0xFF, s=u&0x80, e=(u>>4)&7, m=u&0x0F, v=((m<<3)+132)<<e; v-=132; MU[i]=(s?-v:v)/32768; } })();
  function b64(bytes){ var s=''; for(var i=0;i<bytes.length;i+=4096) s+=String.fromCharCode.apply(null,bytes.slice(i,i+4096)); return btoa(s); }
  function unb64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  function startCapture(stream){
    var ac=ensureAC(); if(!ac) return false;
    try{
      srcNode=ac.createMediaStreamSource(stream);
      proc=(ac.createScriptProcessor||ac.createJavaScriptNode).call(ac,4096,1,1);
      sinkGain=ac.createGain(); sinkGain.gain.value=0;
      srcNode.connect(proc); proc.connect(sinkGain); sinkGain.connect(ac.destination);
    }catch(e){ return false; }
    var ratio=ac.sampleRate/8000;
    proc.onaudioprocess=function(ev){
      if(!talking||!chan) { pos=0; return; }
      var inp=ev.inputBuffer.getChannelData(0), n=inp.length;
      while(pos<n){
        var a=Math.floor(pos), b=Math.min(n,Math.floor(pos+ratio)), sum=0, c=0;
        for(var i=a;i<b;i++){ sum+=inp[i]; c++; }
        buf.push(muEnc(c?sum/c:inp[a]||0)); pos+=ratio;
      }
      pos-=n;
      if(buf.length>=1600) flush();
    };
    return true;
  }
  function flush(){ if(!buf.length) return; var bytes=buf; buf=[]; rpub(chanT(),{t:'a',id:myId,n:myName(),s:++aSeq,d:b64(bytes)}); }
  function playChunk(m,d){
    var ac=AC; if(!ac||ac.state!=='running'){ needTap=true; ensureAC(); render(); if(!ac) return; }
    var bytes; try{ bytes=unb64(d); }catch(e){ return; }
    if(!bytes.length||bytes.length>8000) return;
    var sr=ac.sampleRate, len=Math.floor(bytes.length*sr/8000), out=ac.createBuffer(1,len,sr), ch=out.getChannelData(0), k=8000/sr;
    for(var i=0;i<len;i++){ var p=i*k, j=Math.floor(p), f=p-j, x0=MU[bytes[j]], x1=MU[bytes[Math.min(bytes.length-1,j+1)]]; ch[i]=(x0+(x1-x0)*f)*1.6; }
    var s=ac.createBufferSource(); s.buffer=out; s.connect(ac.destination);
    var t=ac.currentTime;
    if(m.next<t+0.05||m.next>t+1.2) m.next=t+0.25;
    try{ s.start(m.next); }catch(e){}
    m.next+=out.duration;
  }
  function micOn(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ status='Questo browser non permette il microfono'; render(); return; }
    ensureAC();
    status='Consenti il microfono…'; render();
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false}).then(function(s){
      micStream=s; status='';
      if(!startCapture(s)){ status='Audio non disponibile su questo browser'; }
      announce();
    },function(){ status='Microfono non consentito'; render(); });
  }
  function micOff(){
    setTalk(false);
    try{ if(proc){ proc.onaudioprocess=null; proc.disconnect(); } if(srcNode) srcNode.disconnect(); if(sinkGain) sinkGain.disconnect(); }catch(e){}
    proc=null; srcNode=null; sinkGain=null;
    if(micStream){ try{ micStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} }
    micStream=null; announce();
  }
  function setTalk(b){
    var t=!!(b&&micStream&&chan);
    if(t===talking) return;
    talking=t; if(!t) flush(); else { ensureAC(); buf=[]; pos=0; }
    announce();
  }
  function unlock(){
    var ac=AC||(needTap||micStream?ensureAC():null);
    if(!AC) ensureAC(); else if(AC.state==='suspended') ensureAC();
    if(needTap){ needTap=false; render(); }
  }
  window.addEventListener('pointerdown',unlock,true);
  window.addEventListener('touchstart',unlock,{capture:true,passive:true});
  window.addEventListener('keydown',function(){ if(!AC||AC.state!=='running') unlock(); },true);
  function isTyping(e){ var t=e.target; return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable); }
  window.addEventListener('keydown',function(e){ if(e.code===TALK_KEY&&!isTyping(e)&&micStream&&!e.repeat) setTalk(true); },true);
  window.addEventListener('keyup',function(e){ if(e.code===TALK_KEY) setTalk(false); },true);
  window.addEventListener('blur',function(){ setTalk(false); });

  // ================= 4. pulsanti sullo schermo =================
  var box=null, bRadio, bTalk, lab;
  function el(tag){ return document.createElement(tag); }
  function build(){
    if(box||!document.body) return;
    var css=el('style');
    css.textContent='#radioSq{position:fixed;right:max(8px,env(safe-area-inset-right));top:38%;z-index:2147483000;display:none;flex-direction:column;align-items:flex-end;gap:6px;font:600 13px system-ui,-apple-system,Arial,sans-serif;-webkit-user-select:none;user-select:none;pointer-events:none}'+
      '#radioSq button{pointer-events:auto;border:2px solid #f2d9a8;color:#fff8e8;border-radius:22px;font:700 13px system-ui,-apple-system,Arial,sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}'+
      '#radioSq .r{background:#3b2a1acc;padding:7px 12px}#radioSq .r.on{background:#1f6b3acc}'+
      '#radioSq .t{width:66px;height:66px;border-radius:50%;background:#8a1e1ecc;font-size:14px;line-height:1.1}#radioSq .t.on{background:#e23b2a;box-shadow:0 0 0 5px #e23b2a55}'+
      '#radioSq .l{background:#000a;color:#ffe9b0;padding:4px 9px;border-radius:9px;max-width:190px;text-align:right;display:none}';
    document.head.appendChild(css);
    box=el('div'); box.id='radioSq';
    bRadio=el('button'); bRadio.className='r';
    bTalk=el('button'); bTalk.className='t'; bTalk.innerHTML='🎙<br>PARLA';
    lab=el('div'); lab.className='l';
    box.appendChild(bRadio); box.appendChild(bTalk); box.appendChild(lab);
    document.body.appendChild(box);
    // tocco breve = accendi/spegni; tieni premuto e trascina = sposta la radio
    var drag=null;

    bRadio.addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation(); try{ bRadio.setPointerCapture(e.pointerId); }catch(x){}

    bRadio.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); });
    var down=function(e){ e.preventDefault(); e.stopPropagation(); try{ bTalk.setPointerCapture(e.pointerId); }catch(x){} unlock(); setTalk(true); render(); };

    bTalk.addEventListener('pointerdown',down); bTalk.addEventListener('pointerup',up); bTalk.addEventListener('pointercancel',up); bTalk.addEventListener('lostpointercapture',up);
    ['click','touchstart','touchend','mousedown','mouseup'].forEach(function(t){ bTalk.addEventListener(t,function(e){ e.stopPropagation(); if(t!=='touchstart') e.preventDefault(); },{passive:false}); });
  }
  function render(){
    if(!box){ if(document.body) build(); if(!box) return; }
    var on=!!chan;
    box.style.display=on?'flex':'none';
    if(!on) return;
    expire();

    bRadio.className='r'+(micStream?' on':'');
    bTalk.style.display=micStream?'block':'none';
    bTalk.className='t'+(talking?' on':'');

    var txt=status||(needTap?'Tocca lo schermo per sentire le voci':(who.length?'📻 '+who.join(', '):(t-relayNote<6000?'🛰 collegati tramite rete di riserva':'')));
    lab.textContent=txt; lab.style.display=txt?'block':'none';
  }
  setInterval(render,500);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ build(); render(); }); else { build(); render(); }
  window.addEventListener('pagehide',function(){ try{ if(chan) rpub(chanT(),{t:'bye',id:myId}); }catch(e){} });

})();

<script>
(function(){

var unitSeq=0, teamKills=0, curFac=null;
var MYNAME='Primo';
try{
  MODE=localStorage.getItem('br3_mode')||'single'; SIDE=localStorage.getItem('br2_side')||'barone'; VEH=localStorage.getItem('br2_veh')||'aereo';
  OM=localStorage.getItem('br4_om')||'coop'; NALLY=parseInt(localStorage.getItem('br4_na')||'2',10)||2; PTEAM=parseInt(localStorage.getItem('br4_tm')||'0',10)||0;
  V1=localStorage.getItem('br3_v1')||'aereo'; V2=localStorage.getItem('br3_v2')||'aereo'; MYNAME=localStorage.getItem('br3_name')||'Primo';
}catch(e){}
if(MODE!=='single'&&MODE!=='local2'&&MODE!=='online')MODE='single';
if(SIDE!=='barone'&&SIDE!=='nemico')SIDE='barone'; if(VEH!=='aereo'&&VEH!=='carro')VEH='aereo';
if(OM!=='coop'&&OM!=='vs'&&OM!=='pvp')OM='coop'; PTEAM=clamp(PTEAM,0,4); NALLY=clamp(NALLY,1,3);
if(V1!=='aereo'&&V1!=='carro')V1='aereo'; if(V2!=='aereo'&&V2!=='carro')V2='aereo';
if(TOUCH&&MODE==='local2')MODE='single';
var PF='G', EF='A';

// tasti: [su, giù, gas+, gas−, sinistra, destra, fuoco, bomba/mitra, tonneau/gira]
var MAP_SINGLE={up:38,down:40,thrUp:87,thrDn:83,left:37,right:39,fire:32,alt:66,roll:82};
var MAP_P1={up:87,down:83,thrUp:68,thrDn:65,left:65,right:68,fire:70,alt:71,roll:82};
var MAP_P2={up:38,down:40,thrUp:39,thrDn:37,left:37,right:39,fire:75,alt:76,roll:79};

// ---------- stato ----------
var state='title', LP=[], ME=null, P=null, PT=null;
var planes=[], tanks=[], bullets=[], shells=[], bombs=[], parts=[], balloons=[], msgs=[], rings=[];
var ringT=12;
var wave=0, waveT=0, best=0, overT=0, shake=0, gameT=0, paused=false;
var camX=BASE.G, camY=GROUND-600, Z=1;
var keys={}, held={}, uiBtns=[];
function bestKey(){return 'br2_best_'+SIDE+'_'+VEH;}
function loadBest(){try{best=parseInt(localStorage.getItem(bestKey())||'0',10)||0;}catch(e){best=0;}}
loadBest();

// ---------- scenario ----------
var farClouds=[], nearClouds=[], feats=[], hills=[], HP=3200, i;
function mkCloud(x,y,big){
  var c={x:x,y:y,p:[]}, n=4+Math.floor(Math.random()*4), w=big?rnd(140,300):rnd(80,170);
  for(var k=0;k<n;k++){c.p.push({dx:rnd(-w/2,w/2),dy:rnd(-w*0.12,w*0.08),r:rnd(w*0.16,w*0.3)});}

}
for(i=0;i<16;i++) farClouds.push(mkCloud(rnd(0,4200),rnd(-300,GROUND-300),false));
for(i=0;i<22;i++) nearClouds.push(mkCloud(rnd(0,WORLD),rnd(250,GROUND-700),true));

for(i=0;i<170;i++){
  var fx=rnd(0,WORLD); if(Math.abs(wrapD(fx-BASE.G))<460||Math.abs(wrapD(fx-BASE.A))<460) continue;
  var front=(fx>3600&&fx<6800), r0=Math.random();
  feats.push({x:fx,k:front?(r0<0.75?'crater':'post'):(r0<0.35?'crater':(r0<0.85?'tree':'house')),s:rnd(0.6,1.4)});
}
var trenches=[4250,4520,4900,5180,5600,6100];

// ---------- audio (opzionale) ----------
var AC=null, eng=null, engGain=null, master=null, noiseBuf=null, muted=false;
function initAudio(){
  if(AC){ if(AC.resume&&AC.state==='suspended'){try{AC.resume();}catch(e){}} return; }
  var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  try{
    AC=new C(); master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
    eng=AC.createOscillator(); eng.type='sawtooth';
    var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
    engGain=AC.createGain(); engGain.gain.value=0;
    eng.connect(lp); lp.connect(engGain); engGain.connect(master); eng.start(0);
    var len=Math.floor(AC.sampleRate*1.2); noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    var d=noiseBuf.getChannelData(0); for(var k=0;k<len;k++) d[k]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function sfx(type,vol){
  if(!AC||muted||!noiseBuf) return;
  try{
    var t=AC.currentTime, src=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(), dur=0.06, v=vol||1;
    src.buffer=noiseBuf;
    if(type==='gun'){f.type='bandpass';f.frequency.value=1100;g.gain.setValueAtTime(0.22*v,t);dur=0.06;}
    else if(type==='boom'){f.type='lowpass';f.frequency.value=260;g.gain.setValueAtTime(0.9*v,t);dur=1.1;}
    else if(type==='cannon'){f.type='lowpass';f.frequency.value=500;g.gain.setValueAtTime(0.7*v,t);dur=0.45;}
    else {f.type='highpass';f.frequency.value=2200;g.gain.setValueAtTime(0.18*v,t);dur=0.05;}
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t+dur+0.02);
  }catch(e){}
}
// distanza dal giocatore locale più vicino (per volume e scossoni)
function nearestLP(x,y){var b=1e9; for(var k=0;k<LP.length;k++){var e=LP[k].ent; if(!e)continue; var d=Math.abs(wrapD(x-e.x))+Math.abs((y===undefined?e.y:y)-e.y)*0.5; if(d<b)b=d;} return b;}

// ---------- messaggi ----------
function msg(t,life){msgs.push({t:t,l:life||3}); if(msgs.length>3) msgs.shift();}
function plName(pl){ return MODE==='local2'?(pl.fac==='G'?'Barone':'Alleato'):(pl.name||'Tu'); }
function plMsg(pl,t,life){ msg((MODE==='local2'?plName(pl)+': ':'')+t,life); }

// ---------- entità ----------
function newPlane(fac){
  var d=fac==='G'?1:-1;
  return {fac:fac,x:wrapX(BASE[fac]+d*150),y:GROUND-480,a:d>0?0:Math.PI,spd:170,thr:0.8,s:d,rollV:d,flipT:0,sink:0,hp:100,ammo:600,heat:0,jam:0,fireT:0,gun:0,
          dead:false,crashed:false,landed:false,smokeT:0,rk:false,prop:0,fuel:100,bombs:6,bombT:0,col:'#c0141a',hitT:0,firing:false};
}
function newTankEnt(fac){
  var d=fac==='G'?1:-1;
  return {fac:fac,x:wrapX(DEPOT[fac]+(MODE==='single'?0:d*250)),y:GROUND,dir:d,spd:0,elev:0.35,hp:100,reload:0,mgT:0,shells:30,mg:500,heat:0,jam:0,dead:false,crashed:false,smokeT:0,rk:false,isTank:true,trk:0,firing:false};
}
function mkPL(i,fac,veh,map,name){
  var pl={i:i,fac:fac,tm:myTeam(fac),veh:veh,map:map,name:name,kills:0,deaths:0,tanksK:0,baronK:0,deathT:0,cam:{x:0,y:0},ent:null,flash:0,lastBy:null,killedBy:'',shSeq:0,lastShell:null,boSeq:0,lastBomb:null};
  spawnPL(pl); pl.cam.x=pl.ent.x; pl.cam.y=pl.ent.isTank?GROUND-300:pl.ent.y; return pl;
}
function spawnPL(pl){ pl.ent=pl.veh==='aereo'?newPlane(pl.fac):newTankEnt(pl.fac); pl.ent.pl=pl; pl.ent.tm=pl.tm; pl.deathT=0; pl.lastBy=null;
  if(MODE==='online'&&OM==='pvp'){ pl.ent.x=wrapX(pl.ent.x+rnd(-450,450)); if(!pl.ent.isTank) pl.ent.y=GROUND-rnd(400,900); } }
var WING_COLS=['#2c5e8a','#d4b21a','#3d6b2e','#7a3a8a'];
function newAI(fac,baron,idx){
  var me=ME||{x:BASE[PF],y:GROUND-500};
  var side=Math.random()<0.5?-1:1;
  var e={id:'u'+(++unitSeq),fac:fac,baron:!!baron,x:wrapX(me.x+side*rnd(1300,2400)),y:rnd(500,GROUND-650),a:0,spd:0,
    base:baron?212:Math.min(205,150+wave*7+rnd(0,15)),
    turn:baron?2.3:Math.min(2.0,1.25+wave*0.08+rnd(0,0.15)),
    hp:baron?14:6,max:baron?14:6,s:1,rollV:1,fireT:rnd(1,2),burst:0,mode:'attack',modeT:0,
    ev:0,evDir:1,dead:false,gone:false,smokeT:0,prop:rnd(0,6),hitT:0,gmode:'approach',bombs:baron?3:1,bombT:0,
    col:baron?'#c0141a':WING_COLS[(idx||0)%WING_COLS.length]};
  if(PT){e.y=rnd(400,900);}
  e.a=side>0?Math.PI:0; e.spd=e.base; e.s=Math.cos(e.a)>=0?1:-1; e.rollV=e.s;
  return e;
}
function mkBalloon(x){return {x:x,y:GROUND-520,hp:5,dead:false,fall:0,gone:false,ph:rnd(0,6)};}
function mkTank(fac){
  var t={id:'u'+(++unitSeq),isTank:true,y:GROUND,vx:0,shSeq:0,fac:fac||EF,x:0,dir:Math.random()<0.5?-1:1,spd:rnd(14,24),hp:30,max:30,dead:false,burnT:0,fireT:rnd(2,4),tr:-1.5,burst:0,reload:rnd(2.5,4),stand:rnd(330,560),trk:0};
  if(PT){var sd=PF==='G'?1:-1; t.x=wrapX(PT.x+sd*rnd(850,1600)); t.dir=-sd;}
  else t.x=rnd(3700,6700);

}
function mkRing(){
  var side=Math.random()<0.5?-1:1;
  return {x:wrapX(P.x+side*rnd(700,1500)),y:clamp(P.y+rnd(-350,350),GROUND-1400,GROUND-380),r:42,t:32,ph:0};
}
function velOf(o){
  if(!o) return [0,0];
  if(o.isTank) return [o.vx!==undefined?o.vx:o.spd,0];
  return [Math.cos(o.a)*o.spd, Math.sin(o.a)*o.spd+(o.sink||0)];
}
var allyT=0, myDL=[], dlSeq=0;
// alleato guidato dal computer, accanto al giocatore
function spawnAlly(k){
  var d=PF==='G'?1:-1, me=LP[0]&&LP[0].ent;
  if(LP[0].veh==='aereo'){
    var e=newAI(PF,false,k); e.ally=true; e.idx=k; e.base=Math.max(e.base,190); e.turn=Math.max(e.turn,1.7);
    if(me&&!me.dead){ e.x=wrapX(me.x-d*(170+120*k)); e.y=clamp(me.y-60-60*k,300,GROUND-500); e.a=me.a; e.s=me.s; e.rollV=me.s; e.spd=Math.max(150,me.spd); }
    else { e.x=wrapX(BASE[PF]+d*(300+150*k)); e.y=GROUND-700-80*k; e.a=d>0?0:Math.PI; e.s=d; e.rollV=d; }
    planes.push(e);
  } else {
    var t=mkTank(PF); t.ally=true; t.idx=k; t.spd=50; t.hp=t.max=40; t.dir=d;
    t.x=wrapX((me&&!me.dead?me.x:DEPOT[PF])-d*(140+110*k));
    tanks.push(t);
  }
}
function newGame(){
  planes=[]; tanks=[]; bullets=[]; shells=[]; bombs=[]; parts=[]; msgs=[]; rings=[]; balloons=[];
  wave=0; waveT=2.5; overT=0; gameT=0; shake=0; paused=false; ringT=10; keys={};
  LP=[]; P=null; PT=null;
  if(MODE==='local2'){
    PF='G'; EF='A';
    LP.push(mkPL(0,'G',V1,MAP_P1,'Barone')); LP.push(mkPL(1,'A',V2,MAP_P2,'Alleato'));
    msg('Duello! Barone (tasti a sinistra) contro Alleato (frecce)',4);
  } else {
    PF=SIDE==='barone'?'G':'A'; EF=PF==='G'?'A':'G';
    LP.push(mkPL(0,PF,VEH,MAP_SINGLE,MODE==='online'?MYNAME:'Tu'));
    if(MODE==='single'){
      balloons=[mkBalloon(4700),mkBalloon(6300)];
      if(PF==='G') msg(VEH==='aereo'?'Decollato dal campo della Jasta 11. Buona caccia, Barone!':'Il carro del Barone avanza verso il fronte!',4);
      else msg(VEH==='aereo'?'Squadron 209 in volo. Il Barone Rosso ti sta cercando...':'Il tuo carro avanza. Attento al Barone Rosso dal cielo!',4);
    } else { msg(OM==='pvp'?(PTEAM?'Solo giocatori: squadra '+PTEAM+'. Abbatti chi non è della tua squadra!':'Tutti contro tutti: abbatti chiunque!'):OM==='coop'?'Insieme: con i tuoi alleati, sconfiggete le squadre nemiche!':'Sfida: la tua squadra contro quella avversaria!',4); }
  }
  ME=LP[0].ent; if(LP[0].veh==='aereo') P=ME; else PT=ME;
  teamKills=0; myDL=[]; allyT=0; if(MODE==='online'&&OM!=='pvp') for(var k=0;k<NALLY;k++) spawnAlly(k);
  loadBest(); state='play'; setupTouch();
}

// ---------- particelle ----------

  for(k=0;k<(big?14:6);k++){var b=rnd(0,6.283),w=rnd(60,240); part(x,y,Math.cos(b)*w,Math.sin(b)*w-80,rnd(1,2.2),'debris',rnd(1.5,3));}

// ---------- armi ----------
// own: indice del giocatore locale (0/1), -1 = computer, 'r' = giocatore remoto (solo grafica)
function fire(o,own,jit){
  o.gun=1-(o.gun||0);
  var isP=(typeof own==='number'&&own>=0);
  var ca=Math.cos(o.a), sa=Math.sin(o.a), off=(o.gun?2.5:-2.5)*o.s, j=jit!==undefined?rnd(-jit,jit):(isP?rnd(-0.012,0.012):rnd(-0.04,0.04));
  var a=o.a+j, v=640;
  bullets.push({x:wrapX(o.x+ca*22-sa*(off-6*o.s)),y:o.y+sa*22+ca*(off-6*o.s),
    vx:Math.cos(a)*v+ca*o.spd, vy:Math.sin(a)*v+sa*o.spd+(o.sink||0), t:1.1, fac:o.fac, tm:TM(o), own:own});
  var d=nearestLP(o.x,o.y); if(d<900) sfx('gun',(isP?1:0.45)*(1-d/900*(isP?0:1)));
}
function fireShell(x,y,a,fac,own,tm){
  shells.push({x:x,y:y,vx:Math.cos(a)*SHELL_V,vy:Math.sin(a)*SHELL_V,fac:fac,tm:tm||fac,t:6,own:own});
  for(var k=0;k<5;k++) part(x+Math.cos(a)*6,y+Math.sin(a)*6,Math.cos(a)*60+rnd(-20,20),Math.sin(a)*60+rnd(-20,20),rnd(0.4,0.9),'smoke',rnd(4,7));

function ballistic(dx,dy){
  var v=SHELL_V,g=SHELL_G,ax=Math.abs(dx),h=-dy;
  var disc=v*v*v*v-g*(g*ax*ax+2*h*v*v);
  var el=disc<0?Math.PI/4:Math.atan((v*v-Math.sqrt(disc))/(g*Math.max(ax,1)));

}

// ---------- danni ai giocatori ----------
function crashPL(pl){

}
function killPL(pl){ var e=pl.ent; if(e.dead) return; if(e.isTank){crashPL(pl);return;} onPLDeath(pl); e.dead=true; e.hp=0; plMsg(pl,'abbattuto!',3); }
function onPLDeath(pl){

}

// ---------- giocatore: aereo ----------
function I(pl,a){ return !!keys[pl.map[a]]; }
function updPlane(pl,dt){
  var p=pl.ent;
  p.prop+=dt*(20+p.thr*40); p.hitT-=dt; p.firing=false;
  if(p.dead){
    pl.deathT+=dt;
    if(p.crashed){ if(Math.random()<dt*8) part(p.x+rnd(-10,10),GROUND-10,rnd(-8,8),rnd(-50,-25),rnd(2,3.5),'dark',rnd(8,14)); return; }
    p.a+=clamp(angDiff(Math.PI/2,p.a),-1.4*dt,1.4*dt);
    p.spd=Math.min(280,p.spd+80*dt);
    p.x=wrapX(p.x+Math.cos(p.a)*p.spd*dt); p.y+=Math.sin(p.a)*p.spd*dt;
    p.smokeT-=dt; if(p.smokeT<=0){p.smokeT=0.03; part(p.x,p.y,rnd(-10,10),rnd(-30,-10),rnd(1.2,2),'dark',rnd(5,9)); part(p.x,p.y,rnd(-20,20),rnd(-20,20),0.4,'fire',rnd(3,5));}
    if(p.y>=GROUND-8){crashPL(pl);}
    return;
  }
  var pitch=0; if(I(pl,'up')) pitch+=1; if(I(pl,'down')) pitch-=1;
  if(I(pl,'thrUp')) p.thr=Math.min(1,p.thr+0.7*dt);
  if(I(pl,'thrDn')) p.thr=Math.max(0,p.thr-0.7*dt);
  p.fireT-=dt;
  if(p.jam>0){p.jam-=dt; if(p.jam<=0){p.heat=45; plMsg(pl,'mitragliatrici sbloccate',1.5);}}
  else p.heat=Math.max(0,p.heat-20*dt);
  p.bombT-=dt;
  var home=BASE[p.fac];
  if(p.fuel>0){ if(!p.landed||p.thr>0.05) p.fuel=Math.max(0,p.fuel-(0.2+p.thr*0.8)*0.55*dt); pl.fuelMsg=false; }
  else if(!pl.fuelMsg){ pl.fuelMsg=true; plMsg(pl,'carburante esaurito! Plana verso il campo',4); }
  if(p.landed){
    p.y=GROUND-WHEEL; p.sink=0;
    p.spd+=((p.fuel>0?p.thr:0)*200-0.004*p.spd*p.spd-40)*dt; if(p.spd<0)p.spd=0;
    var lvl=p.s>0?0:Math.PI;
    p.x=wrapX(p.x+Math.cos(lvl)*p.spd*dt);
    if(pitch>0&&p.spd>105){p.landed=false; p.a=lvl-0.14*p.s; p.y-=3; plMsg(pl,'decollo!',1.5);}
    else p.a=lvl;
    if(Math.abs(wrapD(p.x-home))>370&&p.spd>15){crashPL(pl); return;}
    if(p.spd<70){
      var was=(p.hp<100||p.ammo<600||p.fuel<100||p.bombs<6);
      p.hp=Math.min(100,p.hp+22*dt); p.ammo=Math.min(600,p.ammo+160*dt); p.fuel=Math.min(100,p.fuel+30*dt); p.heat=0; p.jam=0;
      if(p.ammo>=600) p.bombs=6;
      if(was&&p.hp>=100&&p.ammo>=600&&p.fuel>=100) plMsg(pl,'aereo riparato e rifornito: gas e cabra per decollare',4);
    }
    if(I(pl,'roll')&&!p.rk&&p.spd<5){p.s=-p.s; p.rollV=p.s; p.rk=true;}
    if(!I(pl,'roll')) p.rk=false;
    return;
  }
  if(I(pl,'fire')&&p.jam<=0&&p.ammo>0){
    p.firing=true;
    if(p.fireT<=0){
      fire(p,pl.i); p.fireT=0.075; p.ammo--; p.heat+=4.2;
      if(p.heat>=100){p.jam=3; plMsg(pl,'mitragliatrici inceppate!',2.5);}
    }
  }
  if(I(pl,'alt')&&p.bombs>0&&p.bombT<=0){
    p.bombs--; p.bombT=0.45;
    var bb={x:p.x,y:p.y+8,vx:Math.cos(p.a)*p.spd*0.9,vy:Math.sin(p.a)*p.spd*0.9+p.sink,fac:p.fac,tm:TM(p),own:pl.i};
    bombs.push(bb); pl.boSeq++; pl.lastBomb=bb;
    if(p.bombs===0) plMsg(pl,'bombe finite',1.5);
  }
  var ctrl=clamp(p.spd/140,0.3,1);
  p.a=angN(p.a-pitch*p.s*2.4*ctrl*dt);
  var upy=-p.s*Math.cos(p.a);
  if(pitch===0&&upy>0.3){p.flipT+=dt; if(p.flipT>0.35){p.s=-p.s; p.flipT=0;}} else p.flipT=0;
  if(I(pl,'roll')&&!p.rk){p.s=-p.s; p.rk=true;} if(!I(pl,'roll')) p.rk=false;
  p.rollV+=clamp(p.s-p.rollV,-5*dt,5*dt);
  var sn=Math.sin(p.a);

  if(p.spd<STALL){

  } else p.sink-=p.sink*2.5*dt;
  p.x=wrapX(p.x+Math.cos(p.a)*p.spd*dt);
  p.y+=sn*p.spd*dt+p.sink*dt;
  if(p.y<220){p.spd-=(220-p.y)*1.2*dt; if(p.y<60){p.y=60;}}
  p.smokeT-=dt;
  if(p.hp<60&&p.smokeT<=0){p.smokeT=p.hp<30?0.04:0.09; part(p.x-Math.cos(p.a)*8,p.y-sn*8,rnd(-6,6),rnd(-20,-5),rnd(1,1.8),p.hp<30?'dark':'smoke',rnd(3,6)); if(p.hp<30&&Math.random()<0.3) part(p.x,p.y,rnd(-15,15),rnd(-15,15),0.35,'fire',3);}
  if(p.y>=GROUND-WHEEL){
    var onAir=Math.abs(wrapD(p.x-home))<340, up=-p.s*Math.cos(p.a), vs=sn*p.spd+p.sink;
    if(onAir&&up<-0.93&&vs<75&&p.spd<170){
      p.landed=true; p.y=GROUND-WHEEL; p.a=p.s>0?0:Math.PI; p.sink=0; p.thr=0;
      plMsg(pl,'atterraggio riuscito: riparazione in corso',3);
    } else crashPL(pl);
  }
}

// ---------- giocatore: carro armato ----------
function updTankPL(pl,dt){
  var t=pl.ent; t.firing=false; t.hitT=(t.hitT||0)-dt;
  if(t.dead){ pl.deathT+=dt; if(Math.random()<dt*8) part(t.x+rnd(-12,12),GROUND-22,rnd(-6,6),rnd(-45,-20),rnd(2,3.5),'dark',rnd(8,13)); return; }
  var mv=0; if(I(pl,'left')) mv-=1; if(I(pl,'right')) mv+=1;
  t.spd+=clamp(mv*62-t.spd,-90*dt,90*dt);

  if(I(pl,'roll')&&!t.rk&&Math.abs(t.spd)<8){t.dir=-t.dir; t.rk=true;} if(!I(pl,'roll')) t.rk=false;
  t.x=wrapX(t.x+t.spd*dt); t.trk+=t.spd*dt;
  if(Math.abs(t.spd)>5&&Math.random()<dt*10) part(t.x-t.dir*24,GROUND-3,rnd(-15,15)-t.spd*0.2,rnd(-25,-5),rnd(0.6,1.1),'dust',rnd(3,6));

  if(t.jam>0){t.jam-=dt; if(t.jam<=0){t.heat=40; plMsg(pl,'mitragliatrice sbloccata',1.5);}} else t.heat=Math.max(0,t.heat-18*dt);

    fireShell(sx,sy,a,t.fac,pl.i,TM(t)); pl.shSeq++; pl.lastShell=[sx,sy,a];
    shake=Math.max(shake,3); t.spd-=t.dir*12; if(t.shells===0) plMsg(pl,'proietti finiti! Torna al deposito',2.5);
  }

      var j=a+rnd(-0.03,0.03);
      bullets.push({x:wrapX(mx+Math.cos(a)*20),y:my+Math.sin(a)*20,vx:Math.cos(j)*640,vy:Math.sin(j)*640,t:1.3,fac:t.fac,tm:TM(t),own:pl.i}); sfx('gun',0.8);

    if(was&&t.hp>=100&&t.shells>=29.9&&t.mg>=500){t.shells=30; plMsg(pl,'carro riparato e riarmato',2.5);}

  if(t.hp<50&&t.smokeT<=0){t.smokeT=t.hp<25?0.06:0.14; part(t.x+rnd(-8,8),GROUND-26,rnd(-5,5),rnd(-35,-15),rnd(1.2,2),t.hp<25?'dark':'smoke',rnd(4,7));}

// ---------- IA aerei (solo giocatore singolo) ----------
function aiPatrol(e){ return (Math.cos(e.a)>=0?0:Math.PI)+(e.y>GROUND-1100?-0.25*(Math.cos(e.a)>=0?1:-1):0); }
function updAI(e,dt){
  e.prop+=dt*50; e.hitT-=dt; e.bombT-=dt; e.fireVis=(e.fireVis||0)-dt;
  if(e.dead){
    e.a+=clamp(angDiff(Math.PI/2,e.a),-1.5*dt,1.5*dt);
    e.spd=Math.min(300,e.spd+90*dt);
    e.x=wrapX(e.x+Math.cos(e.a)*e.spd*dt); e.y+=Math.sin(e.a)*e.spd*dt;
    e.smokeT-=dt; if(e.smokeT<=0){e.smokeT=0.035; part(e.x,e.y,rnd(-10,10),rnd(-30,-10),rnd(1.2,2.2),'dark',rnd(5,9)); if(Math.random()<0.6) part(e.x,e.y,rnd(-20,20),rnd(-20,20),0.4,'fire',rnd(3,5));}
    if(e.y>=GROUND-6){explosion(e.x,GROUND-8,true); e.gone=true;}
    return;
  }
  e.tgtT=(e.tgtT||0)-dt;
  if(e.tgtT<=0||!e.tgt||e.tgt.dead||e.tgt.landed){ e.tgt=pickTarget(e); e.tgtT=1; }
  var T=e.tgt, tv=velOf(T);
  var dx=T?wrapD(T.x-e.x):0, dy=T?T.y-e.y:0, dist=Math.sqrt(dx*dx+dy*dy);
  var active=!!T&&!T.dead&&!(T.landed)&&state==='play';
  var want, aim=0, canFire=false;
  if(!active){
    var L0=LP[0]&&LP[0].ent;
    if(e.ally&&L0&&!L0.dead&&!L0.isTank){ // in formazione dietro al capo
      var fd=Math.cos(L0.a)>=0?1:-1, fx=wrapX(L0.x-fd*(170+120*(e.idx||0))), fy=L0.y-60-60*(e.idx||0);
      var fdx=wrapD(fx-e.x), fdy=fy-e.y;
      want=(fdx*fdx+fdy*fdy<150*150)?L0.a:Math.atan2(fdy,fdx);
    } else want=aiPatrol(e);
  }
  else if(T.isTank){
    var gy=GROUND-12, alt=GROUND-e.y, dir=Math.cos(e.a)>=0?1:-1, ahead=dx*dir>0;
    if(e.gmode==='approach'){
      want=Math.atan2(clamp((GROUND-(e.baron?620:700))-e.y,-260,260),dx);
      if(Math.abs(dx)<(e.baron?620:520)&&ahead&&alt>380){e.gmode='dive';}
    }
    if(e.gmode==='dive'){
      var tt=Math.sqrt(dx*dx+(gy-e.y)*(gy-e.y))/640, px=dx+tv[0]*tt;
      aim=Math.atan2(gy-e.y,px); want=aim;
      canFire=Math.abs(angDiff(aim,e.a))<(e.baron?0.07:0.12)&&dist<620;
      if(e.bombs>0&&e.bombT<=0){
        var vx=Math.cos(e.a)*e.spd*0.9, vy=Math.sin(e.a)*e.spd*0.9, hgt=gy-e.y;
        var tf=(-vy+Math.sqrt(Math.max(0,vy*vy+2*300*hgt)))/300, land=vx*tf*0.93;
        if(Math.abs(land-(dx+tv[0]*tf))<(e.baron?45:70)||(alt<(e.baron?300:340)&&ahead&&Math.abs(dx)<alt*1.2)){e.bombs--; e.bombT=1.5; bombs.push({x:e.x,y:e.y+8,vx:vx,vy:vy,fac:e.fac,own:-1});}
      }
      if(alt<(e.baron?150:190)||(!ahead&&Math.abs(dx)>40)){e.gmode='pull'; e.modeT=rnd(1.8,2.6);}
    }
    if(e.gmode==='pull'){
      want=dir>0?-0.75:Math.PI+0.75; e.modeT-=dt;
      if(e.modeT<=0&&Math.abs(dx)>650) e.gmode='approach';
      if(e.modeT<=-5) e.gmode='approach';
    }
  } else {
    var lv=640, tt2=dist/lv, tx=dx+tv[0]*tt2, ty=dy+tv[1]*tt2;
    if(e.baron){ tt2=Math.sqrt(tx*tx+ty*ty)/lv; tx=dx+tv[0]*tt2; ty=dy+tv[1]*tt2; }
    aim=Math.atan2(ty,tx); want=aim;
    e.modeT-=dt;
    if(e.mode==='attack'&&dist<(e.baron?90:110)){e.mode='extend'; e.modeT=e.baron?rnd(0.8,1.4):rnd(1.2,2.2);}
    if(e.mode==='extend'&&e.modeT<=0) e.mode='attack';
    var fromP=Math.atan2(-dy,-dx), threat=dist<(e.baron?480:380)&&Math.abs(angDiff(fromP,T.a))<(e.baron?0.32:0.25);
    if(e.ev<=0&&threat&&Math.random()<dt*(e.baron?4.5:1.5)){
      e.ev=e.baron?rnd(0.6,1.2):rnd(0.8,1.6); e.evDir=Math.random()<0.5?-1:1;
      if(e.baron) e.evDir=(e.spd>165)?(Math.cos(e.a)>=0?-1:1):(Math.cos(e.a)>=0?1:-1);
    }
    e.ev-=dt;
    if(e.ev>0) want=e.a+e.evDir*1.6;
    else if(e.mode==='extend') want=(Math.cos(e.a)>=0?-0.15:Math.PI+0.15);
    else if(e.baron){
      if(e.spd<125) want=(Math.cos(e.a)>=0?0.55:Math.PI-0.55);
      else if(dist>750) want=Math.atan2(dy-260,dx);
      if(dist<170&&Math.abs(angDiff(T.a,e.a+Math.PI))<0.5) want=e.a+(e.y>T.y?-1.2:1.2);
    }
    canFire=e.mode==='attack'&&e.ev<=0&&Math.abs(angDiff(aim,e.a))<(e.baron?0.075:0.1)&&dist<(e.baron?600:520);
  }
  if(e.y>GROUND-(T&&T.isTank&&e.gmode==='dive'?110:380)) want=(Math.cos(e.a)>=0?-0.7:Math.PI+0.7);
  if(e.y<200) want=(Math.cos(e.a)>=0?0.3:Math.PI-0.3);
  e.a=angN(e.a+clamp(angDiff(want,e.a),-e.turn*dt,e.turn*dt));
  e.spd+=(e.base-e.spd)*0.8*dt+70*Math.sin(e.a)*dt; e.spd=clamp(e.spd,110,e.baron?275:260);
  e.x=wrapX(e.x+Math.cos(e.a)*e.spd*dt); e.y+=Math.sin(e.a)*e.spd*dt;
  var ts=Math.cos(e.a)>=0?1:-1; if(Math.abs(Math.cos(e.a))>0.25) e.s=ts;
  e.rollV+=clamp(e.s-e.rollV,-4*dt,4*dt);
  if(e.hp<=e.max/2){e.smokeT-=dt; if(e.smokeT<=0){e.smokeT=0.1; part(e.x,e.y,rnd(-6,6),rnd(-20,-5),rnd(1,1.6),'smoke',rnd(3,5));}}
  if(e.y>=GROUND-6){explosion(e.x,GROUND-8,true); e.dead=true; e.gone=true; if(e.baron) msg('Il Barone si è schiantato!',3);}
  e.fireT-=dt;
  if(active&&canFire&&e.fireT<=0){
    fire(e,-1,e.baron?0.015:0.04); e.burst++; e.fireVis=0.2;
    var bl=e.baron?10:8;
    if(e.burst>=bl){e.burst=0; e.fireT=e.baron?rnd(0.5,1.0):rnd(1.1,2.2);} else e.fireT=e.baron?0.085:0.1;
  }
}

// ---------- IA carri (solo giocatore singolo) ----------
function hostiles(fac){ // tutte le entità nemiche vive (giocatori, computer, remoti)
  var L=[],k,o;
  for(k=0;k<LP.length;k++){o=LP[k].ent; if(o&&o.fac!==fac&&!o.dead) L.push(o);}
  for(k=0;k<planes.length;k++){o=planes[k]; if(o.fac!==fac&&!o.dead) L.push(o);}
  for(k=0;k<tanks.length;k++){o=tanks[k]; if(o.fac!==fac&&!o.dead) L.push(o);}
  for(var id in remotes){ var r=remotes[id]; if(r.ent.fac!==fac&&!r.ent.dead) L.push(r.ent);
    for(var u in r.units){ o=r.units[u].ent; if(o.fac!==fac&&!o.dead) L.push(o); } }
  return L;
}
function pickTarget(e){
  var L=hostiles(e.fac), best=null, bd=1e9;
  for(var k=0;k<L.length;k++){ var o=L[k]; if(o.landed) continue;
    var d=Math.abs(wrapD(o.x-e.x))+Math.abs((o.isTank?GROUND:o.y)-e.y)*0.7;
    if(o.pl||o.human) d*=0.85; if(o.isTank) d*=1.3;
    if(d<bd){bd=d; best=o;} }
  return bd<6000?best:null;
}
function updTanks(dt){
  var k;
  for(k=0;k<tanks.length;k++){
    var t=tanks[k];
    if(t.dead){ t.burnT+=dt; if(t.burnT<25&&Math.random()<dt*6) part(t.x+rnd(-8,8),GROUND-22,rnd(-6,6),rnd(-40,-20),rnd(2,3.5),'dark',rnd(7,12)); if(t.burnT>30&&MODE==='online') t.gone=true; continue; }
    t.tgtT=(t.tgtT||0)-dt; t.firing=false;
    if(t.tgtT<=0){ t.tgtT=1; var L=hostiles(t.fac), bt=null, bd=1e9, bp=null, bpd=1e9;
      for(var q=0;q<L.length;q++){ var o=L[q], d=Math.abs(wrapD(o.x-t.x));
        if(o.isTank){ if(d<bd){bd=d; bt=o;} } else if(!o.landed){ var dd=Math.sqrt(d*d+Math.pow(o.y-(GROUND-26),2)); if(dd<bpd){bpd=dd; bp=o;} } }
      t.tt=bd<2200?bt:null; t.tp=bpd<1200?bp:null; }
    var active=state==='play', mv=0, my=GROUND-30;
    if(t.tt&&!t.tt.dead){
      var dxp=wrapD(t.tt.x-t.x); t.dir=dxp>=0?1:-1;
      if(Math.abs(dxp)>t.stand) mv=t.dir; else if(Math.abs(dxp)<t.stand-150) mv=-t.dir*0.5;
      t.tr=ballistic(dxp,(GROUND-20)-my); t.reload-=dt;
      if(active&&Math.abs(dxp)<1150&&t.reload<=0){
        t.reload=rnd(2.6,4.2);
        var lead=velOf(t.tt)[0]*Math.abs(dxp)/SHELL_V*rnd(0.2,0.9);
        var a=ballistic(dxp+lead,(GROUND-20)-my)+rnd(-0.035,0.035);
        fireShell(wrapX(t.x+Math.cos(a)*24),my+Math.sin(a)*24,a,t.fac,-1); t.shSeq=(t.shSeq||0)+1;
      }
    } else {
      var L0=LP[0]&&LP[0].ent;
      if(t.ally&&L0&&!L0.dead&&L0.isTank){ var fx=wrapX(L0.x-L0.dir*(140+110*(t.idx||0))), d2=wrapD(fx-t.x); if(Math.abs(d2)>40){ mv=d2>0?1:-1; t.dir=mv; } }
      else { if(t.x<3600) t.dir=1; if(t.x>6800) t.dir=-1; mv=t.dir; }
    }
    t.vx=mv*t.spd; t.x=wrapX(t.x+t.vx*dt); t.trk+=t.vx*dt;
    // mitragliatrice contraerea
    var T=t.tp;
    if(T&&!T.dead&&!T.landed){
      var dx=wrapD(T.x-t.x), dy=T.y-(GROUND-26), dd3=Math.sqrt(dx*dx+dy*dy);
      if(!t.tt) t.tr=Math.atan2(dy,dx);
      t.fireT-=dt;
      if(active&&dd3<750&&dy<-60&&t.fireT<=0){
        t.burst++; t.firing=true;
        if(t.burst>=5){t.burst=0; t.fireT=rnd(2.5,4.5);} else t.fireT=rnd(0.12,0.2);
        var tv=velOf(T), tt=dd3/430, a2=Math.atan2(dy+tv[1]*tt,dx+tv[0]*tt)+rnd(-0.06,0.06);
        bullets.push({x:t.x,y:GROUND-26,vx:Math.cos(a2)*430,vy:Math.sin(a2)*430,t:1.9,fac:t.fac,own:-1});
        if(nearestLP(t.x)<900) sfx('gun',0.3);
      }
    }
  }
  for(k=tanks.length-1;k>=0;k--) if(tanks[k].gone) tanks.splice(k,1);
}
function credit(own){ return (typeof own==='number'&&own>=0&&LP[own])?LP[own]:null; }
function unitKilled(own){ if(typeof own==='string'&&own.indexOf('peer:')===0){ myDL.push([++dlSeq,own.slice(5)]); if(myDL.length>8) myDL.shift(); } else if(curFac===PF&&MODE==='online') teamKills++; }
function tankDamage(t,d,own){ if(t.dead) return; t.hp-=d; if(t.hp<=0){ t.dead=true; t.burnT=0; unitKilled(own); var c=credit(own); if(c)c.tanksK++; explosion(t.x,GROUND-20,true); msg('Carro armato distrutto!'+(c&&MODE==='single'?' ('+c.tanksK+')':''),2.5);} }
function aiDamage(e,d,own){
  if(e.dead) return; e.hp-=d; e.hitT=0.08;
  if(e.hp<=0){
    e.dead=true; unitKilled(own); var c=credit(own); if(c)c.kills++;
    if(e.baron){ if(c)c.baronK++; msg('HAI ABBATTUTO IL BARONE ROSSO!'+(c?' ('+c.baronK+')':''),4.5); }
    else msg('Vittoria n. '+(c?c.kills:'')+'!',2.5);
    explosion(e.x,e.y,!!e.baron);
  }
}
function balloonDamage(b,d,own){ b.hp-=d; if(b.hp<=0&&!b.dead){b.dead=true; var c=credit(own); if(c)c.kills++; msg('Pallone frenato incendiato!',2.5); explosion(b.x,b.y,false);} }
function updRings(dt){
  if(MODE!=='single'||state!=='play'||!P||P.dead) return;
  ringT-=dt;
  if(ringT<=0){ ringT=rnd(18,28); if(rings.length<2){ rings.push(mkRing()); msg('È apparso un cerchio di rifornimento!',2.5); } }
  for(var k=rings.length-1;k>=0;k--){
    var r=rings[k]; r.t-=dt; r.ph+=dt;
    if(!P.landed&&near(P.x,P.y,r.x,r.y,r.r)){
      P.hp=100; P.ammo=600; P.fuel=100; P.bombs=6; P.heat=0; P.jam=0;
      for(var q=0;q<22;q++){var a=rnd(0,6.283); part(r.x+Math.cos(a)*r.r,r.y+Math.sin(a)*r.r,Math.cos(a)*60,Math.sin(a)*60,0.8,'spark',3);}
      msg('Rifornimento in volo! Tutto al massimo',3); sfx('hit',1); rings.splice(k,1); continue;
    }

}

// visita tutti i possibili bersagli vivi; fn ritorna true per fermarsi
function eachTarget(fn){
  var k,e;
  for(k=0;k<planes.length;k++){e=planes[k]; if(!e.dead&&fn({kind:'plane',who:'ai',o:e,x:e.x,y:e.y,fac:e.fac,tm:e.fac}))return;}
  for(k=0;k<tanks.length;k++){e=tanks[k]; if(!e.dead&&fn({kind:'tank',who:'ai',o:e,x:e.x,y:GROUND-18,fac:e.fac,tm:e.fac}))return;}
  for(k=0;k<balloons.length;k++){e=balloons[k]; if(!e.dead&&fn({kind:'balloon',who:'ai',o:e,x:e.x,y:e.y+Math.sin(e.ph)*6,fac:EF,tm:EF}))return;}
  for(k=0;k<LP.length;k++){e=LP[k].ent; if(e&&!e.dead&&fn({kind:e.isTank?'tank':'plane',who:'lp',o:LP[k],x:e.x,y:e.isTank?GROUND-18:e.y,fac:e.fac,tm:TM(e),landed:!!e.landed}))return;}
  for(var id in remotes){var r=remotes[id]; if(r.ent&&!r.ent.dead&&fn({kind:r.ent.isTank?'tank':'plane',who:'rem',o:r,x:r.ent.x,y:r.ent.isTank?GROUND-18:r.ent.y,fac:r.ent.fac,tm:TM(r.ent),landed:!!r.landed}))return;
    for(var u in r.units){var un=r.units[u], ue=un.ent; if(!ue.dead&&fn({kind:ue.isTank?'tank':'plane',who:'ru',o:un,x:ue.x,y:ue.isTank?GROUND-18:ue.y,fac:ue.fac,tm:ue.fac}))return;}}
}
function canDamage(T,tm,own){
  if(T.tm===tm||own==='r') return false;
  if(T.who==='rem'||T.who==='ru') return typeof own==='number';      // solo i colpi simulati qui valgono sui remoti
  if(T.who==='lp'&&own===T.o.i) return false;
  return true;
}
function applyDamage(T,d,own,fac){
  curFac=fac||null;
  if(T.who==='ai'){ if(T.kind==='plane') aiDamage(T.o,d,own); else if(T.kind==='tank') tankDamage(T.o,d,own); else balloonDamage(T.o,d,own); }
  else if(T.who==='lp') hurtPL(T.o,d,own);
  else if(T.who==='rem') addHit(T.o.peer,'p',d);
  else if(T.who==='ru') addHit(T.o.peer,T.o.id,d);
  curFac=null;
}
function hitTest(T,x,y,mx,my,kind){
  if(T.kind==='plane'){ if(T.landed&&kind==='bullet') return false; var r=kind==='shell'?(T.who==='ai'?24:18):(T.who==='ai'?18:15); return near(x,y,T.x,T.y,r)||(mx!==undefined&&near(mx,my,T.x,T.y,r)); }
  if(T.kind==='tank') return Math.abs(wrapD(x-T.x))<(kind==='shell'?30:26)&&y>GROUND-(kind==='shell'?40:36)&&y<GROUND;
  return Math.abs(wrapD(x-T.x))<(kind==='shell'?28:26)&&Math.abs(y-T.y)<(kind==='shell'?18:12);
}
function bulletDmg(T){ var pl=T.who==='lp'||T.who==='rem'; return T.kind==='plane'?(pl?4:1):T.kind==='tank'?(pl?1.6:1.2):1; }
function blast(x,fac,own,r,dmgAI,dmgPL,tm){
  if(own==='r') return; tm=tm||fac;
  eachTarget(function(T){
    if(!canDamage(T,tm,own)) return false;
    var onGround=T.kind==='tank'||(T.kind==='plane'&&T.landed); if(!onGround) return false;
    var d=Math.abs(wrapD(T.x-x)); if(d>=r) return false;
    applyDamage(T,((T.who==='ai'||T.who==='ru')?dmgAI:dmgPL)*(1-d/r*0.5),own,fac); return false;
  });
}
function updBombs(dt){
  for(var k=bombs.length-1;k>=0;k--){
    var b=bombs[k]; b.vy+=300*dt; b.vx*=(1-0.15*dt);
    b.x=wrapX(b.x+b.vx*dt); b.y+=b.vy*dt;
    if(b.y>=GROUND-4){
      explosion(b.x,GROUND-6,true);
      for(var q=0;q<10;q++) part(b.x+rnd(-20,20),GROUND-4,rnd(-60,60),rnd(-160,-60),rnd(0.6,1.2),'dust',rnd(4,8));
      blast(b.x,b.fac,b.own,65,40,42,TM(b));
      bombs.splice(k,1);
    }
  }
}
function updShells(dt){
  for(var k=shells.length-1;k>=0;k--){
    var s=shells[k], hitT=null;
    s.vy+=SHELL_G*dt; s.x=wrapX(s.x+s.vx*dt); s.y+=s.vy*dt; s.t-=dt;
    if(Math.random()<dt*20) part(s.x,s.y,0,0,0.5,'smoke',2);
    if(s.own!=='r') eachTarget(function(T){ if(canDamage(T,TM(s),s.own)&&hitTest(T,s.x,s.y,undefined,undefined,'shell')){hitT=T; return true;} return false; });
    if(hitT||s.y>=GROUND-2){
      explosion(s.x,Math.min(s.y,GROUND-6),false);
      if(hitT&&hitT.kind!=='tank') applyDamage(hitT,hitT.kind==='plane'?((hitT.who==='ai'||hitT.who==='ru')?(hitT.o.baron?5:4):25):5,s.own,s.fac);
      if(s.y>=GROUND-45){ for(var q=0;q<6;q++) part(s.x+rnd(-10,10),GROUND-4,rnd(-50,50),rnd(-130,-50),rnd(0.5,1),'dust',rnd(3,6));
        blast(s.x,s.fac,s.own,48,14,16,TM(s)); }
      shells.splice(k,1); continue;
    }
    if(s.t<=0) shells.splice(k,1);
  }
}
function updBullets(dt){
  for(var b=bullets.length-1;b>=0;b--){
    var u=bullets[b], ox=u.x, oy=u.y, hitT=null;
    u.x=wrapX(u.x+u.vx*dt); u.y+=u.vy*dt; u.t-=dt;
    var mx=wrapX(ox+wrapD(u.x-ox)/2), my=(oy+u.y)/2;
    if(u.own!=='r') eachTarget(function(T){ if(canDamage(T,TM(u),u.own)&&hitTest(T,u.x,u.y,mx,my,'bullet')){hitT=T; return true;} return false; });
    if(hitT){ part(u.x,u.y,rnd(-40,40),rnd(-40,40),0.25,'spark',2); if(nearestLP(u.x,u.y)<700) sfx('hit',0.6); applyDamage(hitT,bulletDmg(hitT),u.own,u.fac); }
    if(hitT||u.t<=0||u.y>GROUND){ if(!hitT&&u.y>GROUND) part(u.x,GROUND-2,rnd(-10,10),rnd(-40,-10),0.5,'dust',3); bullets.splice(b,1); }
  }
}

function coopHumans(){ var n=1; for(var id in remotes) if(remotes[id].om==='coop'&&LP[0]&&remotes[id].fac===LP[0].fac) n++; return n; }
function spawnWave(){
  wave++; var k, n, nt, txt;
  var mult=MODE==='online'?(1+0.6*(coopHumans()-1)+0.35*NALLY):1;
  if(PF==='G'){
    n=VEH==='aereo'?Math.min(7,1+Math.ceil(wave*0.8)):Math.min(4,Math.ceil(wave/2));
    n=Math.min(10,Math.round(n*mult));
    for(k=0;k<n;k++) planes.push(newAI('A',false,k));
    txt=n+(n===1?' caccia alleato':' caccia alleati');
  } else {
    planes.push(newAI('G',true,0));
    n=VEH==='aereo'?Math.min(3,wave-1):Math.min(2,Math.floor((wave-1)/2));
    if(MODE==='online') n=Math.min(8,Math.round((n+1)*mult)-1);
    for(k=0;k<n;k++) planes.push(newAI('G',false,k));
    txt='il Barone Rosso'+(n?' e '+n+(n===1?' gregario':' gregari'):'');
  }
  for(k=0;k<balloons.length;k++) if(balloons[k].gone) balloons[k]=mkBalloon(balloons[k].x);
  for(k=tanks.length-1;k>=0;k--) if(tanks[k].dead&&!tanks[k].ally) tanks.splice(k,1);
  nt=VEH==='carro'?Math.min(6,wave+(PF==='G'?1:0)):Math.min(6,1+wave);
  nt=Math.min(9,Math.round(nt*mult));
  var ne=0; for(k=0;k<tanks.length;k++) if(tanks[k].fac===EF) ne++;
  while(ne<nt){ tanks.push(mkTank(EF)); ne++; }
  msg('Ondata '+wave+': '+txt+' e '+ne+(ne===1?' carro armato':' carri armati'),3.5);
}

// Dentro Claude usa le stanze della pagina (room.join); fuori da Claude (GitHub Pages, file)
// usa PeerJS: chi crea la stanza fa da centro e smista le posizioni agli altri.
var room=null, myPeer=null, netState='off', netErr='', netRetry=0, remotes={}, presT=0, myHits=[], hitSeq=0, presOK=0, seenPeers=0;
var NET=null, RCODE='', RROLE='', RMAX=10, rStat='', joinT=0;
try{ RMAX=clamp(parseInt(localStorage.getItem('br5_max')||'10',10)||10,1,50); }catch(e){}
var PEERJS_URL='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
function thenable(){ return {then:function(ok){ if(ok) ok(); }}; }
function initRoom(){
  if(NET||netState==='connecting') return;
  netState='connecting'; netRetry=5; netErr='';
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      window.claude.use('room').then(function(r){
        if(r){ NET={kind:'claude',api:r}; netState='ready'; } else usePeerJS();
      },function(){ usePeerJS(); });
    } else usePeerJS();
  }catch(e){ usePeerJS(); }
}
function usePeerJS(){
  if(window.Peer){ NET={kind:'p2p'}; netState='ready'; return; }
  try{
    var s=document.createElement('script'); s.src=PEERJS_URL;
    s.onload=function(){ if(window.Peer){ NET={kind:'p2p'}; netState='ready'; } else { netState='none'; netErr='rete non disponibile'; } };
    s.onerror=function(){ netState='none'; netErr='serve la connessione a Internet'; };
    document.getElementsByTagName('head')[0].appendChild(s);
  }catch(e){ netState='none'; netErr='browser troppo vecchio per giocare online'; }
}
var CODE_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genCode(){ var s=''; for(var k=0;k<5;k++) s+=CODE_CH.charAt(Math.floor(Math.random()*CODE_CH.length)); return s; }
function normCode(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8); }
function readName(){ MYNAME=cleanName(nmInput.value.replace(/^\s+|\s+$/g,'')); nmInput.value=MYNAME; }
function createRoom(){
  readName();
  if(!NET){ rStat='connessione in corso, riprova tra un attimo…'; initRoom(); return; }
  try{ localStorage.setItem('br5_max',''+RMAX); }catch(e){}
  openRoom(genCode(),true);
}
function joinRoom(){
  readName();
  var c=normCode(cdInput.value); cdInput.value=c;
  if(c.length<4){ rStat='scrivi il codice della stanza (5 caratteri)'; return; }
  if(!NET){ rStat='connessione in corso, riprova tra un attimo…'; initRoom(); return; }
  openRoom(c,false);
}
function inRoomCount(){ var n=0; if(!room) return 0; try{ var ps=room.peers(); for(var q=0;q<ps.length;q++) if(ps[q].kind==='viewer') n++; }catch(e){} return n; }
function openRoom(code,host){
  leaveRoom();
  RCODE=code; RROLE=host?'host':'guest'; joinT=0;
  rStat=host?'creo la stanza…':'entro nella stanza '+code+'…';
  if(NET.kind==='claude') claudeOpen(code,host); else p2pOpen(code,host);
}
function roomLost(why){ var c=RCODE; leaveRoom(); rStat=why+(c?' ('+c+')':''); if(state==='play') msg('Online: '+rStat,4); }
function leaveRoom(){
  if(room&&room.leave){ try{ room.leave(); }catch(e){} }
  if(pp){ try{ pp.destroy(); }catch(e){} }
  radioOff(); chSeen={}; if(chatOpen) closeChat();
  pp=null; pconns={}; pstate={}; phost=null; pPeers=[]; pmine={};
  room=null; myPeer=null; remotes={}; RCODE=''; RROLE=''; rStat='';
  if(NET) netState='ready';
}
// --- dentro Claude ---
function claudeOpen(code,host){
  NET.api.join('br-'+code.toLowerCase()).then(function(nr){
    if(RCODE!==code){ try{nr.leave();}catch(e){} return; }
    room=nr; netState='on';
    nr.onConnection(function(c){ if(room===nr) netState=c?'on':'connecting'; },function(e){ if(room===nr) roomLost('stanza persa: '+((e&&e.code)||'errore')); });
    nr.onPeers(function(ch){ seenPeers=ch.peers.length; for(var k=0;k<ch.peers.length;k++) if(ch.peers[k].sameTab) myPeer=ch.peers[k].peer; },function(){});
    nr.presence({n:MYNAME,v:null,rm:RMAX});
    rStat=host?'stanza creata: comunica il codice':'controllo la stanza…';
    if(host) RROLE='in';
  },function(e){ var c=(e&&e.code)||'errore'; RCODE=''; RROLE=''; rStat='impossibile aprire la stanza: '+c; });
}
function claudeJoinCheck(dt){
  if(!room||RROLE!=='guest'||NET.kind!=='claude') return;
  joinT+=dt;
  var ps; try{ ps=room.peers(); }catch(e){ return; }
  var others=0, mx=0;
  for(var k=0;k<ps.length;k++){ var p=ps[k]; if(p.sameTab||p.kind!=='viewer') continue; others++; var m=p.presence&&p.presence.rm; if(typeof m==='number'&&m>mx) mx=m; }
  if(others&&mx){
    if(joinT<1.5) return;   // lascio arrivare tutti i presenti
    mx=clamp(Math.floor(mx),1,50);
    if(others>=mx){ roomLost('stanza piena: massimo '+mx+' giocatori'); return; }
    RMAX=mx; RROLE='in'; rStat='sei nella stanza'; return;
  }
  if(joinT>8) roomLost('codice non trovato');
}
// --- fuori da Claude: PeerJS ---
var pp=null, pconns={}, pstate={}, phost=null, pPeers=[], pmine={}, pTick=0, pSeen={}, pLast=0;
var P2P_PREFIX='baronerosso-v5-';
var P2PROOM={ presence:function(p){ pmine=p; return thenable(); }, peers:function(){ return pPeers; }, leave:function(){} };
function p2pHz(){ var n=pPeers.length||1; return n<=6?15:(n<=15?10:(n<=30?6:4)); }
function p2pOpen(code,host){
  var hid=P2P_PREFIX+code.toLowerCase(), me;
  try{ me=host?new window.Peer(hid):new window.Peer(); }catch(e){ RCODE=''; RROLE=''; rStat='online non disponibile su questo browser'; return; }
  pp=me;
  me.on('open',function(id){
    if(pp!==me) return;
    myPeer=id;
    if(host){ room=P2PROOM; netState='on'; RROLE='in'; rStat='stanza creata: comunica il codice'; rebuildPeers(); }
    else {
      var c=me.connect(hid,{reliable:true,serialization:'json'}); phost=c;
      c.on('open',function(){ if(pp!==me) return; rStat='attendo risposta…'; });
      c.on('data',function(d){

  }

  updRings(dt); updBombs(dt); updShells(dt); updBullets(dt); updParts(dt);
  var host=MODE==='online'&&OM==='coop'&&isHost();

      var alive=0, any=0; for(k=0;k<planes.length;k++) if(planes[k].fac===EF){ any++; if(!planes[k].dead) alive++; }
      if(VEH==='carro'||MODE==='online') for(k=0;k<tanks.length;k++) if(tanks[k].fac===EF&&!tanks[k].dead) alive++;

  for(k=0;k<LP.length;k++){ var e=LP[k].ent; if(e.isTank){ drawTank(e.x,e.dir,e.dead,e.fac,e.dir>0?-e.elev:Math.PI+e.elev,e.trk,1,LP[k]===viewPl); if(MODE==='local2'&&LP[k]!==viewPl) tankLabel(e,plName(LP[k])); } }
  for(var id in remotes){ var r=remotes[id], re=r.ent; if(re.isTank){ drawTank(re.x,re.dir,re.dead,re.fac,re.dir>0?-re.elev:Math.PI+re.elev,re.trk,re.hp/100,false); tankLabel(re,r.name+teamTag(r)); }
    for(var u in r.units){ var ue=r.units[u].ent; if(ue.isTank) drawTank(ue.x,ue.dir,ue.dead,ue.fac,ue.tr,ue.trk,ue.hp/100,false); } }
  for(k=0;k<balloons.length;k++) drawBalloon(balloons[k]);
  for(k=0;k<rings.length;k++) drawRing(rings[k]);
  drawBullets(); drawBombs();
  for(k=0;k<planes.length;k++) drawPlane(planes[k]);
  if(state==='title'&&demo) drawPlane(demo);
  for(k=0;k<LP.length;k++){ var p=LP[k].ent; if(!p.isTank&&!(p.dead&&p.crashed)){ p.label=(MODE==='local2'&&LP[k]!==viewPl)?plName(LP[k]):''; drawPlane(p); } }
  for(var id2 in remotes){ var r2=remotes[id2], rp=r2.ent; if(!rp.isTank&&!rp.crashed){ rp.label=r2.name+teamTag(r2); drawPlane(rp); }
    for(var u2 in r2.units){ var up2=r2.units[u2].ent; if(!up2.isTank) drawPlane(up2); } }
  drawParts();
  if(viewPl&&viewPl.ent.isTank&&!viewPl.ent.dead&&state==='play'){
    var te=viewPl.ent, a=te.dir>0?-te.elev:Math.PI+te.elev, ox=te.x+te.dir*4, oy=GROUND-30, vx=Math.cos(a)*SHELL_V, vy=Math.sin(a)*SHELL_V;
    cx.fillStyle='rgba(255,240,180,0.55)';
    for(var tt=0.15;tt<4;tt+=0.15){ var px=ox+vx*tt, py=oy+vy*tt+0.5*SHELL_G*tt*tt; if(py>GROUND) break; var sp=scr(px,py); cx.beginPath(); cx.arc(sp[0],sp[1],1.6,0,6.2832); cx.fill(); }
  }
  cx.fillStyle='rgba(250,250,252,0.82)';
  for(k=0;k<nearClouds.length;k++){
    c=nearClouds[k]; var s=scr(c.x,c.y); if(s[0]>-300&&s[0]<W+300&&s[1]>-150&&s[1]<H+150) drawCloud(s[0],s[1],c,Z);
  }
}
function tankLabel(e,txt){
  if(e.dead) return; var s=scr(e.x,GROUND-58); if(s[0]<-60||s[0]>W+60) return;
  cx.font='bold '+Math.round(11*Z+2)+'px Georgia'; cx.textAlign='center';
  cx.fillStyle='rgba(0,0,0,0.5)'; cx.fillText(txt,s[0]+1,s[1]+1); cx.fillStyle=e.fac==='G'?'#ffd8c0':'#d8e6ff'; cx.fillText(txt,s[0],s[1]);
}
function renderView(pl,vy,vh,cam){
  W=FW; H=vh; camX=cam.x; camY=cam.y; Z=zoomFor(vh);
  cx.save(); cx.translate(0,vy); cx.beginPath(); cx.rect(0,0,W,H); cx.clip();
  cx.save(); if(shake>0) cx.translate(rnd(-shake,shake),rnd(-shake,shake));
  drawWorld(pl);
  cx.restore();
  if(pl&&state!=='title'){
    if(MODE==='local2') hudCompact(pl); else hudFull(pl);
    if(pl.flash>0){cx.fillStyle='rgba(180,0,0,'+(pl.flash*0.6).toFixed(2)+')'; cx.fillRect(0,0,W,H);}
  }
  cx.restore();
  W=FW; H=FH;
}
function render(){
  if(state==='title'){ renderView(null,0,FH,demoCam); titleScreen(); drawChat(); return; }
  nmInput.style.display='none'; cdInput.style.display='none';
  if(MODE==='local2'){
    var h1=Math.floor(FH/2);
    renderView(LP[0],0,h1,LP[0].cam); renderView(LP[1],h1,FH-h1,LP[1].cam);
    cx.fillStyle='#2b1d10'; cx.fillRect(0,h1-2,FW,4);
    var txt='BARONE  '+LP[0].kills+'  —  '+LP[1].kills+'  ALLEATO';
    cx.font='bold 16px Georgia'; var tw=cx.measureText(txt).width+30;
    cx.fillStyle='rgba(236,224,196,0.95)'; cx.fillRect(FW/2-tw/2,h1-14,tw,28); cx.strokeStyle='#6a4a2a'; cx.lineWidth=2; cx.strokeRect(FW/2-tw/2,h1-14,tw,28);
    cx.textAlign='center'; cx.fillStyle='#2b1d10'; cx.fillText(txt,FW/2,h1+6);
    drawMsgs(h1+40);
  } else {
    renderView(LP[0],0,FH,LP[0].cam);
    drawMsgs((FW<600||FH<430)?275:(MODE==='online'?100:78));
  }
  drawChat();
  if(paused) panel(['Premi P (o il tasto II) per riprendere','ESC (o ⌂) per tornare al menu'],'PAUSA','');
  if(state==='over'){
    var pl=LP[0], L=['Vittorie in volo: '+pl.kills+(pl.fac==='G'?'   (il Barone ne ottenne 80)':''),'Carri armati distrutti: '+pl.tanksK];
    if(pl.fac==='A') L.push('Barone Rosso abbattuto: '+pl.baronK+(pl.baronK===1?' volta':' volte'));
    L.push('Grado raggiunto: '+rank(pl.kills));
    L.push('Ondate affrontate: '+wave+'   ·   punteggio '+score()+'   ·   record '+best);
    L.push('');
    L.push((TOUCH?'Tocca lo schermo':'Premi INVIO o clicca')+' per tornare al menu');
    panel(L,'MISSIONE CONCLUSA','');
  }
}
function engineSound(){
  if(!AC||!eng) return;
  try{
    var e=LP[0]&&LP[0].ent, on=(state==='play'&&!paused&&e&&!e.dead&&!muted&&(e.isTank||e.fuel>0));
    if(!e){ engGain.gain.value=0; return; }
    if(e.isTank){ engGain.gain.value=on?0.05:0; eng.frequency.value=22+Math.abs(e.spd)*0.25; }
    else { engGain.gain.value=on?(e.landed&&e.thr<0.05?0.025:0.06):0; eng.frequency.value=28+e.thr*42+e.spd*0.07; }
  }catch(e2){}
}

// ---------- comandi ----------
function setupTouch(){
  if(!TOUCH) return;
  var veh=LP[0]?LP[0].veh:VEH;
  function set(id,k,html){var el=document.getElementById(id); el.setAttribute('data-k',k); el.innerHTML=html;}
  if(veh==='aereo'){
    set('tb1',38,'&#9650;<br>cabra'); set('tb2',40,'&#9660;<br>picchia'); set('tb3',87,'GAS +'); set('tb4',83,'GAS &minus;');
    set('tb5',32,'FUOCO'); set('tb6',82,'tonneau'); set('tb7',66,'BOMBA');
  } else {
    set('tb1',38,'&#9650;<br>alza'); set('tb2',40,'&#9660;<br>abbassa'); set('tb3',39,'&#9654;'); set('tb4',37,'&#9664;');
    set('tb5',32,'CANNONE'); set('tb6',82,'gira'); set('tb7',66,'MITRA');
  }
  var b3=document.getElementById('tb3').style, b4=document.getElementById('tb4').style;
  if(veh==='carro'){ b4.left='104px'; b4.bottom='22px'; b3.left='192px'; b3.bottom='22px'; }
  else { b3.left='104px'; b3.bottom='112px'; b4.left='104px'; b4.bottom='22px'; }
}
function startGame(){
  if(MODE==='online'){ readName(); initRoom(); if(!room||RROLE!=='in'){ rStat='Prima crea una stanza oppure entra con il codice'; return; } }
  try{localStorage.setItem('br4_om',OM); localStorage.setItem('br4_na',''+NALLY); localStorage.setItem('br4_tm',''+PTEAM); localStorage.setItem('br2_side',SIDE); localStorage.setItem('br2_veh',VEH); localStorage.setItem('br3_mode',MODE);
      localStorage.setItem('br3_v1',V1); localStorage.setItem('br3_v2',V2); localStorage.setItem('br3_name',MYNAME);}catch(e){}
  newGame();
}
function toMenu(){ state='title'; paused=false; keys={}; ME=null; P=null; PT=null; LP=[]; planes=[]; tanks=[]; bullets=[]; shells=[]; bombs=[]; rings=[]; msgs=[]; loadBest(); }
function togglePause(){ if(state!=='play') return; paused=!paused; keys={}; }
function clickAt(x,y){
  initAudio(); unlockVoice();
  if(state==='title'){
    for(var k=0;k<uiBtns.length;k++){var b=uiBtns[k]; if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.act(); return;}}
    return;
  }
  if(state==='over'&&overT>1){ toMenu(); return; }
  if(paused) togglePause();
}
function press(k){
  initAudio();
  if(state==='title'){
    if(k===49){MODE='single';loadBest();} else if(k===50&&!TOUCH){MODE='local2';} else if(k===51){MODE='online';initRoom();}
    else if(MODE!=='local2'&&(k===37||k===39)){SIDE=SIDE==='barone'?'nemico':'barone'; loadBest();}
    else if(MODE!=='local2'&&(k===38||k===40)){VEH=VEH==='aereo'?'carro':'aereo'; loadBest();}
    else if(k===13) startGame();
    else if(k===67&&MODE==='online'&&room) openChat();
    return;
  }
  if(MODE==='online'&&k===13&&room&&state==='play'){ openChat(); return; }
  if(MODE==='online'&&(k===86||k===78)&&state==='play') return;   // la radio è gestita dal modulo comune (pulsante 📻)
  if(k===27){ if(state==='play'&&!paused) togglePause(); else toMenu(); return; }
  if(k===80){togglePause(); return;}
  if(k===77){muted=!muted; return;}
  if((k===13||k===32)&&state==='over'&&overT>1){toMenu(); return;}
  keys[k]=true;
}
function release(k){keys[k]=false; if(k===86||k===78) setTalk(false);}
document.onkeydown=function(e){
  e=e||window.event; var k=e.keyCode;
  if(e.target===nmInput){ if(k===13){ nmInput.blur(); startGame(); } return; }
  if(e.target===cdInput){ if(k===13){ cdInput.blur(); joinRoom(); } return; }
  if(e.target===ciInput){ if(k===13){ sendChat(); } else if(k===27){ closeChat(); } return; }
  if(k===32||(k>=37&&k<=40)){ if(e.preventDefault) e.preventDefault(); else e.returnValue=false; }
  if(held[k]) return; held[k]=true; press(k);
};
document.onkeyup=function(e){ e=e||window.event; var k=e.keyCode; held[k]=false; release(k); };
window.onblur=function(){ keys={}; held={}; setTalk(false); if(state==='play'&&!paused&&MODE!=='online') paused=true; };
cv.onmousedown=function(e){ e=e||window.event; clickAt(e.clientX,e.clientY); };
if(cv.addEventListener) cv.addEventListener('touchstart',function(e){ e.preventDefault(); var t=e.touches[0]||e.changedTouches[0]; clickAt(t.clientX,t.clientY); },false);

if(TOUCH&&document.querySelectorAll){
  var bs=document.querySelectorAll('#tc .b');
  for(var bi=0;bi<bs.length;bi++)(function(el){
    el.addEventListener('touchstart',function(e){
      e.preventDefault(); var k=parseInt(el.getAttribute('data-k'),10); el.className+=' on'; el._k=k;
      if(state==='title'){ return; }
      if(k===32&&state==='over'&&overT>1){toMenu(); return;}
      if(k===80&&paused){togglePause(); return;}
      press(k);
    },false);
    var up=function(e){ e.preventDefault(); el.className=el.className.replace(' on',''); if(el._k!==undefined) release(el._k); };
    el.addEventListener('touchend',up,false); el.addEventListener('touchcancel',up,false);
  })(bs[bi]);
}
function showTouch(){ if(!TOUCH) return; document.getElementById('tc').style.display=(state==='title'||MODE==='local2')?'none':'block';
  var on=MODE==='online'&&!!room; document.getElementById('tbc').style.display=on?'flex':'none'; document.getElementById('tbv').style.display=(on&&vStream)?'flex':'none'; }

// ---------- avvio ----------
nmInput.value=MYNAME;
try{ var qm=/[?&#]stanza=([A-Za-z0-9]+)/.exec(location.href); if(qm){ cdInput.value=normCode(qm[1]); MODE='online'; } }catch(e){}
if(MODE==='online') initRoom();
var last=now();
function frame(){
  raf(frame);
  var t=now(), dt=(t-last)/1000; last=t;
  if(dt>0.05) dt=0.05; if(dt<=0) dt=0.001;
  if(state==='title') idle(dt);
  else if(!paused||MODE==='online') update(paused?0:dt);
  if(MODE==='online'&&netState==='none'){ netRetry-=dt; if(netRetry<=0) initRoom(); }
  netUpdate(dt); updRemotes(dt); sendPresence(dt);
  engineSound(); showTouch();
  render();
}
frame();
})();
</script>
