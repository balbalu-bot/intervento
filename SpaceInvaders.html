'use strict';const $=id=>document.getElementById(id),cv=$('cv'),g=cv.getContext('2d'),W=224,H=256;let state=null,mode='menu',peer=null,conn=null,role=0,keys={},remote={},sound=true,ac,last=0,sendAt=0,networkTimer=0;const green='#51ff79',sprites=[['00111100','01111110','11111111','11011011','11111111','00100100','01000010','10000001'],['00100000100','00010001000','00111111100','01101110110','11111111111','10111111101','10100000101','00011011000'],['0001111000','0111111110','1111111111','1100110011','1111111111','0011001100','0110011000','1100000011']],ship=['00000100000','00001110000','00011111000','11111111111','11111111111','11111111111'];function pix(s,x,y,flip=false){for(let i=0;i<s.length;i++)for(let j=0;j<s[i].length;j++)if(s[i][j]==='1')g.fillRect(Math.round(x)+(flip?s[i].length-1-j:j),Math.round(y)+i,1,1)}function tone(f,d=.1,end=f,type='square',vol=.035){if(!sound||!ac)return;try{let o=ac.createOscillator(),a=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),ac.currentTime+d);a.gain.setValueAtTime(vol,ac.currentTime);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(a);a.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}function fx(t){if(t==='fire')tone(650,.11,100);if(t==='hit')tone(125,.11,50);if(t==='dead')tone(95,.45,25,'sawtooth');if(t==='ufo')tone(950,.22,300);if(t==='step')tone([90,82,75,68][state?.beat%4||0],.09,55);if(t==='wave')tone(240,.4,780);if(mode==='host'&&conn?.open)conn.send({t:'fx',v:t})}function high(){try{return +localStorage.getItem('invadersHigh')||0}catch(e){return 0}}function save(){try{localStorage.setItem('invadersHigh',Math.max(high(),state.score))}catch(e){}}function wave(){let s=state;s.aliens=[];s.dx=1;s.move=0;s.enemy=0;s.beat=0;s.shots=[];s.ufo=null;s.ufoTime=18;s.pause=1.4;s.shields=[];for(let r=0;r<5;r++)for(let c=0;c<11;c++)s.aliens.push({x:23+c*16,y:38+Math.min(48,(s.level-1)*8)+r*13,r,c});for(let k=0;k<4;k++)for(let y=0;y<14;y++)for(let x=0;x<24;x++)if((y>2||x>=3&&x<21)&&!(y>8&&x>=8&&x<16))s.shields.push([19+k*54+x,y+199]);}function start(n,m){mode=m;state={level:1,score:0,players:Array.from({length:n},(_,i)=>({x:n===1?112:70+i*84,lives:3,score:0,bonus:false,inv:1,dead:0,shots:0})),over:false};wave();$('menu').hidden=true;$('touch').hidden=false;$('back').hidden=false;$('status').textContent=n===2?'CO-OP · DIFENDETE LA TERRA':'1 PLAYER';audio()}function points(p,n){p.score+=n;state.score+=n;if(!p.bonus&&p.score>=1500){p.bonus=true;p.lives++;fx('wave')}save()}function hitPlayer(p){if(p.inv>0||p.dead>0||p.lives<=0)return;p.lives--;p.dead=1.4;p.inv=3;fx('dead');if(state.players.every(q=>q.lives<=0)){state.over=true;save()}}function input(i){if(i===1&&mode==='host')return remote;if(i===1)return{left:keys.KeyA,right:keys.KeyD,fire:keys.KeyF};return{left:keys.ArrowLeft||keys.touchLeft,right:keys.ArrowRight||keys.touchRight,fire:keys.Space||keys.touchFire}}function tick(dt){let s=state;if(!s||s.over)return;if(s.pause>0){s.pause-=dt;return}for(let [i,p] of s.players.entries()){p.inv=Math.max(0,p.inv-dt);p.dead=Math.max(0,p.dead-dt);if(!p.lives||p.dead)continue;let k=input(i);p.x=Math.max(7,Math.min(217,p.x+((k.right?1:0)-(k.left?1:0))*78*dt));if(k.fire&&!s.shots.some(b=>b.owner===i)){p.shots++;s.shots.push({x:p.x,y:232,v:-145,owner:i});fx('fire')}}let count=s.aliens.length;s.move+=dt;let interval=Math.max(.045,.66*(count/55)**.87/(1+(s.level-1)*.07));if(s.move>=interval){s.move-=interval;let edge=s.aliens.some(a=>a.x+s.dx*3<5||a.x+s.dx*3>208);if(edge){s.dx*=-1;for(let a of s.aliens)a.y+=8}else for(let a of s.aliens)a.x+=s.dx*3;s.beat++;fx('step');if(s.aliens.some(a=>a.y+8>=233)){s.over=true;save();fx('dead');return}s.shields=s.shields.filter(([x,y])=>!s.aliens.some(a=>x>=a.x&&x<a.x+11&&y>=a.y&&y<a.y+8))}s.enemy-=dt;if(s.enemy<=0){s.enemy=Math.max(.28,1.2-s.level*.055) );for(let q of s.shields)g.fillRect(q[0],q[1],1,1);for(let b of s.shots)g.fillRect(Math.round(b.x),Math.round(b.y),1,b.owner<0?4:3);for(let [i,p] of s.players.entries()){if(p.lives&&!p.dead&&(p.inv<=0||Math.floor(p.inv*10)%2===0)){pix(ship,p.x-5,233);if(s.players.length>1)txt(String(i+1),p.x-2,247,6)}}g.fillRect(4,250,216,1);txt('1P '+s.players[0].lives,5,255,6);if(s.players[1])txt('2P '+s.players[1].lives,190,255,6);if(s.over||s.pause>0){g.fillStyle='#000';g.fillRect(30,111,164,29);g.fillStyle=green;txt(s.over?'GAME OVER':'WAVE '+s.level,s.over?74:85,128,13);if(s.over)txt('MENU PER RIPROVARE',64,138,7)}}function loop(t){let dt=Math.min(.045,(t-last)/1000||0);last=t;if(mode==='solo'||mode==='local'||mode==='host')tick(dt);if(t-sendAt>50){sendAt=t;if(conn?.open){if(mode==='host'&&state)conn.send({t:'state',v:state});if(mode==='guest')conn.send({t:'input',v:input(0)})}}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);function reset(){clearTimeout(networkTimer);mode='menu';state=null;keys={};remote={};let old=peer;peer=null;conn=null;try{old?.destroy()}catch(e){}$('menu').hidden=false;$('touch').hidden=true;$('back').hidden=true;$('status').textContent=''}function fail(msg){if(mode==='menu')return;reset();$('status').textContent=msg}function connect(c,host){conn=c;c.on('open',()=>{if(conn!==c)return;clearTimeout(networkTimer);if(host){start(2,'host');c.send({t:'start'})}else{$('status').textContent='CONNESSO · ATTENDI'}});c.on('data',d=>{if(conn!==c||!d)return;if(host&&d.t==='input')remote=d.v||{};if(!host&&d.t==='start'){mode='guest';$('menu').hidden=true;$('touch').hidden=false;$('back').hidden=false;$('status').textContent='CO-OP ONLINE · 2P'}if(!host&&d.t==='state')state=d.v;if(!host&&d.t==='fx')fx(d.v)});c.on('close',()=>{if(conn===c)fail('CONNESSIONE CHIUSA')});c.on('error',()=>{if(conn===c)fail('ERRORE CONNESSIONE')})}function online(host){audio();if(!window.Peer){$('status').textContent='SERVIZIO ONLINE NON DISPONIBILE. RIPROVA O GIOCA IN LOCALE.'
