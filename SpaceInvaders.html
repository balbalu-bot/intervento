<!doctype html><html lang="it"><meta charset="utf-8">
<script>
/* RETE DI RISERVA + RADIO DI SQUADRA — modulo comune ai giochi online di balbalu-bot.
   1) Se il collegamento diretto tra due dispositivi non parte (tipico: telefono con i dati
      mobili), la partita passa da sola su un server pubblico (MQTT) che fa da ponte.
   2) Radio "premi e parla": la voce viaggia sullo stesso server, quindi funziona da qualsiasi rete.
   Il gioco non viene modificato: il modulo si aggancia a PeerJS e, se qualcosa va storto, si spegne. */
(function(){
  'use strict';
  if(window.__radioSquadra) return; window.__radioSquadra=1;

  var BROKERS=window.__RADIO_TEST_BROKERS||['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
  var MQTT_URL=window.__RADIO_TEST_MQTT||'https://unpkg.com/mqtt@5.16.1/dist/mqtt.min.js';
  var PFX='balbalu/rr1/', TALK_KEY='KeyN', FALLBACK_MS=7000;
  function rid(){ return Math.random().toString(36).slice(2,10); }
  function tclean(s){ return String(s||'').replace(/[^A-Za-z0-9_.-]/g,'_').slice(0,80); }
  function nowMs(){ return Date.now(); }

  // ================= 1. server ponte (MQTT) =================
  var R={clients:[],subs:{},loading:false,seen:{},seenQ:[],seq:0,id:rid()+rid()};
  function relayStart(){
    if(R.clients.length||R.loading) return;
    if(window.mqtt&&window.mqtt.connect){ connectAll(); return; }
    R.loading=true;
    var s=document.createElement('script'); s.src=MQTT_URL;
    s.onload=function(){ R.loading=false; if(window.mqtt&&window.mqtt.connect) connectAll(); };
    s.onerror=function(){ R.loading=false; };
    (document.head||document.documentElement).appendChild(s);
  }
  function connectAll(){
    BROKERS.forEach(function(u){
      var c; try{ c=window.mqtt.connect(u,{clientId:'bb'+rid()+rid(),keepalive:30,reconnectPeriod:4000,connectTimeout:10000,clean:true}); }catch(e){ return; }
      c.on('connect',function(){ Object.keys(R.subs).forEach(function(t){ try{ c.subscribe(t,{qos:0}); }catch(e){} }); render(); });
      c.on('message',function(t,p){ onRelayMsg(t,p); });
      c.on('error',function(){}); c.on('close',function(){ render(); });
      R.clients.push(c);
    });
  }
  function relayUp(){ for(var i=0;i<R.clients.length;i++) if(R.clients[i].connected) return true; return false; }
  function rsub(t,fn){ t=PFX+t; R.subs[t]=fn; relayStart(); R.clients.forEach(function(c){ if(c.connected) try{ c.subscribe(t,{qos:0}); }catch(e){} }); }
  function runsub(t){ t=PFX+t; delete R.subs[t]; R.clients.forEach(function(c){ try{ c.unsubscribe(t); }catch(e){} }); }
  function rpub(t,o){
    relayStart(); o._m=R.id+':'+(++R.seq);
    var s; try{ s=JSON.stringify(o); }catch(e){ return; }
    R.clients.forEach(function(c){ if(c.connected) try{ c.publish(PFX+t,s,{qos:0}); }catch(e){} });
  }
  var TD=(typeof TextDecoder!=='undefined')?new TextDecoder():null;
  function onRelayMsg(t,p){
    var fn=R.subs[t]; if(!fn) return;
    var o; try{ o=JSON.parse(typeof p==='string'?p:(TD?TD.decode(p):String(p))); }catch(e){ return; }
    if(!o||typeof o!=='object') return;
    var m=o._m;
    if(typeof m==='string'){ if(R.seen[m]) return; R.seen[m]=1; R.seenQ.push(m); if(R.seenQ.length>4000) delete R.seen[R.seenQ.shift()]; }
    try{ fn(o); }catch(e){ setTimeout(function(){ throw e; }); }
  }

  // piccolo gestore di eventi, compatibile con quello di PeerJS
  function Em(){ this._ev={}; }
  Em.prototype.on=function(e,f){ (this._ev[e]=this._ev[e]||[]).push(f); return this; };
  Em.prototype.addListener=Em.prototype.on;
  Em.prototype.once=function(e,f){ var me=this; function g(){ me.off(e,g); return f.apply(me,arguments); } g._f=f; return this.on(e,g); };
  Em.prototype.off=function(e,f){ var a=this._ev[e]; if(!a) return this; if(!f){ delete this._ev[e]; return this; } this._ev[e]=a.filter(function(x){ return x!==f&&x._f!==f; }); return this; };
  Em.prototype.removeListener=Em.prototype.off;
  Em.prototype.removeAllListeners=function(e){ if(e) delete this._ev[e]; else this._ev={}; return this; };
  Em.prototype.listenerCount=function(e){ return (this._ev[e]||[]).length; };
  Em.prototype.listeners=function(e){ return (this._ev[e]||[]).slice(); };
  Em.prototype.emit=function(e){
    var a=(this._ev[e]||[]).slice(), args=[].slice.call(arguments,1), me=this;
    a.forEach(function(f){ try{ f.apply(me,args); }catch(x){ setTimeout(function(){ throw x; }); } });
    return a.length>0;
  };

  var relayNote=0;
  function noteRelay(){ relayNote=nowMs(); render(); setTimeout(render,6000); }

  // --- lato di chi entra: collegamento "doppio" (diretto, altrimenti ponte) ---
  function XConn(provider,target,opts){
    Em.call(this); opts=opts||{};
    this.peer=target; this.provider=provider; this.open=false; this.type='data';
    this.label=opts.label||('dc_'+rid()); this.metadata=opts.metadata; this.serialization=opts.serialization||'binary'; this.reliable=!!opts.reliable;
    this.mode='real'; this.real=null; this.closed=false; this.noRelay=false; this.__radioProxy=true;
  }
  XConn.prototype=Object.create(Em.prototype);
  XConn.prototype.attach=function(real){
    var me=this; me.real=real;
    real.on('open',function(){ if(me.mode!=='real'||me.closed) return; clearTimeout(me.fbT); me.open=true; me.emit('open'); });
    real.on('data',function(d){ if(me.mode==='real'&&!me.closed) me.emit('data',d); });
    real.on('close',function(){ if(me.mode!=='real'||me.closed) return; if(me.open||me.noRelay) me._end(); else me.toRelay(); });
    real.on('error',function(e){ if(me.mode!=='real'||me.closed) return; if(me.open) me.emit('error',e); else if(!me.noRelay) me.toRelay(); });
    me.fbT=setTimeout(function(){ if(!me.open&&me.mode==='real'&&!me.closed&&!me.noRelay) me.toRelay(); },FALLBACK_MS);
  };
  XConn.prototype.toRelay=function(){
    var me=this; if(me.mode==='relay'||me.closed||me.noRelay) return;
    me.mode='relay'; clearTimeout(me.fbT);
    try{ if(me.real) me.real.close(); }catch(e){}
    me.gid=tclean(me.provider.id||('g'+rid())); me.cid=rid(); me.hostT='h/'+tclean(me.peer); me.inT='g/'+me.gid+'/'+me.cid;
    rsub(me.inT,function(o){ me._msg(o); });
    var tries=0;
    (function hello(){
      if(me.open||me.closed) return;
      if(++tries>24){ me.emit('error',{type:'peer-unavailable',message:'Collegamento non riuscito'}); me._end(); return; }
      rpub(me.hostT,{t:'hello',from:me.gid,cid:me.cid});
      me.helloT=setTimeout(hello,1500);
    })();
  };
  XConn.prototype._msg=function(o){
    var me=this; if(me.closed) return; me.last=nowMs();
    if(o.t==='ack'&&!me.open){
      me.open=true; clearTimeout(me.helloT); noteRelay(); me.emit('open');
      me.pingT=setInterval(function(){ if(nowMs()-me.last>16000){ me._end(); return; } rpub(me.hostT,{t:'p',from:me.gid,cid:me.cid}); },4000);
    } else if(o.t==='d'&&me.open) me.emit('data',o.d);
    else if(o.t==='bye') me._end();
  };
  XConn.prototype.send=function(d){
    if(this.closed) return;
    if(this.mode==='real'){ if(this.real) return this.real.send(d); }
    else if(this.open) rpub(this.hostT,{t:'d',from:this.gid,cid:this.cid,d:d});
  };
  XConn.prototype.close=function(){
    if(this.closed) return;
    if(this.mode==='real'){ try{ if(this.real) this.real.close(); }catch(e){} }
    else rpub(this.hostT,{t:'bye',from:this.gid,cid:this.cid});
    this._end();
  };
  XConn.prototype._end=function(){
    if(this.closed) return; this.closed=true; this.open=false;
    clearTimeout(this.fbT); clearTimeout(this.helloT); clearInterval(this.pingT);
    if(this.inT) runsub(this.inT);
    this.emit('close');
  };
  Object.defineProperty(XConn.prototype,'dataChannel',{get:function(){ return this.real&&this.mode==='real'?this.real.dataChannel:null; }});
  Object.defineProperty(XConn.prototype,'peerConnection',{get:function(){ return this.real&&this.mode==='real'?this.real.peerConnection:null; }});

  // --- lato di chi crea la stanza: accetta anche chi arriva dal ponte ---
  function HConn(host,from,cid){
    Em.call(this); this.peer=from; this.cid=cid; this.provider=host; this.open=false; this.closed=false; this.type='data';
    this.label='relay_'+cid; this.serialization='json'; this.reliable=true; this.__relayH=true; this.outT='g/'+tclean(from)+'/'+cid; this.last=nowMs();
    var me=this;
    this.pingT=setInterval(function(){ if(nowMs()-me.last>16000){ me._end(); return; } rpub(me.outT,{t:'p'}); },4000);
  }
  HConn.prototype=Object.create(Em.prototype);
  HConn.prototype.send=function(d){ if(this.open&&!this.closed) rpub(this.outT,{t:'d',d:d}); };
  HConn.prototype.close=function(){ if(this.closed) return; rpub(this.outT,{t:'bye'}); this._end(); };
  HConn.prototype._end=function(){
    if(this.closed) return; this.closed=true; this.open=false; clearInterval(this.pingT);
    var rh=this.provider.__rh; if(rh&&rh.conns[this.cid]===this) delete rh.conns[this.cid];
    this.emit('close');
  };
  function relayHost(p,superEmit){
    if(p.__rh||!p.id) return;
    var rh=p.__rh={conns:{},topic:'h/'+tclean(p.id)};
    rsub(rh.topic,function(o){
      if(p.destroyed||typeof o.cid!=='string'||typeof o.from!=='string') return;
      var c=rh.conns[o.cid];
      if(o.t==='hello'){
        if(!c){
          c=new HConn(p,o.from,o.cid); rh.conns[o.cid]=c;
          superEmit('connection',c);
          setTimeout(function(){ if(!c.closed){ c.open=true; noteRelay(); c.emit('open'); } },0);
        }
        rpub(c.outT,{t:'ack'});
      } else if(c){
        c.last=nowMs();
        if(o.t==='d'&&c.open) c.emit('data',o.d);
        else if(o.t==='bye') c._end();
      }
    });
  }
  function relayHostStop(p){
    var rh=p.__rh; if(!rh) return; p.__rh=null; runsub(rh.topic);
    for(var k in rh.conns){ try{ rh.conns[k].close(); }catch(e){} }
  }

  // ================= 2. aggancio a PeerJS =================
  var chan='', chanOwner=null;
  function noteChannel(id,owner){
    if(typeof id!=='string'||!id) return;
    if(chan===id){ chanOwner=owner||chanOwner; return; }
    leaveChannel(); chan=id; chanOwner=owner||null; joinChannel();
  }
  function wrap(P){
    if(typeof P!=='function'||P.__radioWrapped) return P;
    var W;
    try{
      W=class extends P{
        constructor(){
          super(...arguments);
          var me=this, fixed=(typeof arguments[0]==='string')?arguments[0]:null;
          me.__proxies=[];
          try{
            if(fixed) me.on('open',function(){ relayHost(me,function(ev,a){ return P.prototype.emit.call(me,ev,a); }); if(!me.__radioGuest) noteChannel(fixed,me); });
            me.on('connection',function(){ if(!me.__radioGuest&&me.id) noteChannel(me.id,me); });
          }catch(e){}
        }
        connect(id,opts){
          this.__radioGuest=true;
          try{ noteChannel(id,this); }catch(e){}
          var real=super.connect.apply(this,arguments);
          if(!real||typeof real.on!=='function') return real;
          var x=new XConn(this,id,opts); x.attach(real); this.__proxies.push(x);
          return x;
        }
        emit(ev,a){
          // chi crea la stanza vede un collegamento diretto solo quando è davvero aperto:
          // se non si apre, il gioco non lo vede e l'altro arriva dal ponte
          if(ev==='connection'&&a&&!a.__relayH&&!a.open&&typeof a.on==='function'){
            var done=false;
            a.on('open',()=>{ if(done) return; done=true; super.emit('connection',a); setTimeout(function(){ try{ a.emit('open'); }catch(e){} },0); });
            return true;
          }
          if(ev==='error'&&a&&a.type==='peer-unavailable'&&this.__proxies){
            this.__proxies.forEach(function(x){ if(!x.open){ x.noRelay=true; clearTimeout(x.fbT); } });
          }
          return super.emit.apply(this,arguments);
        }
        destroy(){
          try{ relayHostStop(this); }catch(e){}
          try{ (this.__proxies||[]).forEach(function(x){ x.close(); }); }catch(e){}
          try{ if(chanOwner===this) setTimeout(function(){ if(chanOwner&&chanOwner.destroyed) leaveChannel(); },0); }catch(e){}
          return super.destroy.apply(this,arguments);
        }
      };
      W.__radioWrapped=true;
    }catch(e){ return P; }
    return W;
  }
  try{
    var cur=window.Peer;
    if(cur) cur=wrap(cur);
    Object.defineProperty(window,'Peer',{configurable:true,enumerable:true,
      get:function(){ return cur; },
      set:function(v){ if(window.__RADIO_TEST_PEER) v=window.__RADIO_TEST_PEER; cur=wrap(v); }});
  }catch(e){}

  // ================= 3. radio: presenze e voce sul ponte =================
  var myId=rid()+rid(), members={}, micStream=null, talking=false, status='', needTap=false, stT=null;
  function chanT(){ return 'r/'+tclean(chan); }
  var lastName='';
  document.addEventListener('input',function(e){ var t=e.target; if(t&&t.matches&&t.matches('#nickname,#name,#nome,#nick,#playerName,#nm,#cs')) lastName=String(t.value||''); },true);
  function myName(){
    var el=document.querySelector('#nickname,#name,#nome,#nick,#playerName,#nm,#cs');
    var v=el&&el.value?String(el.value).trim():(lastName||'').trim();
    if(!v){ try{ v=localStorage.getItem('autoscontri-name')||localStorage.getItem('br3_name')||''; }catch(e){} }
    return clean(v);
  }
  function clean(s){ return String(s||'').replace(/[\u0000-\u001f<>]/g,'').slice(0,14)||'Giocatore'; }
  function joinChannel(){
    if(!chan) return;
    members={};
    rsub(chanT(),onRadio);
    clearInterval(stT); stT=setInterval(announce,2000); announce();
    render();
  }
  function leaveChannel(){
    if(chan){ try{ rpub(chanT(),{t:'bye',id:myId}); }catch(e){} runsub(chanT()); }
    clearInterval(stT); members={}; chan=''; chanOwner=null; setTalk(false); render();
  }
  function announce(){ if(chan) rpub(chanT(),{t:'st',id:myId,n:myName(),vo:micStream?1:0,tk:talking?1:0}); expire(); render(); }
  function expire(){ var t=nowMs(); for(var id in members) if(t-members[id].last>7000) delete members[id]; }
  function onRadio(o){
    if(typeof o.id!=='string'||o.id===myId) return;
    var m=members[o.id]||(members[o.id]={n:'Giocatore',vo:0,tk:0,last:0,heard:0,next:0});
    m.last=nowMs();
    if(o.t==='st'){ m.n=clean(o.n); m.vo=o.vo?1:0; m.tk=o.tk?1:0; render(); }
    else if(o.t==='a'&&typeof o.d==='string'){ m.heard=nowMs(); m.n=o.n?clean(o.n):m.n; playChunk(m,o.d); if(!m.tkShow){ m.tkShow=1; render(); } }
    else if(o.t==='bye'){ delete members[o.id]; render(); }
  }

  // --- audio: 8000 Hz, mu-law (come una radio/telefono), pacchetti da 200 ms ---
  var AC=null, proc=null, srcNode=null, sinkGain=null, buf=[], pos=0, aSeq=0;
  function ensureAC(){
    if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ AC=new C(); }catch(e){ return null; } }
    if(AC.state==='suspended'&&AC.resume){ try{ AC.resume(); }catch(e){} }
    return AC;
  }
  function muEnc(x){ var s=x<0?0x80:0; if(x<0) x=-x; if(x>1) x=1; var v=Math.min(32635,Math.floor(x*32767))+132, e=7; for(var m=0x4000;(v&m)===0&&e>0;m>>=1) e--; var man=(v>>(e+3))&0x0F; return ~(s|(e<<4)|man)&0xFF; }
  var MU=new Float32Array(256);
  (function(){ for(var i=0;i<256;i++){ var u=~i&0xFF, s=u&0x80, e=(u>>4)&7, m=u&0x0F, v=((m<<3)+132)<<e; v-=132; MU[i]=(s?-v:v)/32768; } })();
  function b64(bytes){ var s=''; for(var i=0;i<bytes.length;i+=4096) s+=String.fromCharCode.apply(null,bytes.slice(i,i+4096)); return btoa(s); }
  function unb64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  function startCapture(stream){
    var ac=ensureAC(); if(!ac) return false;
    try{
      srcNode=ac.createMediaStreamSource(stream);
      proc=(ac.createScriptProcessor||ac.createJavaScriptNode).call(ac,4096,1,1);
      sinkGain=ac.createGain(); sinkGain.gain.value=0;
      srcNode.connect(proc); proc.connect(sinkGain); sinkGain.connect(ac.destination);
    }catch(e){ return false; }
    var ratio=ac.sampleRate/8000;
    proc.onaudioprocess=function(ev){
      if(!talking||!chan) { pos=0; return; }
      var inp=ev.inputBuffer.getChannelData(0), n=inp.length;
      while(pos<n){
        var a=Math.floor(pos), b=Math.min(n,Math.floor(pos+ratio)), sum=0, c=0;
        for(var i=a;i<b;i++){ sum+=inp[i]; c++; }
        buf.push(muEnc(c?sum/c:inp[a]||0)); pos+=ratio;
      }
      pos-=n;
      if(buf.length>=1600) flush();
    };
    return true;
  }
  function flush(){ if(!buf.length) return; var bytes=buf; buf=[]; rpub(chanT(),{t:'a',id:myId,n:myName(),s:++aSeq,d:b64(bytes)}); }
  function playChunk(m,d){
    var ac=AC; if(!ac||ac.state!=='running'){ needTap=true; ensureAC(); render(); if(!ac) return; }
    var bytes; try{ bytes=unb64(d); }catch(e){ return; }
    if(!bytes.length||bytes.length>8000) return;
    var sr=ac.sampleRate, len=Math.floor(bytes.length*sr/8000), out=ac.createBuffer(1,len,sr), ch=out.getChannelData(0), k=8000/sr;
    for(var i=0;i<len;i++){ var p=i*k, j=Math.floor(p), f=p-j, x0=MU[bytes[j]], x1=MU[bytes[Math.min(bytes.length-1,j+1)]]; ch[i]=(x0+(x1-x0)*f)*1.6; }
    var s=ac.createBufferSource(); s.buffer=out; s.connect(ac.destination);
    var t=ac.currentTime;
    if(m.next<t+0.05||m.next>t+1.2) m.next=t+0.25;
    try{ s.start(m.next); }catch(e){}
    m.next+=out.duration;
  }
  function micOn(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ status='Questo browser non permette il microfono'; render(); return; }
    ensureAC();
    status='Consenti il microfono…'; render();
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false}).then(function(s){
      micStream=s; status='';
      if(!startCapture(s)){ status='Audio non disponibile su questo browser'; }
      announce();
    },function(){ status='Microfono non consentito'; render(); });
  }
  function micOff(){
    setTalk(false);
    try{ if(proc){ proc.onaudioprocess=null; proc.disconnect(); } if(srcNode) srcNode.disconnect(); if(sinkGain) sinkGain.disconnect(); }catch(e){}
    proc=null; srcNode=null; sinkGain=null;
    if(micStream){ try{ micStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} }
    micStream=null; announce();
  }
  function setTalk(b){
    var t=!!(b&&micStream&&chan);
    if(t===talking) return;
    talking=t; if(!t) flush(); else { ensureAC(); buf=[]; pos=0; }
    announce();
  }
  function unlock(){
    var ac=AC||(needTap||micStream?ensureAC():null);
    if(!AC) ensureAC(); else if(AC.state==='suspended') ensureAC();
    if(needTap){ needTap=false; render(); }
  }
  window.addEventListener('pointerdown',unlock,true);
  window.addEventListener('touchstart',unlock,{capture:true,passive:true});
  window.addEventListener('keydown',function(){ if(!AC||AC.state!=='running') unlock(); },true);
  function isTyping(e){ var t=e.target; return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable); }
  window.addEventListener('keydown',function(e){ if(e.code===TALK_KEY&&!isTyping(e)&&micStream&&!e.repeat) setTalk(true); },true);
  window.addEventListener('keyup',function(e){ if(e.code===TALK_KEY) setTalk(false); },true);
  window.addEventListener('blur',function(){ setTalk(false); });

  // ================= 4. pulsanti sullo schermo =================
  var box=null, bRadio, bTalk, lab;
  function el(tag){ return document.createElement(tag); }
  function build(){
    if(box||!document.body) return;
    var css=el('style');
    css.textContent='#radioSq{position:fixed;right:max(8px,env(safe-area-inset-right));top:38%;z-index:2147483000;display:none;flex-direction:column;align-items:flex-end;gap:6px;font:600 13px system-ui,-apple-system,Arial,sans-serif;-webkit-user-select:none;user-select:none;pointer-events:none}'+
      '#radioSq button{pointer-events:auto;border:2px solid #f2d9a8;color:#fff8e8;border-radius:22px;font:700 13px system-ui,-apple-system,Arial,sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}'+
      '#radioSq .r{background:#3b2a1acc;padding:7px 12px}#radioSq .r.on{background:#1f6b3acc}'+
      '#radioSq .t{width:66px;height:66px;border-radius:50%;background:#8a1e1ecc;font-size:14px;line-height:1.1}#radioSq .t.on{background:#e23b2a;box-shadow:0 0 0 5px #e23b2a55}'+
      '#radioSq .l{background:#000a;color:#ffe9b0;padding:4px 9px;border-radius:9px;max-width:190px;text-align:right;display:none}';
    document.head.appendChild(css);
    box=el('div'); box.id='radioSq';
    bRadio=el('button'); bRadio.className='r';
    bTalk=el('button'); bTalk.className='t'; bTalk.innerHTML='🎙<br>PARLA';
    lab=el('div'); lab.className='l';
    box.appendChild(bRadio); box.appendChild(bTalk); box.appendChild(lab);
    document.body.appendChild(box);
    // tocco breve = accendi/spegni; tieni premuto e trascina = sposta la radio
    var drag=null;
