<script>window.MP_GAME="barone";
/* Multiplayer fuori da Claude: imita la "stanza" di Claude usando PeerJS (WebRTC).
   Il primo dispositivo che entra fa da "host" e inoltra le posizioni a tutti gli altri;
   se l'host esce, un altro prende il suo posto da solo.
   Stanza diversa: aggiungi #nome al link (es. ...barone.html#amici). */
(function(){
  var GAME=window.MP_GAME||'gioco';
  function roomName(){
    var h=(location.hash||'').replace('#','');
    var base='balbalu-'+GAME+'-v1';
    return /^[a-z0-9-]{1,24}$/i.test(h)?base+'-'+h.toLowerCase():base;
  }
  var me=null, isHost=false, peerObj=null, hostConn=null, conns={}, pres={}, mine=Object.freeze({}), connected=false;
  var snap=null, connCbs=[], peersCbs=[], started=false, retryT=null, seen={}, lastHost=0;
  function nowMs(){ return Date.now(); }
  function changed(){ snap=null; }
  function entry(id,pr,isMe){ return Object.freeze({peer:id,by:null,isMe:!!isMe,sameTab:!!isMe,kind:'viewer',guest:false,presence:pr,updatedAt:Date.now()}); }
  function snapshot(){
    if(snap) return snap;
    var a=[]; if(me) a.push(entry(me,mine,true));
    for(var id in pres) a.push(pres[id]);
    snap=Object.freeze(a); return snap;
  }
  function notifyPeers(){ var s=snapshot(); for(var i=0;i<peersCbs.length;i++){ try{peersCbs[i]({peers:s,joined:[],left:[],updated:[]});}catch(e){} } }

  function setPres(id,pr){ var isNew=!pres[id]; pres[id]=entry(id,pr,false); changed(); if(isNew) notifyPeers(); announceJoin(id,pr); }
  function dropPres(id){ if(pres[id]){ var nm=nameOf(pres[id].presence); delete pres[id]; changed(); notifyPeers(); if(announced[id]){ delete announced[id]; banner('👋 '+nm+' è uscito dal gioco',false); } } }

  /* ---- avvisi: chi entra e chi esce ---- */
  var announced={}, connectedAt=0, already=[], alreadyT=null, bannerEl=null, bannerT=null, actx=null;
  function nameOf(pr){ var n=pr&&typeof pr.n==='string'?pr.n:''; n=n.replace(/[\u0000-\u001f<>]/g,'').slice(0,16); return n||'Un giocatore'; }
  function announceJoin(id,pr){
    if(announced[id]||!pr||typeof pr.n!=='string') return;
    announced[id]=1;
    var nm=nameOf(pr);
    if(Date.now()-connectedAt<3500){ // chi c'era già quando sono entrato io
      already.push(nm); clearTimeout(alreadyT);
      alreadyT=setTimeout(function(){ banner('👥 In gioco ci sono già: '+already.join(', '),false); already=[]; },800);
      return;
    }
    banner('🔔 '+nm+' è entrato nel gioco!',true);
    try{ if(document.hidden&&window.Notification&&Notification.permission==='granted') new Notification('Nuovo giocatore',{body:nm+' è entrato nel gioco'}); }catch(e){}
  }
  function ding(){
    try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();
      var t=actx.currentTime;[880,1320].forEach(function(f,i){ var o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=f; g.gain.setValueAtTime(0.0001,t+i*.15); g.gain.exponentialRampToValueAtTime(0.25,t+i*.15+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+i*.15+.35); o.connect(g); g.connect(actx.destination); o.start(t+i*.15); o.stop(t+i*.15+.4); }); }catch(e){}
  }
  function banner(text,big){
    if(!document.body) return;
    if(!bannerEl){
      bannerEl=document.createElement('div');
      bannerEl.style.cssText='position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);z-index:99999;max-width:92vw;padding:12px 18px;border-radius:14px;background:rgba(20,30,45,.94);color:#fff;font:700 17px system-ui,-apple-system,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.45);border:2px solid #ffd000;text-align:center;transition:opacity .4s;pointer-events:auto';
      document.body.appendChild(bannerEl);
    }
    bannerEl.innerHTML='';
    var t=document.createElement('div'); t.textContent=text; bannerEl.appendChild(t);
    bannerEl.style.borderColor=big?'#ffd000':'rgba(255,255,255,.35)'; bannerEl.style.fontSize=big?'18px':'15px';
    // proposta: avvisi anche quando il gioco è in sottofondo
    if(big&&window.Notification&&Notification.permission==='default'){
      var b=document.createElement('button'); b.textContent='Avvisami anche col gioco in sottofondo';
      b.style.cssText='margin-top:8px;padding:6px 12px;border-radius:9px;border:0;background:#ffd000;color:#000;font:700 13px system-ui;cursor:pointer';
      b.onclick=function(ev){ ev.stopPropagation(); try{ Notification.requestPermission(); }catch(e){} b.remove(); };
      bannerEl.appendChild(b);
    }

    if(big) ding();

  }

  }

  function becomeHost(){
    var p; try{ p=new window.Peer(roomName()+'-host',{debug:0}); }catch(e){ retry(4000); return; }
    peerObj=p;
    p.on('open',function(id){ me=id; isHost=true; setConnected(true); changed(); notifyPeers(); });
    p.on('connection',function(c){

      });

      else if(e&&(e.type==='network'||e.type==='server-error'||e.type==='socket-error'||e.type==='socket-closed')) retry(3000+Math.random()*2000);
    });
    p.on('disconnected',function(){ try{ p.reconnect(); }catch(x){} });
  }
  function becomeClient(){
    var p; try{ p=new window.Peer({debug:0}); }catch(e){ retry(4000); return; }
    peerObj=p;
    p.on('open',function(id){
      me=id; isHost=false; changed(); notifyPeers();
      var c=p.connect(roomName()+'-host',{serialization:'json'});
      c.on('open',function(){ hostConn=c; lastHost=nowMs(); setConnected(true); safeSend(c,{t:'p',pr:mine}); });
      c.on('data',function(d){
        if(!d||typeof d!=='object') return; lastHost=nowMs();
        if(d.t==='p'&&d.id&&d.id!==me&&d.pr&&typeof d.pr==='object') setPres(d.id,d.pr);
        else if(d.t==='x'&&d.id) dropPres(d.id);
      });
      var lost=function(){ if(hostConn===c||!connected){ retry(400+Math.random()*1800); } };
      c.on('close',lost); c.on('error',lost);
    });
    p.on('error',function(e){
      // host sparito: provo a diventarlo io
      if(e&&e.type==='peer-unavailable') retry(200+Math.random()*1200);
      else if(e&&(e.type==='network'||e.type==='server-error'||e.type==='socket-error'||e.type==='socket-closed')) retry(3000+Math.random()*2000);
    });
    p.on('disconnected',function(){ try{ p.reconnect(); }catch(x){} });
  }

  // battito: l'host saluta ogni secondo; chi tace troppo a lungo viene considerato uscito
  setInterval(function(){
    if(!peerObj) return;
    var t=nowMs();
    if(isHost){
      broadcast({t:'hb'}); if(me) broadcast({t:'p',id:me,pr:mine});
      for(var id in conns){ if(t-(seen[id]||0)>7000){ var c=conns[id]; delete conns[id]; try{c.close();}catch(e){} dropPres(id); broadcast({t:'x',id:id}); } }
    } else if(hostConn&&t-lastHost>6000){ hostConn=null; retry(300+Math.random()*1500); }
    else if(hostConn) safeSend(hostConn,{t:'p',pr:mine});   // mi faccio sentire anche se il gioco non manda nulla
  },1000);
  var api={
    presence:function(patch){
      var m={},k; for(k in mine) m[k]=mine[k];
      for(k in patch){ if(patch[k]===null) delete m[k]; else m[k]=patch[k]; }
      mine=Object.freeze(m); changed();
      if(isHost) broadcast({t:'p',id:me,pr:mine}); else safeSend(hostConn,{t:'p',pr:mine});
      return Promise.resolve();
    },
    peers:function(){ return snapshot(); },
    onPeers:function(fn,onErr){ peersCbs.push(fn); setTimeout(function(){ try{fn({peers:snapshot(),joined:snapshot(),left:[],updated:[]});}catch(e){} },0);
      return function(){ var i=peersCbs.indexOf(fn); if(i>=0) peersCbs.splice(i,1); }; },
    onConnection:function(fn,onErr){ connCbs.push(fn); setTimeout(function(){ try{fn(connected);}catch(e){} },0);
      return function(){ var i=connCbs.indexOf(fn); if(i>=0) connCbs.splice(i,1); }; },
    connected:function(){ return connected; },
    emit:function(){ return Promise.resolve(); },
    on:function(){ return function(){}; },
    join:function(){ return Promise.reject({code:'not_permitted',message:'non disponibile'}); }
  };
  if(!window.claude){
    window.claude={use:function(name){
      if(name!=='room'||!window.Peer) return Promise.resolve(null);
      if(!started){ started=true; becomeHost(); }
      return Promise.resolve(api);
    }};
    // collegamento subito all'apertura: così gli avvisi di chi entra arrivano in qualsiasi modalità
    if(window.Peer){
      var nm=''; try{ nm=localStorage.getItem(GAME==='barone'?'br3_name':'volo_nome')||''; }catch(e){}
      mine=Object.freeze({n:nm||'Un giocatore'});
      started=true; becomeHost();
    }
  }
})();

<script>
(function(){

// ---------- scenario ----------
var farClouds=[], nearClouds=[], feats=[], hills=[], HP=3200, i;

  feats.push({x:fx,k:front?(r0<0.75?'crater':'post'):(r0<0.35?'crater':(r0<0.85?'tree':'house')),s:rnd(0.6,1.4)});
}
var trenches=[4250,4520,4900,5180,5600,6100];

// ---------- audio (opzionale) ----------
var AC=null, eng=null, engGain=null, master=null, noiseBuf=null, muted=false;
function initAudio(){
  if(AC){ if(AC.resume&&AC.state==='suspended'){try{AC.resume();}catch(e){}} return; }
  var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  try{
    AC=new C(); master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
    eng=AC.createOscillator(); eng.type='sawtooth';
    var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
    engGain=AC.createGain(); engGain.gain.value=0;
    eng.connect(lp); lp.connect(engGain); engGain.connect(master); eng.start(0);
    var len=Math.floor(AC.sampleRate*1.2); noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    var d=noiseBuf.getChannelData(0); for(var k=0;k<len;k++) d[k]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function sfx(type,vol){
  if(!AC||muted||!noiseBuf) return;
  try{
    var t=AC.currentTime, src=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(), dur=0.06, v=vol||1;
    src.buffer=noiseBuf;
    if(type==='gun'){f.type='bandpass';f.frequency.value=1100;g.gain.setValueAtTime(0.22*v,t);dur=0.06;}
    else if(type==='boom'){f.type='lowpass';f.frequency.value=260;g.gain.setValueAtTime(0.9*v,t);dur=1.1;}
    else if(type==='cannon'){f.type='lowpass';f.frequency.value=500;g.gain.setValueAtTime(0.7*v,t);dur=0.45;}
    else {f.type='highpass';f.frequency.value=2200;g.gain.setValueAtTime(0.18*v,t);dur=0.05;}
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t+dur+0.02);
  }catch(e){}
}
// distanza dal giocatore locale più vicino (per volume e scossoni)
function nearestLP(x,y){var b=1e9; for(var k=0;k<LP.length;k++){var e=LP[k].ent; if(!e)continue; var d=Math.abs(wrapD(x-e.x))+Math.abs((y===undefined?e.y:y)-e.y)*0.5; if(d<b)b=d;} return b;}

// ---------- messaggi ----------
function msg(t,life){msgs.push({t:t,l:life||3}); if(msgs.length>3) msgs.shift();}
function plName(pl){ return MODE==='local2'?(pl.fac==='G'?'Barone':'Alleato'):(pl.name||'Tu'); }

// ---------- entità ----------
function newPlane(fac){

          dead:false,crashed:false,landed:false,smokeT:0,rk:false,prop:0,fuel:100,bombs:6,bombT:0,col:'#c0141a',hitT:0,firing:false};
}
function newTankEnt(fac){
  var d=fac==='G'?1:-1;
  return {fac:fac,x:wrapX(DEPOT[fac]+(MODE==='single'?0:d*250)),y:GROUND,dir:d,spd:0,elev:0.35,hp:100,reload:0,mgT:0,shells:30,mg:500,heat:0,jam:0,dead:false,crashed:false,smokeT:0,rk:false,isTank:true,trk:0,firing:false};
}
function mkPL(i,fac,veh,map,name){
  var pl={i:i,fac:fac,tm:myTeam(fac),veh:veh,map:map,name:name,kills:0,deaths:0,tanksK:0,baronK:0,deathT:0,cam:{x:0,y:0},ent:null,flash:0,lastBy:null,killedBy:'',shSeq:0,lastShell:null,boSeq:0,lastBomb:null};
  spawnPL(pl); pl.cam.x=pl.ent.x; pl.cam.y=pl.ent.isTank?GROUND-300:pl.ent.y; return pl;
}
function spawnPL(pl){ pl.ent=pl.veh==='aereo'?newPlane(pl.fac):newTankEnt(pl.fac); pl.ent.pl=pl; pl.ent.tm=pl.tm; pl.deathT=0; pl.lastBy=null;
  if(MODE==='online'&&OM==='pvp'){ pl.ent.x=wrapX(pl.ent.x+rnd(-450,450)); if(!pl.ent.isTank) pl.ent.y=GROUND-rnd(400,900); } }
var WING_COLS=['#2c5e8a','#d4b21a','#3d6b2e','#7a3a8a'];
function newAI(fac,baron,idx){
  var me=ME||{x:BASE[PF],y:GROUND-500};
  var side=Math.random()<0.5?-1:1;
  var e={id:'u'+(++unitSeq),fac:fac,baron:!!baron,x:wrapX(me.x+side*rnd(1300,2400)),y:rnd(500,GROUND-650),a:0,spd:0,
    base:baron?212:Math.min(205,150+wave*7+rnd(0,15)),
    turn:baron?2.3:Math.min(2.0,1.25+wave*0.08+rnd(0,0.15)),
    hp:baron?14:6,max:baron?14:6,s:1,rollV:1,fireT:rnd(1,2),burst:0,mode:'attack',modeT:0,
    ev:0,evDir:1,dead:false,gone:false,smokeT:0,prop:rnd(0,6),hitT:0,gmode:'approach',bombs:baron?3:1,bombT:0,
    col:baron?'#c0141a':WING_COLS[(idx||0)%WING_COLS.length]};
  if(PT){e.y=rnd(400,900);}
  e.a=side>0?Math.PI:0; e.spd=e.base; e.s=Math.cos(e.a)>=0?1:-1; e.rollV=e.s;
  return e;
}
function mkBalloon(x){return {x:x,y:GROUND-520,hp:5,dead:false,fall:0,gone:false,ph:rnd(0,6)};}
function mkTank(fac){
  var t={id:'u'+(++unitSeq),isTank:true,y:GROUND,vx:0,shSeq:0,fac:fac||EF,x:0,dir:Math.random()<0.5?-1:1,spd:rnd(14,24),hp:30,max:30,dead:false,burnT:0,fireT:rnd(2,4),tr:-1.5,burst:0,reload:rnd(2.5,4),stand:rnd(330,560),trk:0};
  if(PT){var sd=PF==='G'?1:-1; t.x=wrapX(PT.x+sd*rnd(850,1600)); t.dir=-sd;}
  else t.x=rnd(3700,6700);

}
function mkRing(){

  return {x:wrapX(P.x+side*rnd(700,1500)),y:clamp(P.y+rnd(-350,350),GROUND-1400,GROUND-380),r:42,t:32,ph:0};
}
function velOf(o){
  if(!o) return [0,0];
  if(o.isTank) return [o.vx!==undefined?o.vx:o.spd,0];
  return [Math.cos(o.a)*o.spd, Math.sin(o.a)*o.spd+(o.sink||0)];
}
var allyT=0, myDL=[], dlSeq=0;
// alleato guidato dal computer, accanto al giocatore
function spawnAlly(k){
  var d=PF==='G'?1:-1, me=LP[0]&&LP[0].ent;
  if(LP[0].veh==='aereo'){
    var e=newAI(PF,false,k); e.ally=true; e.idx=k; e.base=Math.max(e.base,190); e.turn=Math.max(e.turn,1.7);
    if(me&&!me.dead){ e.x=wrapX(me.x-d*(170+120*k)); e.y=clamp(me.y-60-60*k,300,GROUND-500); e.a=me.a; e.s=me.s; e.rollV=me.s; e.spd=Math.max(150,me.spd); }
    else { e.x=wrapX(BASE[PF]+d*(300+150*k)); e.y=GROUND-700-80*k; e.a=d>0?0:Math.PI; e.s=d; e.rollV=d; }
    planes.push(e);
  } else {
    var t=mkTank(PF); t.ally=true; t.idx=k; t.spd=50; t.hp=t.max=40; t.dir=d;
    t.x=wrapX((me&&!me.dead?me.x:DEPOT[PF])-d*(140+110*k));

function newGame(){
  planes=[]; tanks=[]; bullets=[]; shells=[]; bombs=[]; parts=[]; msgs=[]; rings=[]; balloons=[];
  wave=0; waveT=2.5; overT=0; gameT=0; shake=0; paused=false; ringT=10; keys={};
  LP=[]; P=null; PT=null;
  if(MODE==='local2'){
    PF='G'; EF='A';
    LP.push(mkPL(0,'G',V1,MAP_P1,'Barone')); LP.push(mkPL(1,'A',V2,MAP_P2,'Alleato'));
    msg('Duello! Barone (tasti a sinistra) contro Alleato (frecce)',4);
  } else {

      balloons=[mkBalloon(4700),mkBalloon(6300)];

      else msg(VEH==='aereo'?'Squadron 209 in volo. Il Barone Rosso ti sta cercando...':'Il tuo carro avanza. Attento al Barone Rosso dal cielo!',4);
    } else { msg(OM==='pvp'?(PTEAM?'Solo giocatori: squadra '+PTEAM+'. Abbatti chi non è della tua squadra!':'Tutti contro tutti: abbatti chiunque!'):OM==='coop'?'Insieme: con i tuoi alleati, sconfiggete le squadre nemiche!':'Sfida: la tua squadra contro quella avversaria!',4); }
  }
  ME=LP[0].ent; if(LP[0].veh==='aereo') P=ME; else PT=ME;
  teamKills=0; myDL=[]; allyT=0; if(MODE==='online'&&OM!=='pvp') for(var k=0;k<NALLY;k++) spawnAlly(k);
  loadBest(); state='play'; setupTouch();
}

// ---------- particelle ----------
function part(x,y,vx,vy,life,k,r){ if(parts.length>380&&k==='smoke') return; parts.push({x:x,y:y,vx:vx,vy:vy,t:life,m:life,k:k,r:r||4}); }
function explosion(x,y,big){
  var n=big?26:12, k;
  for(k=0;k<n;k++){var a=rnd(0,6.283),v=rnd(30,big?220:120); part(x,y,Math.cos(a)*v,Math.sin(a)*v,rnd(0.4,1),'fire',rnd(3,big?9:5));}
  for(k=0;k<(big?14:6);k++){var b=rnd(0,6.283),w=rnd(60,240); part(x,y,Math.cos(b)*w,Math.sin(b)*w-80,rnd(1,2.2),'debris',rnd(1.5,3));}
  for(k=0;k<(big?10:4);k++) part(x+rnd(-15,15),y+rnd(-15,15),rnd(-20,20),rnd(-40,-10),rnd(1.5,3),'dark',rnd(8,16));
  var d=nearestLP(x,y), v2=d<1500?1:0.4;
  sfx('boom',(big?1:0.6)*v2); shake=Math.max(shake,(big?9:4)*v2);
}

// ---------- armi ----------
// own: indice del giocatore locale (0/1), -1 = computer, 'r' = giocatore remoto (solo grafica)
function fire(o,own,jit){
  o.gun=1-(o.gun||0);
  var isP=(typeof own==='number'&&own>=0);
  var ca=Math.cos(o.a), sa=Math.sin(o.a), off=(o.gun?2.5:-2.5)*o.s, j=jit!==undefined?rnd(-jit,jit):(isP?rnd(-0.012,0.012):rnd(-0.04,0.04));
  var a=o.a+j, v=640;
  bullets.push({x:wrapX(o.x+ca*22-sa*(off-6*o.s)),y:o.y+sa*22+ca*(off-6*o.s),
    vx:Math.cos(a)*v+ca*o.spd, vy:Math.sin(a)*v+sa*o.spd+(o.sink||0), t:1.1, fac:o.fac, tm:TM(o), own:own});
  var d=nearestLP(o.x,o.y); if(d<900) sfx('gun',(isP?1:0.45)*(1-d/900*(isP?0:1)));
}
function fireShell(x,y,a,fac,own,tm){
  shells.push({x:x,y:y,vx:Math.cos(a)*SHELL_V,vy:Math.sin(a)*SHELL_V,fac:fac,tm:tm||fac,t:6,own:own});
  for(var k=0;k<5;k++) part(x+Math.cos(a)*6,y+Math.sin(a)*6,Math.cos(a)*60+rnd(-20,20),Math.sin(a)*60+rnd(-20,20),rnd(0.4,0.9),'smoke',rnd(4,7));
  if(nearestLP(x,y)<1200) sfx('cannon',1);
}
function ballistic(dx,dy){
  var v=SHELL_V,g=SHELL_G,ax=Math.abs(dx),h=-dy;
  var disc=v*v*v*v-g*(g*ax*ax+2*h*v*v);
  var el=disc<0?Math.PI/4:Math.atan((v*v-Math.sqrt(disc))/(g*Math.max(ax,1)));
  return dx>=0?-el:Math.PI+el;
}

// ---------- danni ai giocatori ----------
function crashPL(pl){
  var e=pl.ent; if(e.dead&&e.crashed) return;
  if(!e.dead) onPLDeath(pl);
  e.dead=true; e.crashed=true; e.hp=0; if(!e.isTank) e.y=Math.min(e.y,GROUND-6);
  explosion(e.x,e.isTank?GROUND-20:e.y,true); plMsg(pl,e.isTank?'carro distrutto!':'schianto!',3);
}
function killPL(pl){ var e=pl.ent; if(e.dead) return; if(e.isTank){crashPL(pl);return;} onPLDeath(pl); e.dead=true; e.hp=0; plMsg(pl,'abbattuto!',3); }
function onPLDeath(pl){
  pl.deaths++; pl.deathT=0; pl.killedBy='';
  var by=pl.lastBy;
  if(typeof by==='number'&&LP[by]&&by!==pl.i){ LP[by].kills++; msg(plName(LP[by])+' ha abbattuto '+plName(pl)+'!',3.5); }
  else if(typeof by==='string'&&by.indexOf('peer:')===0){ pl.killedBy=by.slice(5); var rr=remotes[pl.killedBy]; msg('Abbattuto da '+(rr?rr.name:'un avversario')+'!',3.5); }
}
function hurtPL(pl,d,own){
  var e=pl.ent; if(!e||e.dead) return;
  if(own!==undefined&&own!==-1) pl.lastBy=own;
  e.hp-=d; e.hitT=0.08; pl.flash=Math.max(pl.flash,0.25); shake=Math.max(shake,MODE==='local2'?1.5:2.5);
  if(e.hp<=0){ if(e.isTank||e.landed) crashPL(pl); else killPL(pl); }
}

// ---------- giocatore: aereo ----------
function I(pl,a){ return !!keys[pl.map[a]]; }
function updPlane(pl,dt){
  var p=pl.ent;
  p.prop+=dt*(20+p.thr*40); p.hitT-=dt; p.firing=false;
  if(p.dead){
    pl.deathT+=dt;
    if(p.crashed){ if(Math.random()<dt*8) part(p.x+rnd(-10,10),GROUND-10,rnd(-8,8),rnd(-50,-25),rnd(2,3.5),'dark',rnd(8,14)); return; }
    p.a+=clamp(angDiff(Math.PI/2,p.a),-1.4*dt,1.4*dt);
    p.spd=Math.min(280,p.spd+80*dt);
    p.x=wrapX(p.x+Math.cos(p.a)*p.spd*dt); p.y+=Math.sin(p.a)*p.spd*dt;
    p.smokeT-=dt; if(p.smokeT<=0){p.smokeT=0.03; part(p.x,p.y,rnd(-10,10),rnd(-30,-10),rnd(1.2,2),'dark',rnd(5,9)); part(p.x,p.y,rnd(-20,20),rnd(-20,20),0.4,'fire',rnd(3,5));}

    else p.a=lvl;

      p.hp=Math.min(100,p.hp+22*dt); p.ammo=Math.min(600,p.ammo+160*dt); p.fuel=Math.min(100,p.fuel+30*dt); p.heat=0; p.jam=0;

    }

    if(!I(pl,'roll')) p.rk=false;
    return;
  }
  if(I(pl,'fire')&&p.jam<=0&&p.ammo>0){
    p.firing=true;
    if(p.fireT<=0){
      fire(p,pl.i); p.fireT=0.075; p.ammo--; p.heat+=4.2;

    }
  }

    p.bombs--; p.bombT=0.45;

  } else p.sink-=p.sink*2.5*dt;
  p.x=wrapX(p.x+Math.cos(p.a)*p.spd*dt);

  if(p.y>=GROUND-WHEEL){
    var onAir=Math.abs(wrapD(p.x-home))<340, up=-p.s*Math.cos(p.a), vs=sn*p.spd+p.sink;
    if(onAir&&up<-0.93&&vs<75&&p.spd<170){
      p.landed=true; p.y=GROUND-WHEEL; p.a=p.s>0?0:Math.PI; p.sink=0; p.thr=0;
      plMsg(pl,'atterraggio riuscito: riparazione in corso',3);
    } else crashPL(pl);
  }
}

// ---------- IA aerei (solo giocatore singolo) ----------
function aiPatrol(e){ return (Math.cos(e.a)>=0?0:Math.PI)+(e.y>GROUND-1100?-0.25*(Math.cos(e.a)>=0?1:-1):0); }
function updAI(e,dt){

  if(e.dead){
    e.a+=clamp(angDiff(Math.PI/2,e.a),-1.5*dt,1.5*dt);
    e.spd=Math.min(300,e.spd+90*dt);
    e.x=wrapX(e.x+Math.cos(e.a)*e.spd*dt); e.y+=Math.sin(e.a)*e.spd*dt;
    e.smokeT-=dt; if(e.smokeT<=0){e.smokeT=0.035; part(e.x,e.y,rnd(-10,10),rnd(-30,-10),rnd(1.2,2.2),'dark',rnd(5,9)); if(Math.random()<0.6) part(e.x,e.y,rnd(-20,20),rnd(-20,20),0.4,'fire',rnd(3,5));}
    if(e.y>=GROUND-6){explosion(e.x,GROUND-8,true); e.gone=true;}
    return;
  }
  e.tgtT=(e.tgtT||0)-dt;
  if(e.tgtT<=0||!e.tgt||e.tgt.dead||e.tgt.landed){ e.tgt=pickTarget(e); e.tgtT=1; }
  var T=e.tgt, tv=velOf(T);
  var dx=T?wrapD(T.x-e.x):0, dy=T?T.y-e.y:0, dist=Math.sqrt(dx*dx+dy*dy);
  var active=!!T&&!T.dead&&!(T.landed)&&state==='play';
  var want, aim=0, canFire=false;
  if(!active){
    var L0=LP[0]&&LP[0].ent;
    if(e.ally&&L0&&!L0.dead&&!L0.isTank){ // in formazione dietro al capo
      var fd=Math.cos(L0.a)>=0?1:-1, fx=wrapX(L0.x-fd*(170+120*(e.idx||0))), fy=L0.y-60-60*(e.idx||0);
      var fdx=wrapD(fx-e.x), fdy=fy-e.y;
      want=(fdx*fdx+fdy*fdy<150*150)?L0.a:Math.atan2(fdy,fdx);
    } else want=aiPatrol(e);
  }
  else if(T.isTank){
    var gy=GROUND-12, alt=GROUND-e.y, dir=Math.cos(e.a)>=0?1:-1, ahead=dx*dir>0;
    if(e.gmode==='approach'){
      want=Math.atan2(clamp((GROUND-(e.baron?620:700))-e.y,-260,260),dx);
      if(Math.abs(dx)<(e.baron?620:520)&&ahead&&alt>380){e.gmode='dive';}
    }
    if(e.gmode==='dive'){
      var tt=Math.sqrt(dx*dx+(gy-e.y)*(gy-e.y))/640, px=dx+tv[0]*tt;
      aim=Math.atan2(gy-e.y,px); want=aim;
      canFire=Math.abs(angDiff(aim,e.a))<(e.baron?0.07:0.12)&&dist<620;
      if(e.bombs>0&&e.bombT<=0){
        var vx=Math.cos(e.a)*e.spd*0.9, vy=Math.sin(e.a)*e.spd*0.9, hgt=gy-e.y;
        var tf=(-vy+Math.sqrt(Math.max(0,vy*vy+2*300*hgt)))/300, land=vx*tf*0.93;
        if(Math.abs(land-(dx+tv[0]*tf))<(e.baron?45:70)||(alt<(e.baron?300:340)&&ahead&&Math.abs(dx)<alt*1.2)){e.bombs--; e.bombT=1.5; bombs.push({x:e.x,y:e.y+8,vx:vx,vy:vy,fac:e.fac,own:-1});}
      }
      if(alt<(e.baron?150:190)||(!ahead&&Math.abs(dx)>40)){e.gmode='pull'; e.modeT=rnd(1.8,2.6);}
    }
    if(e.gmode==='pull'){
      want=dir>0?-0.75:Math.PI+0.75; e.modeT-=dt;
      if(e.modeT<=0&&Math.abs(dx)>650) e.gmode='approach';
      if(e.modeT<=-5) e.gmode='approach';
    }
  } else {
    var lv=640, tt2=dist/lv, tx=dx+tv[0]*tt2, ty=dy+tv[1]*tt2;
    if(e.baron){ tt2=Math.sqrt(tx*tx+ty*ty)/lv; tx=dx+tv[0]*tt2; ty=dy+tv[1]*tt2; }
    aim=Math.atan2(ty,tx); want=aim;
    e.modeT-=dt;
    if(e.mode==='attack'&&dist<(e.baron?90:110)){e.mode='extend'; e.modeT=e.baron?rnd(0.8,1.4):rnd(1.2,2.2);}
    if(e.mode==='extend'&&e.modeT<=0) e.mode='attack';
    var fromP=Math.atan2(-dy,-dx), threat=dist<(e.baron?480:380)&&Math.abs(angDiff(fromP,T.a))<(e.baron?0.32:0.25);
    if(e.ev<=0&&threat&&Math.random()<dt*(e.baron?4.5:1.5)){

      if(e.baron) e.evDir=(e.spd>165)?(Math.cos(e.a)>=0?-1:1):(Math.cos(e.a)>=0?1:-1);
    }

    if(e.ev>0) want=e.a+e.evDir*1.6;
    else if(e.mode==='extend') want=(Math.cos(e.a)>=0?-0.15:Math.PI+0.15);
    else if(e.baron){
      if(e.spd<125) want=(Math.cos(e.a)>=0?0.55:Math.PI-0.55);
      else if(dist>750) want=Math.atan2(dy-260,dx);
      if(dist<170&&Math.abs(angDiff(T.a,e.a+Math.PI))<0.5) want=e.a+(e.y>T.y?-1.2:1.2);
    }

  }
  if(e.y>GROUND-(T&&T.isTank&&e.gmode==='dive'?110:380)) want=(Math.cos(e.a)>=0?-0.7:Math.PI+0.7);
  if(e.y<200) want=(Math.cos(e.a)>=0?0.3:Math.PI-0.3);
  e.a=angN(e.a+clamp(angDiff(want,e.a),-e.turn*dt,e.turn*dt));
  e.spd+=(e.base-e.spd)*0.8*dt+70*Math.sin(e.a)*dt; e.spd=clamp(e.spd,110,e.baron?275:260);
  e.x=wrapX(e.x+Math.cos(e.a)*e.spd*dt); e.y+=Math.sin(e.a)*e.spd*dt;
  var ts=Math.cos(e.a)>=0?1:-1; if(Math.abs(Math.cos(e.a))>0.25) e.s=ts;
  e.rollV+=clamp(e.s-e.rollV,-4*dt,4*dt);

  if(e.y>=GROUND-6){explosion(e.x,GROUND-8,true); e.dead=true; e.gone=true; if(e.baron) msg('Il Barone si è schiantato!',3);}
  e.fireT-=dt;
  if(active&&canFire&&e.fireT<=0){
    fire(e,-1,e.baron?0.015:0.04); e.burst++; e.fireVis=0.2;
    var bl=e.baron?10:8;
    if(e.burst>=bl){e.burst=0; e.fireT=e.baron?rnd(0.5,1.0):rnd(1.1,2.2);} else e.fireT=e.baron?0.085:0.1;
  }
}

// ---------- IA carri (solo giocatore singolo) ----------
function hostiles(fac){ // tutte le entità nemiche vive (giocatori, computer, remoti)
  var L=[],k,o;
  for(k=0;k<LP.length;k++){o=LP[k].ent; if(o&&o.fac!==fac&&!o.dead) L.push(o);}
  for(k=0;k<planes.length;k++){o=planes[k]; if(o.fac!==fac&&!o.dead) L.push(o);}
  for(k=0;k<tanks.length;k++){o=tanks[k]; if(o.fac!==fac&&!o.dead) L.push(o);}
  for(var id in remotes){ var r=remotes[id]; if(r.ent.fac!==fac&&!r.ent.dead) L.push(r.ent);
    for(var u in r.units){ o=r.units[u].ent; if(o.fac!==fac&&!o.dead) L.push(o); } }
  return L;
}
function pickTarget(e){
  var L=hostiles(e.fac), best=null, bd=1e9;
  for(var k=0;k<L.length;k++){ var o=L[k]; if(o.landed) continue;
    var d=Math.abs(wrapD(o.x-e.x))+Math.abs((o.isTank?GROUND:o.y)-e.y)*0.7;
    if(o.pl||o.human) d*=0.85; if(o.isTank) d*=1.3;
    if(d<bd){bd=d; best=o;} }
  return bd<6000?best:null;
}
function updTanks(dt){
  var k;
  for(k=0;k<tanks.length;k++){
    var t=tanks[k];
    if(t.dead){ t.burnT+=dt; if(t.burnT<25&&Math.random()<dt*6) part(t.x+rnd(-8,8),GROUND-22,rnd(-6,6),rnd(-40,-20),rnd(2,3.5),'dark',rnd(7,12)); if(t.burnT>30&&MODE==='online') t.gone=true; continue; }
    t.tgtT=(t.tgtT||0)-dt; t.firing=false;
    if(t.tgtT<=0){ t.tgtT=1; var L=hostiles(t.fac), bt=null, bd=1e9, bp=null, bpd=1e9;
      for(var q=0;q<L.length;q++){ var o=L[q], d=Math.abs(wrapD(o.x-t.x));
        if(o.isTank){ if(d<bd){bd=d; bt=o;} } else if(!o.landed){ var dd=Math.sqrt(d*d+Math.pow(o.y-(GROUND-26),2)); if(dd<bpd){bpd=dd; bp=o;} } }
      t.tt=bd<2200?bt:null; t.tp=bpd<1200?bp:null; }
    var active=state==='play', mv=0, my=GROUND-30;
    if(t.tt&&!t.tt.dead){
      var dxp=wrapD(t.tt.x-t.x); t.dir=dxp>=0?1:-1;
      if(Math.abs(dxp)>t.stand) mv=t.dir; else if(Math.abs(dxp)<t.stand-150) mv=-t.dir*0.5;
      t.tr=ballistic(dxp,(GROUND-20)-my); t.reload-=dt;
      if(active&&Math.abs(dxp)<1150&&t.reload<=0){
        t.reload=rnd(2.6,4.2);
        var lead=velOf(t.tt)[0]*Math.abs(dxp)/SHELL_V*rnd(0.2,0.9);
        var a=ballistic(dxp+lead,(GROUND-20)-my)+rnd(-0.035,0.035);
        fireShell(wrapX(t.x+Math.cos(a)*24),my+Math.sin(a)*24,a,t.fac,-1); t.shSeq=(t.shSeq||0)+1;
      }
    } else {

      else { if(t.x<3600) t.dir=1; if(t.x>6800) t.dir=-1; mv=t.dir; }

        var tv=velOf(T), tt=dd3/430, a2=Math.atan2(dy+tv[1]*tt,dx+tv[0]*tt)+rnd(-0.06,0.06);
        bullets.push({x:t.x,y:GROUND-26,vx:Math.cos(a2)*430,vy:Math.sin(a2)*430,t:1.9,fac:t.fac,own:-1});
        if(nearestLP(t.x)<900) sfx('gun',0.3);
      }

  }
  for(k=tanks.length-1;k>=0;k--) if(tanks[k].gone) tanks.splice(k,1);

// visita tutti i possibili bersagli vivi; fn ritorna true per fermarsi
function eachTarget(fn){
  var k,e;
  for(k=0;k<planes.length;k++){e=planes[k]; if(!e.dead&&fn({kind:'plane',who:'ai',o:e,x:e.x,y:e.y,fac:e.fac,tm:e.fac}))return;}
  for(k=0;k<tanks.length;k++){e=tanks[k]; if(!e.dead&&fn({kind:'tank',who:'ai',o:e,x:e.x,y:GROUND-18,fac:e.fac,tm:e.fac}))return;}
  for(k=0;k<balloons.length;k++){e=balloons[k]; if(!e.dead&&fn({kind:'balloon',who:'ai',o:e,x:e.x,y:e.y+Math.sin(e.ph)*6,fac:EF,tm:EF}))return;}
  for(k=0;k<LP.length;k++){e=LP[k].ent; if(e&&!e.dead&&fn({kind:e.isTank?'tank':'plane',who:'lp',o:LP[k],x:e.x,y:e.isTank?GROUND-18:e.y,fac:e.fac,tm:TM(e),landed:!!e.landed}))return;}
  for(var id in remotes){var r=remotes[id]; if(r.ent&&!r.ent.dead&&fn({kind:r.ent.isTank?'tank':'plane',who:'rem',o:r,x:r.ent.x,y:r.ent.isTank?GROUND-18:r.ent.y,fac:r.ent.fac,tm:TM(r.ent),landed:!!r.landed}))return;
    for(var u in r.units){var un=r.units[u], ue=un.ent; if(!ue.dead&&fn({kind:ue.isTank?'tank':'plane',who:'ru',o:un,x:ue.x,y:ue.isTank?GROUND-18:ue.y,fac:ue.fac,tm:ue.fac}))return;}}
}
function canDamage(T,tm,own){
  if(T.tm===tm||own==='r') return false;
  if(T.who==='rem'||T.who==='ru') return typeof own==='number';      // solo i colpi simulati qui valgono sui remoti
  if(T.who==='lp'&&own===T.o.i) return false;
  return true;
}
function applyDamage(T,d,own,fac){
  curFac=fac||null;
  if(T.who==='ai'){ if(T.kind==='plane') aiDamage(T.o,d,own); else if(T.kind==='tank') tankDamage(T.o,d,own); else balloonDamage(T.o,d,own); }
  else if(T.who==='lp') hurtPL(T.o,d,own);
  else if(T.who==='rem') addHit(T.o.peer,'p',d);
  else if(T.who==='ru') addHit(T.o.peer,T.o.id,d);
  curFac=null;
}
function hitTest(T,x,y,mx,my,kind){
  if(T.kind==='plane'){ if(T.landed&&kind==='bullet') return false; var r=kind==='shell'?(T.who==='ai'?24:18):(T.who==='ai'?18:15); return near(x,y,T.x,T.y,r)||(mx!==undefined&&near(mx,my,T.x,T.y,r)); }
  if(T.kind==='tank') return Math.abs(wrapD(x-T.x))<(kind==='shell'?30:26)&&y>GROUND-(kind==='shell'?40:36)&&y<GROUND;
  return Math.abs(wrapD(x-T.x))<(kind==='shell'?28:26)&&Math.abs(y-T.y)<(kind==='shell'?18:12);
}
function bulletDmg(T){ var pl=T.who==='lp'||T.who==='rem'; return T.kind==='plane'?(pl?4:1):T.kind==='tank'?(pl?1.6:1.2):1; }
function blast(x,fac,own,r,dmgAI,dmgPL,tm){
  if(own==='r') return; tm=tm||fac;
  eachTarget(function(T){
    if(!canDamage(T,tm,own)) return false;
    var onGround=T.kind==='tank'||(T.kind==='plane'&&T.landed); if(!onGround) return false;
    var d=Math.abs(wrapD(T.x-x)); if(d>=r) return false;
    applyDamage(T,((T.who==='ai'||T.who==='ru')?dmgAI:dmgPL)*(1-d/r*0.5),own,fac); return false;
  });
}
function updBombs(dt){
  for(var k=bombs.length-1;k>=0;k--){
    var b=bombs[k]; b.vy+=300*dt; b.vx*=(1-0.15*dt);
    b.x=wrapX(b.x+b.vx*dt); b.y+=b.vy*dt;
    if(b.y>=GROUND-4){
      explosion(b.x,GROUND-6,true);
      for(var q=0;q<10;q++) part(b.x+rnd(-20,20),GROUND-4,rnd(-60,60),rnd(-160,-60),rnd(0.6,1.2),'dust',rnd(4,8));
      blast(b.x,b.fac,b.own,65,40,42,TM(b));
      bombs.splice(k,1);
    }
  }
}
function updShells(dt){
  for(var k=shells.length-1;k>=0;k--){
    var s=shells[k], hitT=null;
    s.vy+=SHELL_G*dt; s.x=wrapX(s.x+s.vx*dt); s.y+=s.vy*dt; s.t-=dt;
    if(Math.random()<dt*20) part(s.x,s.y,0,0,0.5,'smoke',2);
    if(s.own!=='r') eachTarget(function(T){ if(canDamage(T,TM(s),s.own)&&hitTest(T,s.x,s.y,undefined,undefined,'shell')){hitT=T; return true;} return false; });
    if(hitT||s.y>=GROUND-2){
      explosion(s.x,Math.min(s.y,GROUND-6),false);
      if(hitT&&hitT.kind!=='tank') applyDamage(hitT,hitT.kind==='plane'?((hitT.who==='ai'||hitT.who==='ru')?(hitT.o.baron?5:4):25):5,s.own,s.fac);
      if(s.y>=GROUND-45){ for(var q=0;q<6;q++) part(s.x+rnd(-10,10),GROUND-4,rnd(-50,50),rnd(-130,-50),rnd(0.5,1),'dust',rnd(3,6));
        blast(s.x,s.fac,s.own,48,14,16,TM(s)); }
      shells.splice(k,1); continue;
    }
    if(s.t<=0) shells.splice(k,1);
  }
}
function updBullets(dt){
  for(var b=bullets.length-1;b>=0;b--){
    var u=bullets[b], ox=u.x, oy=u.y, hitT=null;
    u.x=wrapX(u.x+u.vx*dt); u.y+=u.vy*dt; u.t-=dt;
    var mx=wrapX(ox+wrapD(u.x-ox)/2), my=(oy+u.y)/2;
    if(u.own!=='r') eachTarget(function(T){ if(canDamage(T,TM(u),u.own)&&hitTest(T,u.x,u.y,mx,my,'bullet')){hitT=T; return true;} return false; });
    if(hitT){ part(u.x,u.y,rnd(-40,40),rnd(-40,40),0.25,'spark',2); if(nearestLP(u.x,u.y)<700) sfx('hit',0.6); applyDamage(hitT,bulletDmg(hitT),u.own,u.fac); }
    if(hitT||u.t<=0||u.y>GROUND){ if(!hitT&&u.y>GROUND) part(u.x,GROUND-2,rnd(-10,10),rnd(-40,-10),0.5,'dust',3); bullets.splice(b,1); }
  }
}

function coopHumans(){ var n=1; for(var id in remotes) if(remotes[id].om==='coop'&&LP[0]&&remotes[id].fac===LP[0].fac) n++; return n; }
function spawnWave(){
  wave++; var k, n, nt, txt;
  var mult=MODE==='online'?(1+0.6*(coopHumans()-1)+0.35*NALLY):1;
  if(PF==='G'){
    n=VEH==='aereo'?Math.min(7,1+Math.ceil(wave*0.8)):Math.min(4,Math.ceil(wave/2));
    n=Math.min(10,Math.round(n*mult));
    for(k=0;k<n;k++) planes.push(newAI('A',false,k));
    txt=n+(n===1?' caccia alleato':' caccia alleati');
  } else {
    planes.push(newAI('G',true,0));
    n=VEH==='aereo'?Math.min(3,wave-1):Math.min(2,Math.floor((wave-1)/2));
    if(MODE==='online') n=Math.min(8,Math.round((n+1)*mult)-1);
    for(k=0;k<n;k++) planes.push(newAI('G',false,k));
    txt='il Barone Rosso'+(n?' e '+n+(n===1?' gregario':' gregari'):'');
  }
  for(k=0;k<balloons.length;k++) if(balloons[k].gone) balloons[k]=mkBalloon(balloons[k].x);
  for(k=tanks.length-1;k>=0;k--) if(tanks[k].dead&&!tanks[k].ally) tanks.splice(k,1);
  nt=VEH==='carro'?Math.min(6,wave+(PF==='G'?1:0)):Math.min(6,1+wave);
  nt=Math.min(9,Math.round(nt*mult));
  var ne=0; for(k=0;k<tanks.length;k++) if(tanks[k].fac===EF) ne++;
  while(ne<nt){ tanks.push(mkTank(EF)); ne++; }
  msg('Ondata '+wave+': '+txt+' e '+ne+(ne===1?' carro armato':' carri armati'),3.5);
}

var room=null, myPeer=null, netState='off', netErr='', netRetry=0, remotes={}, presT=0, myHits=[], hitSeq=0, presOK=0, seenPeers=0;
function initRoom(){
  if(room||netState==='connecting') return;
  netState='connecting'; netRetry=4;
  try{
    if(!window.claude||typeof window.claude.use!=='function'){netState='none'; netErr='pagina aperta fuori da Claude'; return;}
    window.claude.use('room').then(function(r){
      if(!r){netState='none'; netErr='online non disponibile in questo browser'; return;}
      room=r; netErr='';
      room.onConnection(function(c){netState=c?'on':'connecting';},function(e){room=null;netState='none';netErr=(e&&e.code)||'errore';});
      room.onPeers(function(ch){seenPeers=ch.peers.length; for(var k=0;k<ch.peers.length;k++)if(ch.peers[k].sameTab)myPeer=ch.peers[k].peer;},function(e){netErr=(e&&e.code)||'errore';});
    },function(e){netState='none';netErr=(e&&e.code)||'errore';});
  }catch(e){netState='none';netErr='eccezione';}
}
function r1(v){return Math.round(v*10)/10;} function r3(v){return Math.round(v*1000)/1000;}
function unitsList(){
  var L=[],k,e;
  for(k=0;k<planes.length&&L.length<16;k++){ e=planes[k]; if(e.gone) continue;
    L.push([e.id,0,e.fac==='G'?0:1,r1(e.x),r1(e.y),r3(e.a),e.s,r3(e.rollV),r1(e.spd),Math.max(0,Math.round(e.hp/e.max*100)),e.dead?1:0,(e.fireVis>0)?1:0,e.baron?1:0,e.ally?1:0]); }
  for(k=0;k<tanks.length&&L.length<16;k++){ e=tanks[k]; if(e.gone) continue;
    L.push([e.id,1,e.fac==='G'?0:1,r1(e.x),e.dir,r3(e.tr),r1(e.vx||0),Math.max(0,Math.round(e.hp/e.max*100)),e.dead?2:0,e.shSeq||0,e.firing?1:0,e.ally?1:0]); }
  return L;
}
function sendPresence(dt){
  if(!room) return; presT-=dt; if(presT>0) return; presT=0.05;
  var pr;
  if(MODE!=='online'||state!=='play'||!LP[0]){ pr={n:MYNAME,v:null}; }
  else {
    var pl=LP[0], e=pl.ent;
    pr={n:MYNAME,s:pl.fac,tm:pl.tm,v:pl.veh,om:OM,hp:Math.max(0,Math.round(e.hp)),d:e.dead?1:0,cr:e.crashed?1:0,k:pl.kills,dn:pl.deaths,kb:pl.killedBy||'',f:e.firing?1:0,
        h:myHits.slice(),l:e.landed?1:0,ts:teamKills,u:unitsList(),dl:myDL.slice(),wv:(OM==='coop'&&isHost())?wave:0};
    pr.e=e.isTank?[r1(e.x),e.dir,r1(e.spd),r3(e.elev)]:[r1(e.x),r1(e.y),r3(e.a),e.s,r3(e.rollV),r1(e.spd),r1(e.sink),r3(e.thr)];
    if(pl.lastShell) pr.sh=[pl.shSeq,r1(pl.lastShell[0]),r1(pl.lastShell[1]),r3(pl.lastShell[2])];
    if(pl.lastBomb) pr.bo=[pl.boSeq,r1(pl.lastBomb.x),r1(pl.lastBomb.y),r1(pl.lastBomb.vx),r1(pl.lastBomb.vy)];

  try{ room.presence(pr).then(function(){presOK++;},function(e){netErr='invio: '+((e&&(e.code+' '+(e.message||'')))||'errore');}); }catch(e){netErr='invio: eccezione';}

// in modalità "insieme" un solo dispositivo (l'host) guida i nemici: quello con l'identificativo più basso
function isHost(){
  if(!myPeer) return true;
  for(var id in remotes){ var r=remotes[id]; if(r.om==='coop'&&LP[0]&&r.fac===LP[0].fac&&id<myPeer) return false; }
  return true;
}
function hostWave(){ var w=0; for(var id in remotes){ var r=remotes[id]; if(r.om==='coop'&&r.wv>w) w=r.wv; } return w; }
function addHit(peer,unit,d){ myHits.push([++hitSeq,peer,unit,Math.round(d*10)/10]); if(myHits.length>14) myHits.shift(); }
function cleanName(s){ s=(typeof s==='string')?s:''; s=s.replace(/[\u0000-\u001f]/g,'').slice(0,14); return s||'Pilota'; }
function interpPlane(e,tg,since,kk,dt){
  var vx=Math.cos(tg.a)*tg.spd, vy=Math.sin(tg.a)*tg.spd+(tg.sink||0);
  var tx2=wrapX(tg.x+vx*since), ty=tg.y+vy*since;
  if(Math.abs(wrapD(tx2-e.x))>300){e.x=tx2; e.y=ty;} else {e.x=wrapX(e.x+wrapD(tx2-e.x)*kk); e.y+=(ty-e.y)*kk;}
  e.a=angN(e.a+angDiff(tg.a,e.a)*kk); e.s=tg.s; e.rollV+=(tg.rollV-e.rollV)*kk; e.spd=tg.spd; e.sink=tg.sink||0; e.thr=tg.thr===undefined?0.8:tg.thr; e.prop+=dt*(20+e.thr*40);
}
function updRemotes(dt){
  if(!room||MODE!=='online'){ remotes={}; return; }
  var ps; try{ ps=room.peers(); }catch(e){ return; }
  seenPeers=ps.length;
  var seen={}, k;
  for(k=0;k<ps.length;k++){
    var p=ps[k]; if(p.sameTab||p.kind!=='viewer') continue;
    var pr=p.presence; if(!pr||(pr.v!=='aereo'&&pr.v!=='carro')||(pr.s!=='G'&&pr.s!=='A')||!pr.e||!pr.e.length) continue;
    var ok=true; for(var q=0;q<pr.e.length;q++) if(typeof pr.e[q]!=='number'||!isFinite(pr.e[q])) ok=false; if(!ok) continue;
    seen[p.peer]=1;
    var r=remotes[p.peer];
    if(!r||r.veh!==pr.v||r.fac!==pr.s){
      var ent=pr.v==='aereo'?newPlane(pr.s):newTankEnt(pr.s); ent.human=true;
      if(!r) msg(cleanName(pr.n)+' è entrato in campo ('+(pr.s==='G'?'Barone':'Alleati')+')',3);
      var keep=r;
      r={peer:p.peer,veh:pr.v,fac:pr.s,ent:ent,pres:null,name:'',gunT:0,init:false,shSeq:null,boSeq:null,units:keep?keep.units:{},
         lastHit:keep?keep.lastHit:undefined,seenDn:keep?keep.seenDn:undefined,lastDl:keep?keep.lastDl:undefined,wasCr:false};
      remotes[p.peer]=r;

    if(r.pres!==pr){ r.pres=pr; ingestRemote(r,pr); }
  }
  for(var id in remotes){ if(!seen[id]){ msg(remotes[id].name+' ha lasciato il campo',2.5); delete remotes[id]; } }

  var kk=Math.min(1,dt*10), nowT=now();

    var rr=remotes[id2], e=rr.ent, tg=rr.tgt;
    if(tg){
      var since=Math.min((nowT-rr.tt)/1000,0.4);
      if(e.isTank){ var tx=wrapX(tg.x+tg.spd*since); e.x=wrapX(e.x+wrapD(tx-e.x)*kk); e.dir=tg.dir; e.spd=tg.spd; e.elev=tg.elev; e.trk+=e.spd*dt; }
      else interpPlane(e,tg,since,kk,dt);

        if(e.isTank){ var a=e.dir>0?-e.elev:Math.PI+e.elev; bullets.push({x:wrapX(e.x+e.dir*4+Math.cos(a)*20),y:GROUND-30+Math.sin(a)*20,vx:Math.cos(a)*640,vy:Math.sin(a)*640,t:1.3,fac:e.fac,own:'r'}); }
        else fire(e,'r',0.012); } }
      if(e.dead&&!e.crashed&&!e.isTank){ e.smokeT=(e.smokeT||0)-dt; if(e.smokeT<=0){e.smokeT=0.04; part(e.x,e.y,rnd(-10,10),rnd(-30,-10),rnd(1.2,2),'dark',rnd(5,9));} }
    }
    // unità del computer di quel giocatore
    for(var u in rr.units){
      var un=rr.units[u], ue=un.ent, ut=un.tgt; if(!ut) continue;
      var s2=Math.min((nowT-un.tt)/1000,0.4);
      if(ue.isTank){ var tx3=wrapX(ut.x+ut.vx*s2); ue.x=wrapX(ue.x+wrapD(tx3-ue.x)*kk); ue.dir=ut.dir; ue.vx=ut.vx; ue.spd=ut.vx; ue.tr=ut.tr; ue.trk+=ut.vx*dt; }
      else interpPlane(ue,ut,s2,kk,dt);
      ue.hitT-=dt;
      if(un.f&&!ue.dead){ un.gunT-=dt; if(un.gunT<=0){ un.gunT=ue.isTank?0.16:0.1;
        if(ue.isTank){ var a2=ue.tr; bullets.push({x:ue.x,y:GROUND-26,vx:Math.cos(a2)*430,vy:Math.sin(a2)*430,t:1.9,fac:ue.fac,own:'r'}); }
        else fire(ue,'r',0.04); } }
      if(ue.dead&&!ue.crashed&&!ue.isTank){ ue.smokeT=(ue.smokeT||0)-dt; if(ue.smokeT<=0){ue.smokeT=0.05; part(ue.x,ue.y,rnd(-10,10),rnd(-30,-10),rnd(1.2,2),'dark',rnd(5,9));} }
    }
  }
}
function findLocalUnit(id){ var k; for(k=0;k<planes.length;k++) if(planes[k].id===id) return planes[k]; for(k=0;k<tanks.length;k++) if(tanks[k].id===id) return tanks[k]; return null; }
function allNum(a,from,to){ for(var i=from;i<to;i++) if(typeof a[i]!=='number'||!isFinite(a[i])) return false; return true; }
function ingestRemote(r,pr){

  if(e.isTank) r.tgt={x:a[0],dir:a[1]<0?-1:1,spd:clamp(num(a[2]),-80,80),elev:clamp(num(a[3]),0,1.5)};
  else r.tgt={x:a[0],y:a[1],a:a[2],s:a[3]<0?-1:1,rollV:clamp(num(a[4]),-1,1),spd:clamp(num(a[5]),0,400),sink:clamp(num(a[6]),-400,400),thr:clamp(num(a[7]),0,1)};

}
function renderView(pl,vy,vh,cam){
  W=FW; H=vh; camX=cam.x; camY=cam.y; Z=zoomFor(vh);
  cx.save(); cx.translate(0,vy); cx.beginPath(); cx.rect(0,0,W,H); cx.clip();
  cx.save(); if(shake>0) cx.translate(rnd(-shake,shake),rnd(-shake,shake));
  drawWorld(pl);
  cx.restore();
  if(pl&&state!=='title'){
    if(MODE==='local2') hudCompact(pl); else hudFull(pl);
    if(pl.flash>0){cx.fillStyle='rgba(180,0,0,'+(pl.flash*0.6).toFixed(2)+')'; cx.fillRect(0,0,W,H);}
  }
  cx.restore();
  W=FW; H=FH;
}
function render(){
  if(state==='title'){ renderView(null,0,FH,demoCam); titleScreen(); return; }
  nmInput.style.display='none';
  if(MODE==='local2'){
    var h1=Math.floor(FH/2);
    renderView(LP[0],0,h1,LP[0].cam); renderView(LP[1],h1,FH-h1,LP[1].cam);
    cx.fillStyle='#2b1d10'; cx.fillRect(0,h1-2,FW,4);
    var txt='BARONE  '+LP[0].kills+'  —  '+LP[1].kills+'  ALLEATO';
    cx.font='bold 16px Georgia'; var tw=cx.measureText(txt).width+30;
    cx.fillStyle='rgba(236,224,196,0.95)'; cx.fillRect(FW/2-tw/2,h1-14,tw,28); cx.strokeStyle='#6a4a2a'; cx.lineWidth=2; cx.strokeRect(FW/2-tw/2,h1-14,tw,28);
    cx.textAlign='center'; cx.fillStyle='#2b1d10'; cx.fillText(txt,FW/2,h1+6);
    drawMsgs(h1+40);
  } else {
    renderView(LP[0],0,FH,LP[0].cam);
    drawMsgs((FW<600||FH<430)?275:(MODE==='online'?100:78));
  }
  if(paused) panel(['Premi P (o il tasto II) per riprendere','ESC (o ⌂) per tornare al menu'],'PAUSA','');
  if(state==='over'){
    var pl=LP[0], L=['Vittorie in volo: '+pl.kills+(pl.fac==='G'?'   (il Barone ne ottenne 80)':''),'Carri armati distrutti: '+pl.tanksK];
    if(pl.fac==='A') L.push('Barone Rosso abbattuto: '+pl.baronK+(pl.baronK===1?' volta':' volte'));
    L.push('Grado raggiunto: '+rank(pl.kills));
    L.push('Ondate affrontate: '+wave+'   ·   punteggio '+score()+'   ·   record '+best);
    L.push('');
    L.push((TOUCH?'Tocca lo schermo':'Premi INVIO o clicca')+' per tornare al menu');
    panel(L,'MISSIONE CONCLUSA','');
  }
}
function engineSound(){
  if(!AC||!eng) return;
  try{
    var e=LP[0]&&LP[0].ent, on=(state==='play'&&!paused&&e&&!e.dead&&!muted&&(e.isTank||e.fuel>0));
    if(!e){ engGain.gain.value=0; return; }
    if(e.isTank){ engGain.gain.value=on?0.05:0; eng.frequency.value=22+Math.abs(e.spd)*0.25; }
    else { engGain.gain.value=on?(e.landed&&e.thr<0.05?0.025:0.06):0; eng.frequency.value=28+e.thr*42+e.spd*0.07; }
  }catch(e2){}
}

// ---------- comandi ----------
function setupTouch(){
  if(!TOUCH) return;
  var veh=LP[0]?LP[0].veh:VEH;
  function set(id,k,html){var el=document.getElementById(id); el.setAttribute('data-k',k); el.innerHTML=html;}
  if(veh==='aereo'){
    set('tb1',38,'&#9650;<br>cabra'); set('tb2',40,'&#9660;<br>picchia'); set('tb3',87,'GAS +'); set('tb4',83,'GAS &minus;');
    set('tb5',32,'FUOCO'); set('tb6',82,'tonneau'); set('tb7',66,'BOMBA');
  } else {
    set('tb1',38,'&#9650;<br>alza'); set('tb2',40,'&#9660;<br>abbassa'); set('tb3',39,'&#9654;'); set('tb4',37,'&#9664;');
    set('tb5',32,'CANNONE'); set('tb6',82,'gira'); set('tb7',66,'MITRA');
  }
  var b3=document.getElementById('tb3').style, b4=document.getElementById('tb4').style;
  if(veh==='carro'){ b4.left='104px'; b4.bottom='22px'; b3.left='192px'; b3.bottom='22px'; }
  else { b3.left='104px'; b3.bottom='112px'; b4.left='104px'; b4.bottom='22px'; }
}
function startGame(){
  if(MODE==='online'){ MYNAME=cleanName(nmInput.value.replace(/^\s+|\s+$/g,'')); nmInput.value=MYNAME; initRoom(); }
  try{localStorage.setItem('br4_om',OM); localStorage.setItem('br4_na',''+NALLY); localStorage.setItem('br4_tm',''+PTEAM); localStorage.setItem('br2_side',SIDE); localStorage.setItem('br2_veh',VEH); localStorage.setItem('br3_mode',MODE);
      localStorage.setItem('br3_v1',V1); localStorage.setItem('br3_v2',V2); localStorage.setItem('br3_name',MYNAME);}catch(e){}
  newGame();
}
function toMenu(){ state='title'; paused=false; keys={}; ME=null; P=null; PT=null; LP=[]; planes=[]; tanks=[]; bullets=[]; shells=[]; bombs=[]; rings=[]; msgs=[]; loadBest(); }
function togglePause(){ if(state!=='play') return; paused=!paused; keys={}; }
function clickAt(x,y){
  initAudio();
  if(state==='title'){
    for(var k=0;k<uiBtns.length;k++){var b=uiBtns[k]; if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.act(); return;}}
    return;
  }
  if(state==='over'&&overT>1){ toMenu(); return; }
  if(paused) togglePause();
}
function press(k){
  initAudio();
  if(state==='title'){
    if(k===49){MODE='single';loadBest();} else if(k===50&&!TOUCH){MODE='local2';} else if(k===51){MODE='online';initRoom();}
    else if(MODE!=='local2'&&(k===37||k===39)){SIDE=SIDE==='barone'?'nemico':'barone'; loadBest();}
    else if(MODE!=='local2'&&(k===38||k===40)){VEH=VEH==='aereo'?'carro':'aereo'; loadBest();}
    else if(k===13) startGame();
    return;
  }
  if(k===27){ if(state==='play'&&!paused) togglePause(); else toMenu(); return; }
  if(k===80){togglePause(); return;}
  if(k===77){muted=!muted; return;}
  if((k===13||k===32)&&state==='over'&&overT>1){toMenu(); return;}
  keys[k]=true;
}
function release(k){keys[k]=false;}
document.onkeydown=function(e){
  e=e||window.event; var k=e.keyCode;
  if(e.target===nmInput){ if(k===13){ nmInput.blur(); startGame(); } return; }
  if(k===32||(k>=37&&k<=40)){ if(e.preventDefault) e.preventDefault(); else e.returnValue=false; }
  if(held[k]) return; held[k]=true; press(k);
};
document.onkeyup=function(e){ e=e||window.event; var k=e.keyCode; held[k]=false; release(k); };
window.onblur=function(){ keys={}; held={}; if(state==='play'&&!paused&&MODE!=='online') paused=true; };
cv.onmousedown=function(e){ e=e||window.event; clickAt(e.clientX,e.clientY); };
if(cv.addEventListener) cv.addEventListener('touchstart',function(e){ e.preventDefault(); var t=e.touches[0]||e.changedTouches[0]; clickAt(t.clientX,t.clientY); },false);

if(TOUCH&&document.querySelectorAll){
  var bs=document.querySelectorAll('#tc .b');
  for(var bi=0;bi<bs.length;bi++)(function(el){
    el.addEventListener('touchstart',function(e){
      e.preventDefault(); var k=parseInt(el.getAttribute('data-k'),10); el.className+=' on'; el._k=k;
      if(state==='title'){ return; }
      if(k===32&&state==='over'&&overT>1){toMenu(); return;}
      if(k===80&&paused){togglePause(); return;}
      press(k);
    },false);
    var up=function(e){ e.preventDefault(); el.className=el.className.replace(' on',''); if(el._k!==undefined) release(el._k); };
    el.addEventListener('touchend',up,false); el.addEventListener('touchcancel',up,false);
  })(bs[bi]);
}
function showTouch(){ if(!TOUCH) return; document.getElementById('tc').style.display=(state==='title'||MODE==='local2')?'none':'block'; }

// ---------- avvio ----------
nmInput.value=MYNAME;
if(MODE==='online') initRoom();
var last=now();
function frame(){
  raf(frame);
  var t=now(), dt=(t-last)/1000; last=t;
  if(dt>0.05) dt=0.05; if(dt<=0) dt=0.001;
  if(state==='title') idle(dt);
  else if(!paused||MODE==='online') update(paused?0:dt);
  if(MODE==='online'&&netState==='none'){ netRetry-=dt; if(netRetry<=0) initRoom(); }
  updRemotes(dt); sendPresence(dt);
  engineSound(); showTouch();
  render();
}
frame();
})();
</script>
