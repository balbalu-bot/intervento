<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<script>
/* RETE DI RISERVA + RADIO DI SQUADRA — modulo comune ai giochi online di balbalu-bot.
   1) Se il collegamento diretto tra due dispositivi non parte (tipico: telefono con i dati
      mobili), la partita passa da sola su un server pubblico (MQTT) che fa da ponte.
   2) Radio "premi e parla": la voce viaggia sullo stesso server, quindi funziona da qualsiasi rete.
   Il gioco non viene modificato: il modulo si aggancia a PeerJS e, se qualcosa va storto, si spegne. */
(function(){
  'use strict';
  if(window.__radioSquadra) return; window.__radioSquadra=1;

  var BROKERS=window.__RADIO_TEST_BROKERS||['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
  var MQTT_URL=window.__RADIO_TEST_MQTT||'https://unpkg.com/mqtt@5.16.1/dist/mqtt.min.js';
  var PFX='balbalu/rr1/', TALK_KEY='KeyN', FALLBACK_MS=7000;
  function rid(){ return Math.random().toString(36).slice(2,10); }
  function tclean(s){ return String(s||'').replace(/[^A-Za-z0-9_.-]/g,'_').slice(0,80); }
  function nowMs(){ return Date.now(); }

  // ================= 1. server ponte (MQTT) =================
  var R={clients:[],subs:{},loading:false,seen:{},seenQ:[],seq:0,id:rid()+rid()};
  function relayStart(){
    if(R.clients.length||R.loading) return;
    if(window.mqtt&&window.mqtt.connect){ connectAll(); return; }
    R.loading=true;
    var s=document.createElement('script'); s.src=MQTT_URL;
    s.onload=function(){ R.loading=false; if(window.mqtt&&window.mqtt.connect) connectAll(); };
    s.onerror=function(){ R.loading=false; };
    (document.head||document.documentElement).appendChild(s);
  }
  function connectAll(){
    BROKERS.forEach(function(u){
      var c; try{ c=window.mqtt.connect(u,{clientId:'bb'+rid()+rid(),keepalive:30,reconnectPeriod:4000,connectTimeout:10000,clean:true}); }catch(e){ return; }
      c.on('connect',function(){ Object.keys(R.subs).forEach(function(t){ try{ c.subscribe(t,{qos:0}); }catch(e){} }); render(); });
      c.on('message',function(t,p){ onRelayMsg(t,p); });
      c.on('error',function(){}); c.on('close',function(){ render(); });
      R.clients.push(c);
    });
  }
  function relayUp(){ for(var i=0;i<R.clients.length;i++) if(R.clients[i].connected) return true; return false; }
  function rsub(t,fn){ t=PFX+t; R.subs[t]=fn; relayStart(); R.clients.forEach(function(c){ if(c.connected) try{ c.subscribe(t,{qos:0}); }catch(e){} }); }
  function runsub(t){ t=PFX+t; delete R.subs[t]; R.clients.forEach(function(c){ try{ c.unsubscribe(t); }catch(e){} }); }
  function rpub(t,o){
    relayStart(); o._m=R.id+':'+(++R.seq);
    var s; try{ s=JSON.stringify(o); }catch(e){ return; }
    R.clients.forEach(function(c){ if(c.connected) try{ c.publish(PFX+t,s,{qos:0}); }catch(e){} });
  }
  var TD=(typeof TextDecoder!=='undefined')?new TextDecoder():null;
  function onRelayMsg(t,p){
    var fn=R.subs[t]; if(!fn) return;
    var o; try{ o=JSON.parse(typeof p==='string'?p:(TD?TD.decode(p):String(p))); }catch(e){ return; }
    if(!o||typeof o!=='object') return;
    var m=o._m;
    if(typeof m==='string'){ if(R.seen[m]) return; R.seen[m]=1; R.seenQ.push(m); if(R.seenQ.length>4000) delete R.seen[R.seenQ.shift()]; }
    try{ fn(o); }catch(e){ setTimeout(function(){ throw e; }); }
  }

  // piccolo gestore di eventi, compatibile con quello di PeerJS
  function Em(){ this._ev={}; }
  Em.prototype.on=function(e,f){ (this._ev[e]=this._ev[e]||[]).push(f); return this; };
  Em.prototype.addListener=Em.prototype.on;
  Em.prototype.once=function(e,f){ var me=this; function g(){ me.off(e,g); return f.apply(me,arguments); } g._f=f; return this.on(e,g); };
  Em.prototype.off=function(e,f){ var a=this._ev[e]; if(!a) return this; if(!f){ delete this._ev[e]; return this; } this._ev[e]=a.filter(function(x){ return x!==f&&x._f!==f; }); return this; };
  Em.prototype.removeListener=Em.prototype.off;
  Em.prototype.removeAllListeners=function(e){ if(e) delete this._ev[e]; else this._ev={}; return this; };
  Em.prototype.listenerCount=function(e){ return (this._ev[e]||[]).length; };
  Em.prototype.listeners=function(e){ return (this._ev[e]||[]).slice(); };
  Em.prototype.emit=function(e){
    var a=(this._ev[e]||[]).slice(), args=[].slice.call(arguments,1), me=this;
    a.forEach(function(f){ try{ f.apply(me,args); }catch(x){ setTimeout(function(){ throw x; }); } });
    return a.length>0;
  };

  var relayNote=0;
  function noteRelay(){ relayNote=nowMs(); render(); setTimeout(render,6000); }

  // --- lato di chi entra: collegamento "doppio" (diretto, altrimenti ponte) ---
  function XConn(provider,target,opts){
    Em.call(this); opts=opts||{};
    this.peer=target; this.provider=provider; this.open=false; this.type='data';
    this.label=opts.label||('dc_'+rid()); this.metadata=opts.metadata; this.serialization=opts.serialization||'binary'; this.reliable=!!opts.reliable;
    this.mode='real'; this.real=null; this.closed=false; this.noRelay=false; this.__radioProxy=true;
  }
  XConn.prototype=Object.create(Em.prototype);
  XConn.prototype.attach=function(real){
    var me=this; me.real=real;
    real.on('open',function(){ if(me.mode!=='real'||me.closed) return; clearTimeout(me.fbT); me.open=true; me.emit('open'); });
    real.on('data',function(d){ if(me.mode==='real'&&!me.closed) me.emit('data',d); });
    real.on('close',function(){ if(me.mode!=='real'||me.closed) return; if(me.open||me.noRelay) me._end(); else me.toRelay(); });
    real.on('error',function(e){ if(me.mode!=='real'||me.closed) return; if(me.open) me.emit('error',e); else if(!me.noRelay) me.toRelay(); });
    me.fbT=setTimeout(function(){ if(!me.open&&me.mode==='real'&&!me.closed&&!me.noRelay) me.toRelay(); },FALLBACK_MS);
  };
  XConn.prototype.toRelay=function(){
    var me=this; if(me.mode==='relay'||me.closed||me.noRelay) return;
    me.mode='relay'; clearTimeout(me.fbT);
    try{ if(me.real) me.real.close(); }catch(e){}
    me.gid=tclean(me.provider.id||('g'+rid())); me.cid=rid(); me.hostT='h/'+tclean(me.peer); me.inT='g/'+me.gid+'/'+me.cid;
    rsub(me.inT,function(o){ me._msg(o); });
    var tries=0;
    (function hello(){
      if(me.open||me.closed) return;
      if(++tries>24){ me.emit('error',{type:'peer-unavailable',message:'Collegamento non riuscito'}); me._end(); return; }
      rpub(me.hostT,{t:'hello',from:me.gid,cid:me.cid});
      me.helloT=setTimeout(hello,1500);
    })();
  };
  XConn.prototype._msg=function(o){
    var me=this; if(me.closed) return; me.last=nowMs();
    if(o.t==='ack'&&!me.open){
      me.open=true; clearTimeout(me.helloT); noteRelay(); me.emit('open');
      me.pingT=setInterval(function(){ if(nowMs()-me.last>16000){ me._end(); return; } rpub(me.hostT,{t:'p',from:me.gid,cid:me.cid}); },4000);
    } else if(o.t==='d'&&me.open) me.emit('data',o.d);
    else if(o.t==='bye') me._end();
  };
  XConn.prototype.send=function(d){
    if(this.closed) return;
    if(this.mode==='real'){ if(this.real) return this.real.send(d); }
    else if(this.open) rpub(this.hostT,{t:'d',from:this.gid,cid:this.cid,d:d});
  };
  XConn.prototype.close=function(){
    if(this.closed) return;
    if(this.mode==='real'){ try{ if(this.real) this.real.close(); }catch(e){} }
    else rpub(this.hostT,{t:'bye',from:this.gid,cid:this.cid});
    this._end();
  };
  XConn.prototype._end=function(){
    if(this.closed) return; this.closed=true; this.open=false;
    clearTimeout(this.fbT); clearTimeout(this.helloT); clearInterval(this.pingT);
    if(this.inT) runsub(this.inT);
    this.emit('close');
  };
  Object.defineProperty(XConn.prototype,'dataChannel',{get:function(){ return this.real&&this.mode==='real'?this.real.dataChannel:null; }});
  Object.defineProperty(XConn.prototype,'peerConnection',{get:function(){ return this.real&&this.mode==='real'?this.real.peerConnection:null; }});

  // --- lato di chi crea la stanza: accetta anche chi arriva dal ponte ---
  function HConn(host,from,cid){
    Em.call(this); this.peer=from; this.cid=cid; this.provider=host; this.open=false; this.closed=false; this.type='data';
    this.label='relay_'+cid; this.serialization='json'; this.reliable=true; this.__relayH=true; this.outT='g/'+tclean(from)+'/'+cid; this.last=nowMs();
    var me=this;
    this.pingT=setInterval(function(){ if(nowMs()-me.last>16000){ me._end(); return; } rpub(me.outT,{t:'p'}); },4000);
  }
  HConn.prototype=Object.create(Em.prototype);
  HConn.prototype.send=function(d){ if(this.open&&!this.closed) rpub(this.outT,{t:'d',d:d}); };
  HConn.prototype.close=function(){ if(this.closed) return; rpub(this.outT,{t:'bye'}); this._end(); };
  HConn.prototype._end=function(){
    if(this.closed) return; this.closed=true; this.open=false; clearInterval(this.pingT);
    var rh=this.provider.__rh; if(rh&&rh.conns[this.cid]===this) delete rh.conns[this.cid];
    this.emit('close');
  };
  function relayHost(p,superEmit){
    if(p.__rh||!p.id) return;
    var rh=p.__rh={conns:{},topic:'h/'+tclean(p.id)};
    rsub(rh.topic,function(o){
      if(p.destroyed||typeof o.cid!=='string'||typeof o.from!=='string') return;
      var c=rh.conns[o.cid];
      if(o.t==='hello'){
        if(!c){
          c=new HConn(p,o.from,o.cid); rh.conns[o.cid]=c;
          superEmit('connection',c);
          setTimeout(function(){ if(!c.closed){ c.open=true; noteRelay(); c.emit('open'); } },0);
        }
        rpub(c.outT,{t:'ack'});
      } else if(c){
        c.last=nowMs();
        if(o.t==='d'&&c.open) c.emit('data',o.d);
        else if(o.t==='bye') c._end();
      }
    });
  }
  function relayHostStop(p){
    var rh=p.__rh; if(!rh) return; p.__rh=null; runsub(rh.topic);
    for(var k in rh.conns){ try{ rh.conns[k].close(); }catch(e){} }
  }

  // ================= 2. aggancio a PeerJS =================
  var chan='', chanOwner=null;
  function noteChannel(id,owner){
    if(typeof id!=='string'||!id) return;
    if(chan===id){ chanOwner=owner||chanOwner; return; }
    leaveChannel(); chan=id; chanOwner=owner||null; joinChannel();
  }
  function wrap(P){
    if(typeof P!=='function'||P.__radioWrapped) return P;
    var W;
    try{
      W=class extends P{
        constructor(){
          super(...arguments);
          var me=this, fixed=(typeof arguments[0]==='string')?arguments[0]:null;
          me.__proxies=[];
          try{
            if(fixed) me.on('open',function(){ relayHost(me,function(ev,a){ return P.prototype.emit.call(me,ev,a); }); if(!me.__radioGuest) noteChannel(fixed,me); });
            me.on('connection',function(){ if(!me.__radioGuest&&me.id) noteChannel(me.id,me); });
          }catch(e){}
        }
        connect(id,opts){
          this.__radioGuest=true;
          try{ noteChannel(id,this); }catch(e){}
          var real=super.connect.apply(this,arguments);
          if(!real||typeof real.on!=='function') return real;
          var x=new XConn(this,id,opts); x.attach(real); this.__proxies.push(x);
          return x;
        }
        emit(ev,a){
          // chi crea la stanza vede un collegamento diretto solo quando è davvero aperto:
          // se non si apre, il gioco non lo vede e l'altro arriva dal ponte
          if(ev==='connection'&&a&&!a.__relayH&&!a.open&&typeof a.on==='function'){
            var done=false;
            a.on('open',()=>{ if(done) return; done=true; super.emit('connection',a); setTimeout(function(){ try{ a.emit('open'); }catch(e){} },0); });
            return true;
          }
          if(ev==='error'&&a&&a.type==='peer-unavailable'&&this.__proxies){
            this.__proxies.forEach(function(x){ if(!x.open){ x.noRelay=true; clearTimeout(x.fbT); } });
          }
          return super.emit.apply(this,arguments);
        }
        destroy(){
          try{ relayHostStop(this); }catch(e){}
          try{ (this.__proxies||[]).forEach(function(x){ x.close(); }); }catch(e){}
          try{ if(chanOwner===this) setTimeout(function(){ if(chanOwner&&chanOwner.destroyed) leaveChannel(); },0); }catch(e){}
          return super.destroy.apply(this,arguments);
        }
      };
      W.__radioWrapped=true;
    }catch(e){ return P; }
    return W;
  }
  try{
    var cur=window.Peer;
    if(cur) cur=wrap(cur);
    Object.defineProperty(window,'Peer',{configurable:true,enumerable:true,
      get:function(){ return cur; },
      set:function(v){ if(window.__RADIO_TEST_PEER) v=window.__RADIO_TEST_PEER; cur=wrap(v); }});
  }catch(e){}

  // ================= 3. radio: presenze e voce sul ponte =================
  var myId=rid()+rid(), members={}, micStream=null, talking=false, status='', needTap=false, stT=null;
  function chanT(){ return 'r/'+tclean(chan); }
  var lastName='';
  document.addEventListener('input',function(e){ var t=e.target; if(t&&t.matches&&t.matches('#nickname,#name,#nome,#nick,#playerName,#nm,#cs')) lastName=String(t.value||''); },true);
  function myName(){
    var el=document.querySelector('#nickname,#name,#nome,#nick,#playerName,#nm,#cs');
    var v=el&&el.value?String(el.value).trim():(lastName||'').trim();
    if(!v){ try{ v=localStorage.getItem('autoscontri-name')||localStorage.getItem('br3_name')||''; }catch(e){} }
    return clean(v);
  }
  function clean(s){ return String(s||'').replace(/[\u0000-\u001f<>]/g,'').slice(0,14)||'Giocatore'; }
  function joinChannel(){
    if(!chan) return;
    members={};
    rsub(chanT(),onRadio);
    clearInterval(stT); stT=setInterval(announce,2000); announce();
    render();
  }
  function leaveChannel(){
    if(chan){ try{ rpub(chanT(),{t:'bye',id:myId}); }catch(e){} runsub(chanT()); }
    clearInterval(stT); members={}; chan=''; chanOwner=null; setTalk(false); render();
  }
  function announce(){ if(chan) rpub(chanT(),{t:'st',id:myId,n:myName(),vo:micStream?1:0,tk:talking?1:0}); expire(); render(); }
  function expire(){ var t=nowMs(); for(var id in members) if(t-members[id].last>7000) delete members[id]; }
  function onRadio(o){
    if(typeof o.id!=='string'||o.id===myId) return;
    var m=members[o.id]||(members[o.id]={n:'Giocatore',vo:0,tk:0,last:0,heard:0,next:0});
    m.last=nowMs();
    if(o.t==='st'){ m.n=clean(o.n); m.vo=o.vo?1:0; m.tk=o.tk?1:0; render(); }
    else if(o.t==='a'&&typeof o.d==='string'){ m.heard=nowMs(); m.n=o.n?clean(o.n):m.n; playChunk(m,o.d); if(!m.tkShow){ m.tkShow=1; render(); } }
    else if(o.t==='bye'){ delete members[o.id]; render(); }
  }

  // --- audio: 8000 Hz, mu-law (come una radio/telefono), pacchetti da 200 ms ---
  var AC=null, proc=null, srcNode=null, sinkGain=null, buf=[], pos=0, aSeq=0;
  function ensureAC(){
    if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ AC=new C(); }catch(e){ return null; } }
    if(AC.state==='suspended'&&AC.resume){ try{ AC.resume(); }catch(e){} }
    return AC;
  }
  function muEnc(x){ var s=x<0?0x80:0; if(x<0) x=-x; if(x>1) x=1; var v=Math.min(32635,Math.floor(x*32767))+132, e=7; for(var m=0x4000;(v&m)===0&&e>0;m>>=1) e--; var man=(v>>(e+3))&0x0F; return ~(s|(e<<4)|man)&0xFF; }
  var MU=new Float32Array(256);
  (function(){ for(var i=0;i<256;i++){ var u=~i&0xFF, s=u&0x80, e=(u>>4)&7, m=u&0x0F, v=((m<<3)+132)<<e; v-=132; MU[i]=(s?-v:v)/32768; } })();
  function b64(bytes){ var s=''; for(var i=0;i<bytes.length;i+=4096) s+=String.fromCharCode.apply(null,bytes.slice(i,i+4096)); return btoa(s); }
  function unb64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  function startCapture(stream){
    var ac=ensureAC(); if(!ac) return false;
    try{
      srcNode=ac.createMediaStreamSource(stream);
      proc=(ac.createScriptProcessor||ac.createJavaScriptNode).call(ac,4096,1,1);
      sinkGain=ac.createGain(); sinkGain.gain.value=0;
      srcNode.connect(proc); proc.connect(sinkGain); sinkGain.connect(ac.destination);
    }catch(e){ return false; }
    var ratio=ac.sampleRate/8000;
    proc.onaudioprocess=function(ev){
      if(!talking||!chan) { pos=0; return; }
      var inp=ev.inputBuffer.getChannelData(0), n=inp.length;
      while(pos<n){
        var a=Math.floor(pos), b=Math.min(n,Math.floor(pos+ratio)), sum=0, c=0;
        for(var i=a;i<b;i++){ sum+=inp[i]; c++; }
        buf.push(muEnc(c?sum/c:inp[a]||0)); pos+=ratio;
      }
      pos-=n;
      if(buf.length>=1600) flush();
    };
    return true;
  }
  function flush(){ if(!buf.length) return; var bytes=buf; buf=[]; rpub(chanT(),{t:'a',id:myId,n:myName(),s:++aSeq,d:b64(bytes)}); }
  function playChunk(m,d){
    var ac=AC; if(!ac||ac.state!=='running'){ needTap=true; ensureAC(); render(); if(!ac) return; }
    var bytes; try{ bytes=unb64(d); }catch(e){ return; }
    if(!bytes.length||bytes.length>8000) return;
    var sr=ac.sampleRate, len=Math.floor(bytes.length*sr/8000), out=ac.createBuffer(1,len,sr), ch=out.getChannelData(0), k=8000/sr;
    for(var i=0;i<len;i++){ var p=i*k, j=Math.floor(p), f=p-j, x0=MU[bytes[j]], x1=MU[bytes[Math.min(bytes.length-1,j+1)]]; ch[i]=(x0+(x1-x0)*f)*1.6; }
    var s=ac.createBufferSource(); s.buffer=out; s.connect(ac.destination);
    var t=ac.currentTime;
    if(m.next<t+0.05||m.next>t+1.2) m.next=t+0.25;
    try{ s.start(m.next); }catch(e){}
    m.next+=out.duration;
  }
  function micOn(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ status='Questo browser non permette il microfono'; render(); return; }
    ensureAC();
    status='Consenti il microfono…'; render();
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false}).then(function(s){
      micStream=s; status='';
      if(!startCapture(s)){ status='Audio non disponibile su questo browser'; }
      announce();
    },function(){ status='Microfono non consentito'; render(); });
  }
  function micOff(){
    setTalk(false);
    try{ if(proc){ proc.onaudioprocess=null; proc.disconnect(); } if(srcNode) srcNode.disconnect(); if(sinkGain) sinkGain.disconnect(); }catch(e){}
    proc=null; srcNode=null; sinkGain=null;
    if(micStream){ try{ micStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} }
    micStream=null; announce();
  }
  function setTalk(b){
    var t=!!(b&&micStream&&chan);
    if(t===talking) return;
    talking=t; if(!t) flush(); else { ensureAC(); buf=[]; pos=0; }
    announce();
  }
  function unlock(){
    var ac=AC||(needTap||micStream?ensureAC():null);
    if(!AC) ensureAC(); else if(AC.state==='suspended') ensureAC();
    if(needTap){ needTap=false; render(); }
  }
  window.addEventListener('pointerdown',unlock,true);
  window.addEventListener('touchstart',unlock,{capture:true,passive:true});
  window.addEventListener('keydown',function(){ if(!AC||AC.state!=='running') unlock(); },true);
  function isTyping(e){ var t=e.target; return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable); }
  window.addEventListener('keydown',function(e){ if(e.code===TALK_KEY&&!isTyping(e)&&micStream&&!e.repeat) setTalk(true); },true);
  window.addEventListener('keyup',function(e){ if(e.code===TALK_KEY) setTalk(false); },true);
  window.addEventListener('blur',function(){ setTalk(false); });

  // ================= 4. pulsanti sullo schermo =================
  var box=null, bRadio, bTalk, lab;
  function el(tag){ return document.createElement(tag); }
  function build(){
    if(box||!document.body) return;
    var css=el('style');
    css.textContent='#radioSq{position:fixed;right:max(8px,env(safe-area-inset-right));top:38%;z-index:2147483000;display:none;flex-direction:column;align-items:flex-end;gap:6px;font:600 13px system-ui,-apple-system,Arial,sans-serif;-webkit-user-select:none;user-select:none;pointer-events:none}'+
      '#radioSq button{pointer-events:auto;border:2px solid #f2d9a8;color:#fff8e8;border-radius:22px;font:700 13px system-ui,-apple-system,Arial,sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}'+
      '#radioSq .r{background:#3b2a1acc;padding:7px 12px}#radioSq .r.on{background:#1f6b3acc}'+
      '#radioSq .t{width:66px;height:66px;border-radius:50%;background:#8a1e1ecc;font-size:14px;line-height:1.1}#radioSq .t.on{background:#e23b2a;box-shadow:0 0 0 5px #e23b2a55}'+
      '#radioSq .l{background:#000a;color:#ffe9b0;padding:4px 9px;border-radius:9px;max-width:190px;text-align:right;display:none}';
    document.head.appendChild(css);
    box=el('div'); box.id='radioSq';
    bRadio=el('button'); bRadio.className='r';
    bTalk=el('button'); bTalk.className='t'; bTalk.innerHTML='🎙<br>PARLA';
    lab=el('div'); lab.className='l';
    box.appendChild(bRadio); box.appendChild(bTalk); box.appendChild(lab);
    document.body.appendChild(box);
    // tocco breve = accendi/spegni; tieni premuto e trascina = sposta la radio
    var drag=null;

<style>
:root{--bg:#06121f;--pan:#0f2236;--line:#1f3a57;--tx:#eaf2fb;--mut:#8ea6bf;--acc:#ffb020;--red:#ff4d4d;--grn:#36d399;--sea1:#0b3a66;--sea2:#0e4b80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at top,#0c2742,#06121f 70%);color:var(--tx);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--pan);border-radius:12px;padding:10px 14px;cursor:pointer}
button:active{filter:brightness(1.3)}
button:disabled{opacity:.35;pointer-events:none}
button.pri{background:var(--acc);color:#1b1200;border:0;font-weight:800}
input{font:inherit;color:var(--tx);background:#0a1a2b;border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;-webkit-user-select:text;user-select:text}
.scr{display:none;height:100%;flex-direction:column}
.scr.on{display:flex}
/* LOBBY */
#lobby{align-items:center;justify-content:center;padding:20px;overflow:auto}
#lobby .card{width:min(420px,100%);background:rgba(15,34,54,.85);border:1px solid var(--line);border-radius:18px;padding:20px}
#lobby h1{margin:0 0 4px;font-size:26px;letter-spacing:.02em}
#lobby .sub{color:var(--mut);margin:0 0 16px;font-size:14px}
#lobby label{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px}.seg button.on{background:var(--acc);color:#1b1200;border-color:var(--acc);font-weight:800}
#codeBig{font:800 44px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;text-align:center;margin:10px 0;color:var(--acc)}
.note{color:var(--mut);font-size:13px;line-height:1.45}
#lobStatus{margin-top:12px;min-height:20px;color:var(--mut);font-size:13.5px;text-align:center}
/* GIOCO */
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
#turnBox{flex:1;font-weight:800;font-size:16px;padding:8px 12px;border-radius:12px;background:var(--pan);border:1px solid var(--line);text-align:center}
#turnBox.me{background:linear-gradient(90deg,#7a4a00,#b36b00);border-color:var(--acc)}
#turnBox small{display:block;font-weight:500;font-size:12.5px;color:#ffe3ad}
#turnBox:not(.me) small{color:var(--mut)}
#net{font-size:12px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
#net.ok{border-color:var(--grn);color:#a8f0cf}#net.bad{border-color:var(--red);color:#ffb3b3}
#tabs{display:flex;gap:6px;padding:0 10px 6px}
#tabs button{flex:1;padding:8px}#tabs button.on{background:#1b3a5c;border-color:#3b6a99;font-weight:700}
#area{flex:1;display:flex;gap:18px;justify-content:center;align-items:flex-start;padding:4px 10px;min-height:0;overflow:auto}
.side{display:none;flex-direction:column;align-items:center}
.side.on{display:flex}
.side h3{margin:0 0 6px;font-size:14px;color:var(--mut);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.bwrap{position:relative;padding:16px 0 0 18px;--bs:min(calc(100vw - 40px),calc(100vh - 290px),560px)}
.board{position:relative;width:var(--bs);height:var(--bs);display:grid;grid-template:repeat(12,1fr)/repeat(12,1fr);border-radius:8px;overflow:hidden;
  background:linear-gradient(160deg,var(--sea2),var(--sea1));box-shadow:0 8px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08)}
.board::before{content:"";position:absolute;inset:-50%;pointer-events:none;opacity:.22;will-change:transform;
  background:repeating-radial-gradient(ellipse at 30% 40%,transparent 0 14px,rgba(255,255,255,.35) 15px,transparent 17px 30px);animation:waves 14s linear infinite}
.enemy .board{background:linear-gradient(160deg,#0f3d52,#0a2a40)}
@keyframes waves{from{transform:translate(0,0) rotate(0)}to{transform:translate(8%,6%) rotate(8deg)}}
.cell{border-right:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);position:relative;z-index:1}
.enemy.can .cell:hover{background:rgba(255,176,32,.22);cursor:crosshair}
.cell.tgt{background:rgba(54,211,153,.28);box-shadow:inset 0 0 0 2px rgba(54,211,153,.7);cursor:pointer}
.cell.bad{background:rgba(255,77,77,.25)}
.lab{position:absolute;font-size:10.5px;color:var(--mut);transform:translate(-50%,-50%);pointer-events:none}
.layer{position:absolute;inset:0;pointer-events:none;z-index:2}
.unit{position:absolute;transition:left .45s ease,top .45s ease,transform .45s ease;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.unit.sel svg{filter:drop-shadow(0 0 5px #ffd36b) drop-shadow(0 0 2px #fff)}
.unit.sunk{opacity:.55;filter:grayscale(.7) drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.unit svg{width:100%;height:100%;display:block;overflow:visible}
.plane svg{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-2%) scale(1)}50%{transform:translateY(2%) scale(.96)}}
.fire{animation:flick .5s ease-in-out infinite alternate;transform-origin:center}
@keyframes flick{from{opacity:.75}to{opacity:1}}
.mk{position:absolute;display:flex;align-items:center;justify-content:center;transition:opacity .4s}
.mk i{display:block;border-radius:50%}
.mk.miss i{width:34%;height:34%;border:2px solid rgba(255,255,255,.85);background:rgba(255,255,255,.12)}
.mk.hit i,.mk.sunk i{width:56%;height:56%;background:radial-gradient(circle,#fff6c2 0,#ffb020 35%,#ff4d4d 65%,transparent 72%)}
.mk.wreck i{width:40%;height:40%;background:none;border:0}
.mk.wreck::after{content:"✕";color:#bbb;font-weight:900}
.mk.fresh{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(2.2);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
.boom{position:absolute;border-radius:50%;pointer-events:none;z-index:4;animation:boom .7s ease-out forwards}
@keyframes boom{0%{transform:scale(.2);opacity:1}100%{transform:scale(2.6);opacity:0}}
.aim{position:absolute;z-index:4;border:3px solid var(--acc);border-radius:50%;animation:aim .6s ease-in-out infinite alternate;pointer-events:none}
@keyframes aim{from{transform:scale(.7)}to{transform:scale(1.05)}}
#ctrl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 10px;min-height:56px;align-items:center}
#ctrl .chip{padding:7px 10px;font-size:13px;border-radius:10px}
#ctrl .chip.on{border-color:var(--acc);background:#3a2a07}
#ctrl .chip.done{opacity:.55}
#ctrl .ar{width:48px;height:44px;font-size:20px;padding:0}
#log{font-size:13px;color:#c9d8e8;padding:0 12px 8px;text-align:center;min-height:22px}
#over{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,10,18,.82);text-align:center;padding:20px}
#over h2{font-size:42px;margin:0 0 8px}
#over p{color:var(--mut)}
#over .row{gap:10px;margin-top:14px}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:40;background:rgba(0,0,0,.85);border:1px solid #444;border-radius:14px;padding:14px 20px;font-size:22px;font-weight:800;display:none;text-align:center;max-width:88%}
@media (min-width:900px){
  #tabs{display:none}
  .side{display:flex!important}
  .bwrap{--bs:min(calc(50vw - 70px),calc(100vh - 230px),600px)}
}
</style>
</head>
<body>

<section class="scr on" id="lobby">
  <div class="card">
    <h1>⚓ Battaglia Navale e Aerea</h1>
    <p class="sub">Due giocatori, due dispositivi. Navi e aerei si possono spostare durante la partita.</p>
    <label>Il tuo nome</label>
    <input id="name" maxlength="16" autocomplete="off">
    <div id="lobMain">
      <label>Colpi per turno (decide chi crea)</label>
      <div class="seg" id="segShots"><button data-v="1">1</button><button data-v="2" class="on">2</button><button data-v="3">3</button></div>
      <button class="pri" id="bHost" style="width:100%;margin-top:16px;padding:16px;font-size:17px">Crea partita</button>
      <label>Oppure entra con il codice</label>
      <div class="row"><input id="code" maxlength="5" placeholder="ABCDE" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.2em;font-weight:700"><button id="bJoin" style="flex:0 0 auto;padding:12px 18px">Entra</button></div>
    </div>
    <div id="lobWait" style="display:none">
      <p class="note" style="text-align:center;margin:14px 0 0">Codice della partita:</p>
      <div id="codeBig">-----</div>
      <button class="pri" id="bShare" style="width:100%;padding:14px">Invia il link all’avversario</button>
      <p class="note" style="text-align:center">Oppure digli il codice: lo inserisce in “Entra”.</p>
      <button id="bCancel" style="width:100%">Annulla</button>
    </div>
    <div id="lobStatus"></div>
  </div>
</section>

<section class="scr" id="game">
  <div id="top"><div id="turnBox">—</div><span id="net">● collegato</span></div>
  <div id="tabs"><button id="tEnemy">🎯 Mare nemico</button><button id="tOwn">🚢 La mia flotta</button></div>
  <div id="area">
    <div class="side enemy" id="sEnemy"><h3 id="hEnemy">Mare nemico</h3><div class="bwrap" id="wEnemy"></div></div>
    <div class="side own" id="sOwn"><h3>La mia flotta</h3><div class="bwrap" id="wOwn"></div></div>
  </div>
  <div id="ctrl"></div>
  <div id="log"></div>
</section>

<div id="over"><h2 id="oTitle"></h2><p id="oSub"></p><div class="row"><button class="pri" id="bAgain">Rivincita</button><button id="bQuit">Esci</button></div></div>
<div id="toast"></div>

/* ================= grafica unità ================= */
function shipSVG(u,enemy){
  const L=u.len*100,hull=enemy?'#7a2b2b':(u.sunk?'#56616d':'#9aa8b6'),deck=enemy?'#5a1f1f':(u.sunk?'#3e4752':'#6d7c8b');
  let s=`<svg viewBox="0 0 ${L} 100" preserveAspectRatio="none"><path d="M12,28 L${L-48},26 Q${L-4},50 ${L-48},74 L12,72 Q2,50 12,28Z" fill="${hull}" stroke="#1c2733" stroke-width="3"/>`;
  if(u.id==='PA'){s+=`<rect x="22" y="36" width="${L-90}" height="28" rx="4" fill="${deck}"/><line x1="30" y1="50" x2="${L-80}" y2="50" stroke="#e8edf2" stroke-width="3" stroke-dasharray="14 10"/><rect x="${L*0.55}" y="20" width="34" height="18" rx="3" fill="#cfd8e1" stroke="#1c2733" stroke-width="2"/>`;}
  else if(u.id==='SM'){s+=`<rect x="${L*0.38}" y="36" width="${L*0.18}" height="28" rx="10" fill="${deck}" stroke="#1c2733" stroke-width="2"/><line x1="${L*0.47}" y1="36" x2="${L*0.47}" y2="18" stroke="#1c2733" stroke-width="4"/>`;}
  else{for(let i=0;i<u.len;i++){const cx=i*100+50;if(i===u.len-1){s+=`<circle cx="${cx-14}" cy="50" r="11" fill="${deck}" stroke="#1c2733" stroke-width="2"/><line x1="${cx-14}" y1="50" x2="${cx+18}" y2="50" stroke="#1c2733" stroke-width="5"/>`;}else if(i===Math.floor(u.len/2)-(u.len%2?0:1)){s+=`<rect x="${cx-22}" y="34" width="44" height="32" rx="5" fill="#cfd8e1" stroke="#1c2733" stroke-width="2"/>`;}else{s+=`<circle cx="${cx}" cy="50" r="12" fill="${deck}" stroke="#1c2733" stroke-width="2"/><line x1="${cx}" y1="50" x2="${cx+30}" y2="50" stroke="#1c2733" stroke-width="5"/>`;}}}
  if(!enemy)u.hits.forEach((h,i)=>{if(h)s+=`<g class="fire"><circle cx="${i*100+50}" cy="50" r="26" fill="#ff4d4d" opacity=".55"/><circle cx="${i*100+50}" cy="50" r="15" fill="#ffb020"/><circle cx="${i*100+50}" cy="47" r="7" fill="#fff3b0"/></g>`;});
  return s+'</svg>';
}
function planeSVG(u,enemy){
  const b=enemy?'#8a2f2f':(u.sunk?'#56616d':'#d8e2ec'),w=enemy?'#6a2323':(u.sunk?'#444d57':'#9fb3c7');
  let s=`<svg viewBox="0 0 100 100"><path d="M50,6 L56,30 L92,52 L92,60 L56,50 L54,78 L66,88 L66,94 L50,89 L34,94 L34,88 L46,78 L44,50 L8,60 L8,52 L44,30Z" fill="${b}" stroke="#1c2733" stroke-width="3" stroke-linejoin="round"/><path d="M50,14 L53,30 L47,30Z" fill="${w}"/>`;
  if(!enemy&&u.hits[0])s+=`<g class="fire"><circle cx="50" cy="50" r="24" fill="#ff4d4d" opacity=".6"/><circle cx="50" cy="50" r="13" fill="#ffb020"/></g>`;
  return s+'</svg>';
}
function placeEl(el,u){
  const p=100/N;
  if(u.kind==='aereo'){el.style.left=u.c*p+'%';el.style.top=u.r*p+'%';el.style.width=p+'%';el.style.height=p+'%';el.style.transform=`rotate(${u.hdg||0}deg)`;el.style.transformOrigin='50% 50%';}
  else if(u.dir==='H'){el.style.left=u.c*p+'%';el.style.top=u.r*p+'%';el.style.width=u.len*p+'%';el.style.height=p+'%';el.style.transformOrigin='0 0';el.style.transform='none';}
  else{el.style.left=(u.c+1)*p+'%';el.style.top=u.r*p+'%';el.style.width=u.len*p+'%';el.style.height=p+'%';el.style.transformOrigin='0 0';el.style.transform='rotate(90deg)';}
}

/* ================= tavole ================= */
const boards={};
function buildBoard(key,wrap){
  wrap.innerHTML='';const b=document.createElement('div');b.className='board';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');d.className='cell';d.dataset.r=r;d.dataset.c=c;b.appendChild(d);}
  const units=document.createElement('div');units.className='layer';const marks=document.createElement('div');marks.className='layer';
  b.appendChild(marks);b.appendChild(units);wrap.appendChild(b);
  for(let i=0;i<N;i++){const t=document.createElement('div');t.className='lab';t.textContent=LET[i];t.style.left=`calc(18px + var(--bs) * ${(i+.5)/N})`;t.style.top='8px';wrap.appendChild(t);
    const l=document.createElement('div');l.className='lab';l.textContent=i+1;l.style.left='9px';l.style.top=`calc(16px + var(--bs) * ${(i+.5)/N})`;wrap.appendChild(l);}
  b.addEventListener('click',e=>{const t=e.target.closest('.cell');if(t)onCell(key,+t.dataset.r,+t.dataset.c);});
  boards[key]={b,units,marks,els:{}};
}
function markHTML(list,fresh){
  const p=100/N;
  return list.map((m,i)=>{const age=S.turn-m.turn;const op=m.turn===undefined?1:age<=1?1:age<=3?.7:age<=5?.5:.33;
    return `<div class="mk ${m.res}${fresh&&i===list.length-1?' fresh':''}" style="left:${m.c*p}%;top:${m.r*p}%;width:${p}%;height:${p}%;opacity:${op}"><i></i></div>`;}).join('');
}
let freshOwn=false,freshEnemy=false;
function render(){
  // propria
  const O=boards.own;
  S.units.forEach(u=>{let el=O.els[u.id];
    if(!u.placed){if(el){el.remove();delete O.els[u.id];}return;}
    if(!el){el=document.createElement('div');O.units.appendChild(el);O.els[u.id]=el;}
    el.className='unit'+(u.kind==='aereo'?' plane':'')+(u.sunk?' sunk':'')+(S.sel===u?' sel':'');
    const html=u.kind==='aereo'?planeSVG(u):shipSVG(u);if(el._h!==html){el.innerHTML=html;el._h=html;}
    placeEl(el,u);});
  O.marks.innerHTML=markHTML(S.incoming.filter(m=>m.res==='miss'||m.res==='wreck'),freshOwn);freshOwn=false;
  // nemico
  const E=boards.enemy;
  const shown=S.enemyReveal||S.enemySunk;
  E.units.innerHTML='';
  shown.forEach(x=>{const u={...x,hits:Array(x.len).fill(false),sunk:!!x.sunkFlag};const el=document.createElement('div');el.className='unit'+(x.kind==='aereo'?' plane':'')+(x.sunkFlag?' sunk':'');el.innerHTML=x.kind==='aereo'?planeSVG(u,true):shipSVG(u,true);placeEl(el,u);E.units.appendChild(el);});
  E.marks.innerHTML=markHTML(S.shots,freshEnemy);freshEnemy=false;
  // evidenzia mosse aereo
  O.b.querySelectorAll('.cell.tgt').forEach(c=>c.classList.remove('tgt'));
  if(S.phase==='play'&&S.sel&&S.sel.kind==='aereo'&&canMove()){
    for(let dr=-PLANE_RANGE;dr<=PLANE_RANGE;dr++)for(let dc=-PLANE_RANGE;dc<=PLANE_RANGE;dc++){if(!dr&&!dc)continue;const r=S.sel.r+dr,c=S.sel.c+dc;if(fits(S.sel,r,c,'H'))O.b.children[r*N+c].classList.add('tgt');}
  }
  $('#sEnemy').classList.toggle('can',S.phase==='play'&&S.myTurn&&!S.pending&&S.shotsLeft>0);
  renderTop();renderCtrl();
}

/* ================= barra e controlli ================= */
function renderTop(){
  const tb=$('#turnBox');tb.classList.toggle('me',S.phase==='play'&&S.myTurn);
  if(S.phase==='place')tb.innerHTML='Schiera la flotta<small>tocca un’unità, poi la casella · “Casuale” per fare prima</small>';
  else if(S.phase==='wait')tb.innerHTML=`In attesa di ${esc(S.oppName)}…<small>sta schierando la flotta</small>`;
  else if(S.phase==='play'){
    if(S.myTurn)tb.innerHTML=`TOCCA A TE · colpi ${S.shotsLeft}/${S.shotsPer}<small>${S.moveUsed?'movimento usato':'puoi spostare 1 unità (La mia flotta)'} · poi spara sul mare nemico</small>`;
    else tb.innerHTML=`Turno di ${esc(S.oppName)}<small>la tua flotta è sotto tiro</small>`;
  }else if(S.phase==='over')tb.innerHTML='Partita finita';
  $('#hEnemy').textContent='Mare di '+S.oppName;
}
function renderCtrl(){
  const C=$('#ctrl');C.innerHTML='';
  const btn=(t,fn,cls='',dis=false)=>{const b=document.createElement('button');b.innerHTML=t;b.className=cls;b.disabled=dis;b.onclick=fn;C.appendChild(b);return b;};
  if(S.phase==='place'){
    S.units.forEach(u=>btn((u.kind==='aereo'?'✈︎ ':'🚢 ')+u.name+(u.len>1?` (${u.len})`:''),()=>{S.sel=u;render();},'chip'+(S.sel===u?' on':'')+(u.placed?' done':'')));
    btn('⟳ Ruota',()=>{const u=S.sel;if(!u||u.kind==='aereo')return;const nd=u.dir==='H'?'V':'H';if(!u.placed)u.dir=nd;else if(fits(u,u.r,u.c,nd))u.dir=nd;else toast('Non c’è spazio per ruotare');render();},'',!S.sel||S.sel.kind==='aereo');
    btn('🎲 Casuale',()=>{randomPlace();S.sel=null;sfx.click();render();});
    btn('✔ Pronto',()=>{S.phase='wait';S.ready=true;S.sel=null;send({t:'ready'});checkStart();render();},'pri',!S.units.every(u=>u.placed));
    return;
  }
  if(S.phase==='play'&&S.myTurn&&S.sel&&canMove()){
    const u=S.sel;
    if(u.kind==='nave'){
      btn('↑',()=>moveShip(-1,0),'ar');btn('↓',()=>moveShip(1,0),'ar');btn('←',()=>moveShip(0,-1),'ar');btn('→',()=>moveShip(0,1),'ar');btn('⟳',rotateShip,'ar');
    }else{const s=document.createElement('span');s.className='note';s.textContent=`Tocca una casella verde (fino a ${PLANE_RANGE} caselle)`;C.appendChild(s);}
    btn('Annulla',()=>{S.sel=null;render();});
  }else if(S.phase==='play'&&S.myTurn){
    const s=document.createElement('span');s.className='note';
    s.textContent=canMove()?'Per spostare: apri “La mia flotta” e tocca una nave o un aereo':'Spara sul mare nemico';C.appendChild(s);
  }
}
function esc(s){return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
let toastT;function toast(t,ms=1500){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',ms);}
function log(t){$('#log').textContent=t;}

/* ================= tab (telefono) ================= */
let tab='enemy';
function setTab(t){tab=t;$('#tEnemy').classList.toggle('on',t==='enemy');$('#tOwn').classList.toggle('on',t==='own');$('#sEnemy').classList.toggle('on',t==='enemy');$('#sOwn').classList.toggle('on',t==='own');}
$('#tEnemy').onclick=()=>setTab('enemy');$('#tOwn').onclick=()=>setTab('own');

/* ================= interazione ================= */
function canMove(){return S.phase==='play'&&S.myTurn&&!S.moveUsed&&S.shotsLeft>0&&!S.pending;}
function onCell(key,r,c){
  unlockAudio();
  if(key==='own'){
    if(S.phase==='place'){
      const hit=unitAt(r,c);
      if(S.sel&&(!hit||hit===S.sel)){
        if(fits(S.sel,r,c,S.sel.dir)){Object.assign(S.sel,{r,c,placed:true});sfx.click();const nx=S.units.find(u=>!u.placed);S.sel=nx||null;}
        else toast('Non entra qui');
      }else if(hit){S.sel=hit;}
      render();return;
    }
    if(S.phase==='play'&&canMove()){
      if(S.sel&&S.sel.kind==='aereo'&&boards.own.b.children[r*N+c].classList.contains('tgt')){movePlane(r,c);return;}
      const u=unitAt(r,c);if(u&&!u.sunk){S.sel=S.sel===u?null:u;render();}
    }
    return;
  }
  if(key==='enemy'&&S.phase==='play'&&S.myTurn&&!S.pending&&S.shotsLeft>0)fire(r,c);
}
function afterMove(u){S.moveUsed=true;S.sel=null;sfx.move();send({t:'moved',kind:u.kind});log(`Hai spostato ${u.name}`);render();}
function moveShip(dr,dc){const u=S.sel;if(fits(u,u.r+dr,u.c+dc,u.dir)){u.r+=dr;u.c+=dc;afterMove(u);}else toast('Bloccato');}
function rotateShip(){const u=S.sel,k=Math.floor(u.len/2),[pr,pc]=cells(u)[k];const nd=u.dir==='H'?'V':'H';const r=nd==='V'?pr-k:pr,c=nd==='V'?pc:pc-k;if(fits(u,r,c,nd)){Object.assign(u,{r,c,dir:nd});afterMove(u);}else toast('Non c’è spazio per ruotare');}
function movePlane(r,c){const u=S.sel;u.hdg=Math.round(Math.atan2(c-u.c,-(r-u.r))*180/Math.PI);u.r=r;u.c=c;afterMove(u);}

/* ================= colpi ================= */
function fire(r,c){
  S.shotSeq++;const id=S.turn+'-'+S.shotSeq;S.pending={id,r,c};S.sel=null;
  const p=100/N,a=document.createElement('div');a.className='aim';a.id='aim';a.style.cssText=`left:${c*p}%;top:${r*p}%;width:${p}%;height:${p}%`;boards.enemy.b.appendChild(a);
  sfx.fire();send({t:'shot',id,r,c});render();
}
function resolveShot(m){
  if(S.resCache[m.id])return S.resCache[m.id];
  const {r,c}=m;const u=unitAt(r,c);let res='miss',unit=null;
  if(u&&u.sunk)res='wreck';
  else if(u){const i=cells(u).findIndex(([a,b])=>a===r&&b===c);const dup=u.hits[i];u.hits[i]=true;res='hit';
    if(u.hits.every(Boolean)){u.sunk=true;res='sunk';unit={id:u.id,name:u.name,kind:u.kind,f:u.f,len:u.len,r:u.r,c:u.c,dir:u.dir,hdg:u.hdg,sunkFlag:true};}
    else if(dup)res='hit';}
  const lost=S.units.every(x=>x.sunk);
  const out={t:'res',id:m.id,r,c,res,unit,lost,name:u?u.name:null,kind:u?u.kind:null};
  S.resCache[m.id]=out;
  S.incoming.push({r,c,res,turn:S.turn});freshOwn=true;
  if(res==='miss'){sfx.splash();log(`${S.oppName} spara su ${cellName(r,c)}: acqua`);}
  else if(res==='wreck'){log(`${S.oppName} colpisce un relitto in ${cellName(r,c)}`);}
  else{sfx.boom();flash('own',r,c);log(res==='sunk'?`${S.oppName}: ${u.name} ${destr(u).toLowerCase()}!`:`${S.oppName} ha colpito: ${u.name} in ${cellName(r,c)}`);if(res==='sunk')toast(`💥 ${u.name} ${destr(u)}`);}
  if(lost)setTimeout(()=>gameOver(false),900);
  render();return out;
}
function onResult(m){
  if(!S.pending||S.pending.id!==m.id)return;
  S.pending=null;const a=$('#aim');if(a)a.remove();
  S.shots.push({r:m.r,c:m.c,res:m.res,turn:S.turn});freshEnemy=true;
  if(m.res==='miss'){sfx.splash();log(`${cellName(m.r,m.c)}: acqua`);}
  else if(m.res==='wreck'){log(`${cellName(m.r,m.c)}: relitto già distrutto`);}
  else{sfx.boom();flash('enemy',m.r,m.c);
    if(m.res==='sunk'){S.enemySunk.push(m.unit);toast(`${m.unit.kind==='aereo'?'✈︎':'🚢'} ${m.unit.name} ${destr(m.unit)}!`,1800);log(`${m.unit.name} ${destr(m.unit).toLowerCase()}!`);}
    else{toast('🔥 COLPITO!',900);log(`${cellName(m.r,m.c)}: colpito ${m.kind==='aereo'?'un aereo':'una nave'}!`);}}
  S.shotsLeft--;
  if(m.lost){render();setTimeout(()=>gameOver(true),900);return;}
  if(S.shotsLeft<=0)endTurn();
  render();
}
function endTurn(){S.lastEnd=S.turn;send({t:'endturn',turn:S.turn});S.myTurn=false;S.sel=null;S.turn++;setTimeout(()=>{if(!S.myTurn&&S.phase==='play')setTab('own');},1200);}
function beginMyTurn(){S.myTurn=true;S.shotsLeft=S.shotsPer;S.moveUsed=false;S.shotSeq=0;sfx.turn();toast('🎯 Tocca a te',1000);setTab('enemy');render();}
function flash(key,r,c){const p=100/N,d=document.createElement('div');d.className='boom';d.style.cssText=`left:${c*p}%;top:${r*p}%;width:${p}%;height:${p}%;background:radial-gradient(circle,#fff6c2,#ffb020 40%,rgba(255,77,77,.6) 60%,transparent 70%)`;boards[key].b.appendChild(d);setTimeout(()=>d.remove(),800);}

/* ================= fine partita ================= */
function gameOver(win){
  if(S.phase==='over')return;S.phase='over';S.myTurn=false;
  send({t:'reveal',units:S.units.map(u=>({id:u.id,name:u.name,kind:u.kind,len:u.len,r:u.r,c:u.c,dir:u.dir,hdg:u.hdg,sunkFlag:u.sunk}))});
  $('#oTitle').textContent=win?'🏆 HAI VINTO!':'💀 HAI PERSO';
  $('#oSub').textContent=win?`Hai distrutto tutta la flotta di ${S.oppName}.`:`${S.oppName} ha distrutto tutta la tua flotta.`;
  $('#over').style.display='flex';win?sfx.win():sfx.lose();render();
}
$('#bAgain').onclick=()=>{send({t:'again'});restart();};
$('#bQuit').onclick=()=>location.reload();
function restart(){const keep={shotsPer:S.shotsPer,isHost:S.isHost,oppName:S.oppName};newState(keep);$('#over').style.display='none';setTab('own');render();log('Nuova partita: schiera la flotta');}
function checkStart(){
  if(S.isHost&&S.ready&&S.oppReady&&S.phase==='wait'){const first=Math.random()<.5?'host':'guest';send({t:'start',first});startPlay(first==='host');}
}
function startPlay(meFirst){S.phase='play';S.turn=0;log(meFirst?'Inizi tu!':`Inizia ${S.oppName}`);if(meFirst)beginMyTurn();else{S.myTurn=false;setTab('own');render();}}

/* ================= messaggi ================= */
function onMsg(m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case 'hello':
      S.oppName=String(m.name||'Avversario').slice(0,16);
      if(S.isHost)send({t:'settings',shotsPer:S.shotsPer});
      if(!inGame)enterGame();else{netUI(true);resync();}
      break;
    case 'settings':S.shotsPer=Math.min(3,Math.max(1,m.shotsPer|0));render();break;
    case 'ready':S.oppReady=true;checkStart();break;
    case 'start':startPlay(m.first==='guest');break;
    case 'shot':if(S.phase==='play'){const out=resolveShot(m);send(out);}break;
    case 'res':onResult(m);break;
    case 'moved':log(`${S.oppName} ha spostato ${m.kind==='aereo'?'un aereo':'una nave'}`);break;
    case 'endturn':if(m.turn===S.turn&&S.phase==='play'&&!S.myTurn){S.turn++;beginMyTurn();}break;
    case 'reveal':S.enemyReveal=m.units;if(S.phase!=='over'){const allSunk=m.units.every(u=>u.sunkFlag);gameOver(allSunk);}render();break;
    case 'again':if(S.phase==='over')restart();break;
  }
}
function resync(){ // dopo una riconnessione rimanda ciò che può essersi perso
  if(S.pending)send({t:'shot',id:S.pending.id,r:S.pending.r,c:S.pending.c});
  if(S.phase==='play'&&!S.myTurn&&S.lastEnd===S.turn-1)send({t:'endturn',turn:S.lastEnd});
  if(S.ready)send({t:'ready'});
}

/* ================= rete ================= */
let peer=null,conn=null,code='',inGame=false,retryT=null;
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genCode(){let s='';for(let i=0;i<5;i++)s+=ALPH[Math.floor(Math.random()*ALPH.length)];return s;}
function send(m){try{if(conn&&conn.open)conn.send(m);}catch(_){}}
function netUI(ok,t){const n=$('#net');n.className=ok?'ok':'bad';n.textContent=ok?'● collegato':('● '+(t||'disconnesso'));}
function lob(t){$('#lobStatus').textContent=t;}
function myName(){const n=($('#name').value||'').trim()||'Giocatore';try{localStorage.setItem('bn-name',n);}catch(_){}return n;}
function attach(c){
  conn=c;
  c.on('open',()=>{netUI(true);send({t:'hello',name:myName()});});
  c.on('data',onMsg);
  c.on('close',()=>{netUI(false);if(inGame&&!S.isHost)scheduleRetry();});
  c.on('error',()=>netUI(false,'errore'));
}
function hostGame(){
  unlockAudio();myName();S.isHost=true;code=genCode();lob('Creo la partita…');
  if(peer)peer.destroy();
  peer=new Peer('bnav-'+code,{debug:0});
  peer.on('open',()=>{$('#lobMain').style.display='none';$('#lobWait').style.display='block';$('#codeBig').textContent=code;lob('In attesa dell’avversario…');});
  peer.on('connection',c=>{if(conn&&conn.open&&conn!==c){c.on('open',()=>c.close());return;}attach(c);});
  peer.on('disconnected',()=>{try{peer.reconnect();}catch(_){}});
  peer.on('error',e=>{if(e.type==='unavailable-id'){hostGame();}else{lob('Errore di rete: '+e.type+'. Controlla la connessione e riprova.');if(inGame)netUI(false,'rete');}});
}
function joinGame(c){
  unlockAudio();myName();S.isHost=false;code=c.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==5){lob('Il codice è di 5 caratteri');return;}
  lob('Mi collego…');if(peer)peer.destroy();
  peer=new Peer({debug:0});
  peer.on('open',()=>attach(peer.connect('bnav-'+code,{reliable:true})));
  peer.on('disconnected',()=>{try{peer.reconnect();}catch(_){}});
  peer.on('error',e=>{if(e.type==='peer-unavailable'){if(inGame){netUI(false,'avversario assente');scheduleRetry();}else lob('Partita non trovata: controlla il codice (o chi l’ha creata ha chiuso la pagina).');}else{lob('Errore di rete: '+e.type);if(inGame){netUI(false,'rete');scheduleRetry();}}});
}
function scheduleRetry(){clearTimeout(retryT);retryT=setTimeout(()=>{if(conn&&conn.open)return;try{if(peer&&!peer.destroyed){if(peer.disconnected)peer.reconnect();attach(peer.connect('bnav-'+code,{reliable:true}));}}catch(_){}scheduleRetry();},4000);}

/* trasporto locale per prova su un solo computer: apri due schede con #prova */
function localGame(){
  const bc=new BroadcastChannel('bnav-local');const me=Math.random().toString(36).slice(2);let open=false;
  const fake={open:false,handlers:{},on(ev,fn){this.handlers[ev]=fn;},send(m){bc.postMessage({from:me,m});}};
  bc.onmessage=e=>{const d=e.data;if(d.from===me)return;if(d.m&&d.m.t==='__hi'){if(!open){open=true;fake.open=true;bc.postMessage({from:me,m:{t:'__hi'}});S.isHost=me<d.from;fake.handlers.open&&fake.handlers.open();}return;}fake.handlers.data&&fake.handlers.data(d.m);};
  attach(fake);bc.postMessage({from:me,m:{t:'__hi'}});lob('Prova locale: apri un’altra scheda con #prova');
}

/* ================= ingresso nel gioco ================= */
function enterGame(){
  inGame=true;history.replaceState(null,'',location.pathname);
  show('game');buildBoard('enemy',$('#wEnemy'));buildBoard('own',$('#wOwn'));setTab('own');netUI(true);
  log(`Collegato con ${S.oppName}. Schiera la flotta.`);render();sfx.turn();
}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));}

/* ================= suoni ================= */
let actx;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state!=='running')actx.resume();}catch(_){}}
function noise(dur,f,type,vol){if(!actx)return;const n=actx.sampleRate*dur,buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=actx.createBufferSource();s.buffer=buf;const fl=actx.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=actx.createGain();g.gain.value=vol;s.connect(fl).connect(g).connect(actx.destination);s.start();}
function tone(f,dur,vol=.15,type='sine',f2){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,actx.currentTime+dur);g.gain.setValueAtTime(vol,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+dur);}
const sfx={boom:()=>{noise(.9,400,'lowpass',1.2);tone(70,.5,.4,'sine',30);},splash:()=>noise(.45,1200,'bandpass',.6),fire:()=>tone(900,.25,.12,'square',200),
  move:()=>tone(300,.18,.12,'triangle',500),click:()=>tone(700,.06,.1),turn:()=>{tone(660,.12,.15);setTimeout(()=>tone(990,.15,.15),130);},
  win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,.2,'triangle'),i*160)),lose:()=>[392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,.35,.2,'triangle'),i*220))};

/* ================= lobby ================= */
try{$('#name').value=localStorage.getItem('bn-name')||'';}catch(_){}
document.querySelectorAll('#segShots button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#segShots button').forEach(x=>x.classList.toggle('on',x===b));S.shotsPer=+b.dataset.v;});
$('#bHost').onclick=hostGame;
$('#bJoin').onclick=()=>joinGame($('#code').value);
$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')joinGame($('#code').value);});
$('#bCancel').onclick=()=>location.reload();
$('#bShare').onclick=()=>{const url=location.origin+location.pathname+'#'+code;const text=`Sfida a Battaglia Navale! Apri il link o inserisci il codice ${code}`;
  if(navigator.share)navigator.share({title:'Battaglia Navale',text,url}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>lob('Link copiato: incollalo all’avversario')).catch(()=>lob(url));else lob(url);};
(function(){const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,180);gr.addColorStop(0,'#0e4b80');gr.addColorStop(1,'#06121f');g.fillStyle=gr;g.fillRect(0,0,180,180);g.fillStyle='#ffb020';g.font='bold 110px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('⚓',90,96);$('#appicon').href=c.toDataURL();})();
// avvio da link
const h=location.hash.replace('#','');
if(h==='prova'){if(!$('#name').value)$('#name').value='Prova'+Math.floor(Math.random()*90+10);localGame();}
else if(/^[A-Z0-9]{5}$/i.test(h)){$('#code').value=h.toUpperCase();lob('Invito ricevuto: scrivi il tuo nome e premi “Entra”.');}
if(typeof Peer==='undefined'&&h!=='prova')lob('Libreria di rete non caricata.');
</script>
